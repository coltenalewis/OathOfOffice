    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      .scanlines::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.05) 1px,
          rgba(0, 0, 0, 0.1) 1px,
          rgba(0, 0, 0, 0.1) 3px
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .terminal-flicker {
        animation: flicker 3s infinite;
      }

      .glow-pulse {
        animation: glowPulse 2.4s ease-in-out infinite;
      }

      .boot-cursor {
        display: inline-block;
        width: 10px;
        height: 18px;
        background: #38f4c9;
        margin-left: 6px;
        animation: cursorBlink 1s steps(2, start) infinite;
      }

      .panel-overlay {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
      }

      .panel-overlay.is-open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      @keyframes flicker {
        0%,
        19%,
        21%,
        23%,
        80%,
        100% {
          opacity: 1;
        }
        20%,
        22%,
        24%,
        81% {
          opacity: 0.7;
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(56, 244, 201, 0.2);
        }
        50% {
          box-shadow: 0 0 24px rgba(56, 244, 201, 0.4);
        }
      }

      @keyframes cursorBlink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }
    </style>

      // Increased starting balances so player can act immediately
      const debitAccountsTemplate = [
        { id: "debit-main", label: "Checking", bank: "Chase", balance: 2400, feePct: 0.01, delayMinutes: 0 },

      // Credit accounts are treated as LOC-style: draw + pay
      const creditAccountsTemplate = [
        { id: "credit-1", bank: "Capital One", label: "Line of Credit", apr: 0.2499, limit: 2000, balance: 250, paymentsThisMonth: 0, lastLimitIncreaseMonth: 0 },

      const verdantTierOptions = [

      const toneKeywords = {
        polite: ["please", "appreciate", "thank", "respect"],
        pushy: ["urgent", "now", "immediately", "fast"],
        threatening: ["or else", "threat", "consequence", "pressure"],

      };

      const formatHHMM = (date, timeZone) => {
        try {
          return new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone,
          }).format(date);
        } catch {
          return date.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
        }
      };

      const clampMoney = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return 0;
        return Math.max(0, Math.round(n * 100) / 100);
      };

      const App = () => {
        const [screen, setScreen] = useState("landing");
        const [nextScreen, setNextScreen] = useState("servers");
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [loadingLineIndex, setLoadingLineIndex] = useState(0);
        const [selectedServer, setSelectedServer] = useState(null);

        const [hasSubscription, setHasSubscription] = useState(false);
        const [hasCustomNamePass, setHasCustomNamePass] = useState(false);
        const [showShop, setShowShop] = useState(false);

        const [profileIcon, setProfileIcon] = useState(profileIcons[0]);
        const [username, setUsername] = useState("");
        const [customUsername, setCustomUsername] = useState("");

        const [selectedCity, setSelectedCity] = useState(cityOptions[0]);
        const [profileStep, setProfileStep] = useState(1);

        const [systemTime, setSystemTime] = useState(new Date());

        // Active app defaults to supply (under Contraband accordion)
        const [activeApp, setActiveApp] = useState("supply");
        const [contrabandMenuOpen, setContrabandMenuOpen] = useState(true);

        // Finances state
        const [debitAccounts, setDebitAccounts] = useState(debitAccountsTemplate);
        const [creditAccounts, setCreditAccounts] = useState(creditAccountsTemplate);
        const [cashOnHand, setCashOnHand] = useState(650);
        const [cashStash, setCashStash] = useState(900); // not spendable

        // UI inputs (kept minimal and per-account)
        const [debitMoveInputs, setDebitMoveInputs] = useState({});
        const [creditActionInputs, setCreditActionInputs] = useState({}); // { [creditId]: { draw, pay, source } }

        // Supply state
        const cityKeys = useMemo(() => Object.keys(cities), []);
        const [supplyDraft, setSupplyDraft] = useState(() => ({
          city: cityKeys[0] || "New York",
          tier: verdantTierOptions[0].tier,
          quantity: 30,
          accountId: debitAccountsTemplate[0].id,
          deliveryMethod: "Courier", // Courier | Personal
        }));

        const [inventory, setInventory] = useState({ Standard: 0, Premium: 0 });
        const [heat, setHeat] = useState(8);
        const [reputation, setReputation] = useState(35);
        const [shipments, setShipments] = useState([]);
        const [contracts, setContracts] = useState([]);
        const [selectedBroker, setSelectedBroker] = useState(brokers[0]);
        const [messages, setMessages] = useState({});
        const [messageInput, setMessageInput] = useState("");
        const [messageCounts, setMessageCounts] = useState({});
        const [bootTimestamp] = useState(Date.now());
        const eventLogRef = useRef([]);

        // Personal-delivery lock
        const [personalDeliveryActive, setPersonalDeliveryActive] = useState(false);

        useEffect(() => {
          setUsername(
            `${usernameSeeds[Math.floor(Math.random() * usernameSeeds.length)]}${
              usernameSuffixes[Math.floor(Math.random() * usernameSuffixes.length)]
            }${Math.floor(Math.random() * 900 + 100)}`
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => setSystemTime(new Date()), 1000);
          return () => clearInterval(interval);
        }, []);

        useEffect(() => {
          if (screen !== "loading") return;
          setLoadingProgress(0);
          setLoadingLineIndex(0);

          const interval = setInterval(() => {
            setLoadingProgress((prev) => {
              const nextValue = Math.min(prev + Math.floor(Math.random() * 14 + 6), 100);
              if (nextValue >= 100) {
                clearInterval(interval);
                setTimeout(() => setScreen(nextScreen), 500);
              }
              return nextValue;
            });
            setLoadingLineIndex((prev) => Math.min(prev + 1, loadingLines.length - 1));
          }, 450);

          return () => clearInterval(interval);
        }, [screen, nextScreen]);

        const msPerGameMinute = (5 * 60 * 1000) / (24 * 60);
        const gameElapsedMs = Date.now() - bootTimestamp;
        const gameMinutes = Math.floor(gameElapsedMs / msPerGameMinute);
        const gameDay = Math.floor(gameMinutes / 1440) + 1;

        const localTimeLabel = useMemo(() => {
          return formatHHMM(systemTime, selectedCity.timeZone);
        }, [selectedCity, systemTime]);

        const displayUsername = hasCustomNamePass && customUsername.trim() ? customUsername : username;

        const profileProgress = useMemo(() => {
          let progress = 0;
          if (profileIcon) progress += 34;
          if ((hasCustomNamePass && customUsername.trim()) || username.trim()) progress += 33;
          if (selectedCity) progress += 33;
          return Math.min(progress, 100);
        }, [profileIcon, username, customUsername, selectedCity, hasCustomNamePass]);

        const profileComplete = profileProgress === 100;

        // Liquidity readout: debit total + credit available
        const totalCash = useMemo(() => {
          const debitTotal = debitAccounts.reduce((sum, a) => sum + a.balance, 0);
          const creditAvailable = creditAccounts.reduce((sum, c) => sum + Math.max(c.limit - c.balance, 0), 0);
          return debitTotal + creditAvailable;
        }, [debitAccounts, creditAccounts]);

        const addLog = (entry) => {
          eventLogRef.current = [{ id: Date.now() + Math.random(), text: entry }, ...eventLogRef.current].slice(0, 10);
        };

        // Contracts generation
        useEffect(() => {
          if (contracts.length === 0) setContracts(generateContracts());
        }, [contracts.length]);

        const generateContracts = () => {
          return brokers.map((broker, index) => {
            const tier = index % 2 === 0 ? "Standard" : "Premium";
            const base = tier === "Premium" ? 190 : 130;
            const windowHours = Math.floor(Math.random() * 18 + 6);
            const durationMs = windowHours * 60 * msPerGameMinute;
            return {
              id: `contract-${broker.id}-${Date.now()}`,
              brokerId: broker.id,
              title: `${broker.name} · ${broker.city}`,
              tier,
              quantityRange: [20, 80],
              priceBand: [base, base + 40],
              risk: index % 2 === 0 ? "Medium" : "High",
              createdAt: Date.now(),
              durationMs,
              remainingMs: durationMs,
              status: "Open",
            };
          });
        };

        const resolveShipmentOutcome = (shipment) => {
          const outcomes = ["Delivered", "Delayed", "Partial Loss", "Disrupted"];
          const roll = Math.random();
          let outcome = outcomes[0];
          if (roll > 0.85) outcome = outcomes[3];
          else if (roll > 0.7) outcome = outcomes[2];
          else if (roll > 0.5) outcome = outcomes[1];

          setInventory((prev) => {
            const newInventory = { ...prev };
            if (outcome === "Delivered") newInventory[shipment.tier] += shipment.quantity;
            else if (outcome === "Delayed") newInventory[shipment.tier] += Math.floor(shipment.quantity * 0.8);
            else if (outcome === "Partial Loss") newInventory[shipment.tier] += Math.floor(shipment.quantity * 0.5);
            return newInventory;
          });

          setHeat((prev) => Math.min(prev + (outcome === "Disrupted" ? 6 : 2), 100));
          setReputation((prev) => Math.max(prev - (outcome === "Disrupted" ? 5 : 1), 0));

          // Personal delivery lock releases when that shipment resolves
          if (shipment.deliveryMethod === "Personal") {
            setPersonalDeliveryActive(false);
          }

          return outcome;
        };

        const updateShipments = useCallback(() => {
          setShipments((prev) =>
            prev
              .map((shipment) => {
                const elapsed = Date.now() - shipment.createdAt;
                const remaining = shipment.durationMs - elapsed;
                if (remaining <= 0 && shipment.status === "In Transit") {
                  const outcome = resolveShipmentOutcome(shipment);
                  addLog(`Shipment ${shipment.id}: ${outcome}.`);
                  return { ...shipment, status: outcome, remainingMs: 0 };
                }
                return { ...shipment, remainingMs: Math.max(remaining, 0) };
              })
              .filter((shipment) => shipment.status === "In Transit")
          );
        }, []);

        const updateContracts = useCallback(() => {
          setContracts((prev) =>
            prev
              .map((contract) => {
                const elapsed = Date.now() - contract.createdAt;
                const remaining = contract.durationMs - elapsed;
                if (remaining <= 0 && contract.status === "Open") {
                  addLog(`Contract expired: ${contract.title}.`);
                  return { ...contract, status: "Expired", remainingMs: 0 };
                }
                return { ...contract, remainingMs: Math.max(remaining, 0) };
              })
              .filter((contract) => contract.status !== "Expired")
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => {
            updateShipments();
            updateContracts();
          }, 1000);
          return () => clearInterval(interval);
        }, [updateShipments, updateContracts]);

        // Supply cost preview
        const draftCityData = cities[supplyDraft.city] || Object.values(cities)[0];
        const payingDebit = debitAccounts.find((a) => a.id === supplyDraft.accountId);

        const draftUnit = useMemo(() => {
          if (!draftCityData) return 0;
          return supplyDraft.tier === "Premium" ? draftCityData.basePrice[1] : draftCityData.basePrice[0];
        }, [draftCityData, supplyDraft.tier]);

        const draftQty = useMemo(() => {
          const q = Number(supplyDraft.quantity);
          if (!Number.isFinite(q)) return 0;
          return Math.max(0, q);
        }, [supplyDraft.quantity]);

       // Delivery settings
const courierServiceFee = useMemo(() => {
  // 10% of initial contraband subtotal (unit * qty)
  return draftSubtotal * 0.10;
}, [draftSubtotal]);

const deliveryFee = supplyDraft.deliveryMethod === "Courier" ? courierServiceFee : 0;

        const draftSubtotal = draftUnit * draftQty;
        const draftFee = payingDebit ? draftSubtotal * payingDebit.feePct : 0;
        const draftTotal = draftSubtotal + draftFee + deliveryFee;

        const canAfford = payingDebit ? payingDebit.balance >= draftTotal : false;
        const postBalance = payingDebit ? payingDebit.balance - draftTotal : 0;

        const canPlaceDelivery = useMemo(() => {
          // If you're doing personal delivery, you cannot start ANY new deliveries until it resolves.
          if (personalDeliveryActive) return false;
          return true;
        }, [personalDeliveryActive]);

        const handlePlaceOrder = (event) => {
          event.preventDefault();

          if (!canPlaceDelivery) {
            addLog("Delivery locked: you are currently delivering in person.");
            return;
          }

          const city = supplyDraft.city;
          const tier = supplyDraft.tier;
          const quantity = Number(supplyDraft.quantity);
          const accountId = supplyDraft.accountId;
          const deliveryMethod = supplyDraft.deliveryMethod; // Courier | Personal

          const cityData = cities[city];
          if (!cityData) {
            addLog("Market not found.");
            return;
          }

          const unit = tier === "Premium" ? cityData.basePrice[1] : cityData.basePrice[0];
          const subtotal = unit * quantity;

          const debit = debitAccounts.find((a) => a.id === accountId);
          if (!debit) {
            addLog("Payment account not found.");
            return;
          }

          const fee = subtotal * debit.feePct;
          const serviceFee = deliveryMethod === "Courier" ? subtotal * 0.10 : 0;
          const total = subtotal + fee + serviceFee;

          if (debit.balance < total) {
            addLog("Purchase blocked: insufficient funds.");
            return;
          }

          setDebitAccounts((prev) => prev.map((a) => (a.id === accountId ? { ...a, balance: a.balance - total } : a)));

          const transitMinutes = cityData.transitHours * 60;
          const baseDurationMs = transitMinutes * msPerGameMinute;

          // Personal delivery is significantly longer, but avoids the courier service fee
          const durationMultiplier = deliveryMethod === "Personal" ? 2.6 : 1.0;
          const durationMs = baseDurationMs * durationMultiplier;

          const shipmentId = `S-${Math.floor(Math.random() * 9000 + 1000)}`;

          setShipments((prev) => [
            {
              id: shipmentId,
              city,
              tier,
              quantity,
              status: "In Transit",
              createdAt: Date.now(),
              durationMs,
              remainingMs: durationMs,
              deliveryMethod,
              serviceFee,
            },
            ...prev,
          ]);

          if (deliveryMethod === "Personal") {
            setPersonalDeliveryActive(true);
            addLog(`Personal delivery started: ${shipmentId} (${city}).`);
          } else {
            addLog(`Courier delivery queued: ${shipmentId} (${city}).`);
          }

          addLog(`Order placed: ${quantity} units (${tier}) from ${city}.`);
        };

        const handleSubmitOffer = (contract, quantity, price, payoutAccountId) => {
          const tierInventory = inventory[contract.tier] || 0;
          if (quantity > tierInventory) {
            addLog("Insufficient inventory for that offer.");
            return;
          }
          const accepted = Math.random() > 0.35;
          const status = accepted ? "Accepted" : "Counter";

          setContracts((prev) =>
            prev.map((item) => (item.id === contract.id ? { ...item, status, offer: { quantity, price } } : item))
          );

          if (accepted) {
            const revenue = quantity * price;
            setInventory((prev) => ({ ...prev, [contract.tier]: prev[contract.tier] - quantity }));

            setDebitAccounts((prev) =>
              prev.map((account) => (account.id === payoutAccountId ? { ...account, balance: account.balance + revenue } : account))
            );

            setReputation((prev) => Math.min(prev + 4, 100));
            setHeat((prev) => Math.min(prev + 3, 100));
            addLog(`Contract fulfilled: ${contract.title} ($${revenue}).`);
          } else {
            addLog(`Countered: ${contract.title}.`);
          }
        };

        const analyzeTone = (text) => {
          const lower = text.toLowerCase();
          let tone = "neutral";
          Object.entries(toneKeywords).forEach(([key, words]) => {
            if (words.some((word) => lower.includes(word))) tone = key;
          });
          return tone;
        };

        const getScriptedReply = (broker, tone) => {
          const base = {
            polite: "Noted. Keep the offer within the band and we can move.",
            neutral: "Send numbers you can stand behind.",
            pushy: "Don’t rush the ledger. Window closes fast.",
            threatening: "That tone adds heat. Dial it back or we walk.",
            flattering: "Flattery helps. Bring a tight proposal and we’ll listen.",
          };
          return base[tone] || base.neutral;
        };

        const handleSendMessage = () => {
          const trimmed = messageInput.trim();
          if (!trimmed) return;

          const count = messageCounts[selectedBroker.id] || 0;
          if (count >= 5) {
            addLog(`Negotiation window closed for ${selectedBroker.name}.`);
            return;
          }

          const tone = analyzeTone(trimmed);
          const broker = selectedBroker;

          // Keep scripted unless you wire a server-side relay for AI.
          const reply = getScriptedReply(broker, tone);

          setMessages((prev) => {
            const existing = prev[broker.id] || [];
            return {
              ...prev,
              [broker.id]: [
                ...existing,
                { id: Date.now(), sender: "You", text: trimmed },
                { id: Date.now() + 1, sender: broker.name, text: reply },
              ],
            };
          });

          setMessageCounts((prev) => ({ ...prev, [broker.id]: (prev[broker.id] || 0) + 1 }));

          if (tone === "threatening") {
            setHeat((prev) => Math.min(prev + 6, 100));
            setReputation((prev) => Math.max(prev - 4, 0));
          } else if (tone === "pushy") {
            setHeat((prev) => Math.min(prev + 2, 100));
          }

          setMessageInput("");
        };

        const activeMessages = messages[selectedBroker.id] || [];

        // Current Activity for top bar
        const currentActivity = useMemo(() => {
          const personal = shipments.find((s) => s.status === "In Transit" && s.deliveryMethod === "Personal");
          if (personal) {
            const etaMin = Math.max(1, Math.ceil(personal.remainingMs / 1000 / 60));
            return `Personal delivery: ${personal.city} (${etaMin}m ETA)`;
          }
          const inTransit = shipments.filter((s) => s.status === "In Transit").length;
          if (inTransit > 0) return `Managing shipments: ${inTransit} in transit`;
          return "Idle";
        }, [shipments]);

        // -----------------------------
        // FINANCES ACTIONS
        // -----------------------------
        const depositToDebit = (accountId, amount) => {
          const v = clampMoney(amount);
          if (v <= 0) return;
          if (cashOnHand < v) {
            addLog("Deposit blocked: insufficient cash on hand.");
            return;
          }
          setCashOnHand((prev) => prev - v);
          setDebitAccounts((prev) => prev.map((a) => (a.id === accountId ? { ...a, balance: a.balance + v } : a)));
          addLog(`Deposit: $${v.toFixed(2)} to debit account.`);
        };

        const withdrawFromDebit = (accountId, amount) => {
          const v = clampMoney(amount);
          if (v <= 0) return;
          const acct = debitAccounts.find((a) => a.id === accountId);
          if (!acct || acct.balance < v) {
            addLog("Withdraw blocked: insufficient debit balance.");
            return;
          }
          setDebitAccounts((prev) => prev.map((a) => (a.id === accountId ? { ...a, balance: a.balance - v } : a)));
          setCashOnHand((prev) => prev + v);
          addLog(`Withdraw: $${v.toFixed(2)} from debit account.`);
        };

        // "Deposit/Withdraw" for credit interpreted as Draw/Pay (LOC behavior)
        const drawCreditToCash = (creditId, amount) => {
          const v = clampMoney(amount);
          if (v <= 0) return;
          const c = creditAccounts.find((x) => x.id === creditId);
          if (!c) return;

          const available = Math.max(c.limit - c.balance, 0);
          if (v > available) {
            addLog("Draw blocked: exceeds available credit.");
            return;
          }

          setCreditAccounts((prev) => prev.map((x) => (x.id === creditId ? { ...x, balance: x.balance + v } : x)));
          setCashOnHand((prev) => prev + v);
          addLog(`Credit draw: $${v.toFixed(2)} to cash on hand.`);
        };

        const payCredit = (creditId, amount, source) => {
          const v = clampMoney(amount);
          if (v <= 0) return;

          const c = creditAccounts.find((x) => x.id === creditId);
          if (!c) return;

          const payAmount = Math.min(v, c.balance);
          if (payAmount <= 0) {
            addLog("Payment blocked: credit balance is already $0.");
            return;
          }

          if (source === "cash") {
            if (cashOnHand < payAmount) {
              addLog("Payment blocked: insufficient cash on hand.");
              return;
            }
            setCashOnHand((prev) => prev - payAmount);
          } else {
            // source is a debit account id
            const debit = debitAccounts.find((a) => a.id === source);
            if (!debit || debit.balance < payAmount) {
              addLog("Payment blocked: insufficient debit funds.");
              return;
            }
            setDebitAccounts((prev) => prev.map((a) => (a.id === source ? { ...a, balance: a.balance - payAmount } : a)));
          }

          setCreditAccounts((prev) =>
            prev.map((x) => {
              if (x.id !== creditId) return x;
              return { ...x, balance: Math.max(0, x.balance - payAmount), paymentsThisMonth: x.paymentsThisMonth + 1 };
            })
          );

          addLog(`Credit payment: $${payAmount.toFixed(2)} applied.`);
        };

                                      </div>

                                      <div className="mt-3 grid gap-2 sm:grid-cols-2 text-xs">
                                        <div className="flex items-center justify-between">
                                          <span className="text-slate-400">Balance</span>
                                          <span className="text-rose-200">${c.balance.toFixed(2)}</span>
                                        </div>
                                        <div className="flex items-center justify-between">
                                          <span className="text-slate-400">Payments (month)</span>
                                          <span>{c.paymentsThisMonth}</span>
                                        </div>
                                      </div>

                                      <div className="mt-4 grid gap-2 sm:grid-cols-2">
                                        <div className="rounded-md border border-slate-800 bg-black/40 p-3">
                                          <p className="text-[10px] uppercase tracking-[0.3em] text-slate-500">Draw to cash</p>
                                          <div className="mt-2 flex gap-2">
                                            <input
                                              type="number"
                                              min="0"
                                              step="0.01"
                                              value={inp.draw}
                                              onChange={(e) => setCreditActionInputs((p) => ({ ...p, [c.id]: { ...inp, draw: e.target.value } }))}
                                              placeholder="Amount"
                                              className="flex-1 rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                            />
                                            <button
                                              type="button"
                                              onClick={() => {
                                                drawCreditToCash(c.id, inp.draw);
                                                setCreditActionInputs((p) => ({ ...p, [c.id]: { ...inp, draw: "" } }));
                                              }}
                                              className="rounded-md border border-emerald-400/60 px-3 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200 hover:border-emerald-300"
                                            >
                                              Draw
                                            </button>
                                          </div>
                                        </div>

                                        <div className="rounded-md border border-slate-800 bg-black/40 p-3">
                                          <p className="text-[10px] uppercase tracking-[0.3em] text-slate-500">Pay balance</p>
                                          <div className="mt-2 grid gap-2 sm:grid-cols-3">
                                            <input
                                              type="number"
                                              min="0"
                                              step="0.01"
                                              value={inp.pay}
                                              onChange={(e) => setCreditActionInputs((p) => ({ ...p, [c.id]: { ...inp, pay: e.target.value } }))}
                                              placeholder="Amount"
                                              className="sm:col-span-2 rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                            />
                                            <select
                                              value={inp.source}
                                              onChange={(e) => setCreditActionInputs((p) => ({ ...p, [c.id]: { ...inp, source: e.target.value } }))}
                                              className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                            >
                                              <option value="cash">Cash</option>
                                              {debitAccounts.map((a) => (
                                                <option key={a.id} value={a.id}>{a.bank}</option>
                                              ))}
                                            </select>

                                            <button
                                              type="button"
                                              onClick={() => {
                                                payCredit(c.id, inp.pay, inp.source);
                                                setCreditActionInputs((p) => ({ ...p, [c.id]: { ...inp, pay: "" } }));
                                              }}
                                              className="sm:col-span-3 rounded-md border border-amber-300/60 px-3 py-2 text-xs uppercase tracking-[0.3em] text-amber-200 hover:border-amber-200"
                                            >
                                              Make Payment
                                            </button>
                                          </div>
                                        </div>
                                      </div>

                                      <div className="mt-3 text-[10px] uppercase tracking-[0.3em] text-slate-500">
                                        Payments improve limit increase odds (future).
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* FACILITIES */}
                      {activeApp === "facilities" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5 text-sm text-slate-300">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Facilities</p>
                          <p className="mt-3 text-slate-400">Locked. Unlock via reputation tiers.</p>
                        </div>
                      )}

                      {/* Event Log */}
                      <div className="rounded-md border border-slate-800 bg-black/60 p-4 text-xs text-slate-400">
                        <p className="uppercase tracking-[0.3em] text-slate-500">Event Log</p>
                        <div className="mt-2 space-y-1">
                          {eventLogRef.current.length === 0 && <p className="text-slate-500">No events yet.</p>}
                          {eventLogRef.current.map((entry) => <p key={entry.id}>• {entry.text}</p>)}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              )}
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
