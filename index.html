<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Into The Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
  font-family: "Share Tech Mono", "Fira Mono", "JetBrains Mono", monospace;
          }

      .scanlines::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.05) 1px,
          rgba(0, 0, 0, 0.1) 1px,
          rgba(0, 0, 0, 0.1) 3px
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .terminal-flicker {
        animation: flicker 3s infinite;
      }

      .glow-pulse {
        animation: glowPulse 2.4s ease-in-out infinite;
      }

      .boot-cursor {
        display: inline-block;
        width: 10px;
        height: 18px;
        background: #38f4c9;
        margin-left: 6px;
        animation: cursorBlink 1s steps(2, start) infinite;
      }

      .panel-overlay {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
      }

      .panel-overlay.is-open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      @keyframes flicker {
        0%,
        19%,
        21%,
        23%,
        80%,
        100% {
          opacity: 1;
        }
        20%,
        22%,
        24%,
        81% {
          opacity: 0.7;
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(56, 244, 201, 0.2);
        }
        50% {
          box-shadow: 0 0 24px rgba(56, 244, 201, 0.4);
        }
      }

      @keyframes cursorBlink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useCallback, useEffect, useMemo, useRef, useState } = React;

      const OPENAI_API_KEY = "PUT_YOUR_KEY_HERE";

      const servers = [
        { id: 1, name: "Obsidian Relay", location: "Frankfurt", status: "Secure", load: "14%" },
        { id: 2, name: "Midnight Spine", location: "Singapore", status: "Encrypted", load: "61%" },
        { id: 3, name: "Nocturne Gate", location: "Toronto", status: "Shielded", load: "32%" },
        { id: 4, name: "Ghostline Hub", location: "São Paulo", status: "Hidden", load: "48%" },
      ];

      // More icons + rounder cards (applied in JSX)
      const profileIcons = [
        "🎭","💀","🧠","🔒","👁️","🦉",
        "🕷️","🦂","🧬","🧿","⚗️","🧲",
        "📡","🛰️","🧪","🗝️","🕯️","🩸"
      ];

      // Real-life city options + timezones
      const cityOptions = [
        { city: "New York", country: "United States", timeZone: "America/New_York" },
        { city: "Chicago", country: "United States", timeZone: "America/Chicago" },
        { city: "Los Angeles", country: "United States", timeZone: "America/Los_Angeles" },
        { city: "London", country: "United Kingdom", timeZone: "Europe/London" },
        { city: "Berlin", country: "Germany", timeZone: "Europe/Berlin" },
        { city: "Tokyo", country: "Japan", timeZone: "Asia/Tokyo" },
        { city: "Singapore", country: "Singapore", timeZone: "Asia/Singapore" },
        { city: "Toronto", country: "Canada", timeZone: "America/Toronto" },
      ];

      const usernameSeeds = ["Void", "Cipher", "Specter", "Glitch", "Ghost", "Zero", "Rogue", "Null", "Pulse", "Signal"];
      const usernameSuffixes = ["Walker", "Shade", "Node", "Runner", "Wire", "Crow"];

      // Side menu: Drug accordion + top-level apps
      const appModules = [
        { id: "network", label: "Network 🕸️", status: "Live" },
        { id: "map", label: "Map 🗺️", status: "Live" },
        { id: "messages", label: "Messages 🔐", status: "Live" },
        { id: "finances", label: "Finances 💳", status: "Secure" },
        { id: "facilities", label: "Facilities / Real Estate 🏗️", status: "Locked" },
      ];

      const drugSubModules = [
        { id: "supply", label: "Supply 🧪", status: "Online" },
        { id: "contracts", label: "Contracts 📑", status: "Live" },
        { id: "transit", label: "Transit 🚚", status: "Live" },
      ];

      const loadingLines = [
        "[boot] establishing encrypted tunnel...",
        "[auth] negotiating shadow certificates...",
        "[relay] proxy chain stabilized...",
        "[sync] mirroring dark indices...",
        "[access] access key verified...",
      ];

      // Brokers updated to real cities
      const brokers = [
        {
          id: "broker-onyx",
          name: "Broker Onyx",
          city: "New York",
          personality: { fearTolerance: 0.4, patience: 0.6, pride: 0.7, aggressionResponse: 0.5, riskAppetite: 0.6 },
        },
        {
          id: "broker-veil",
          name: "Broker Veil",
          city: "Chicago",
          personality: { fearTolerance: 0.7, patience: 0.5, pride: 0.4, aggressionResponse: 0.6, riskAppetite: 0.7 },
        },
        {
          id: "broker-kite",
          name: "Broker Kite",
          city: "Los Angeles",
          personality: { fearTolerance: 0.3, patience: 0.8, pride: 0.5, aggressionResponse: 0.4, riskAppetite: 0.5 },
        },
      ];

      // Real cities for supply markets (keys must match select values)
      const cities = {
        "New York": {
          name: "New York",
          basePrice: [140, 190],
          reliability: "Stable",
          transitRisk: "Medium",
          transitHours: 10,
          culture: "Direct",
        },
        "Chicago": {
          name: "Chicago",
          basePrice: [130, 175],
          reliability: "Moderate",
          transitRisk: "Low",
          transitHours: 8,
          culture: "Formal",
        },
        "Los Angeles": {
          name: "Los Angeles",
          basePrice: [120, 170],
          reliability: "Volatile",
          transitRisk: "High",
          transitHours: 14,
          culture: "Guarded",
        },
        "London": {
          name: "London",
          basePrice: [150, 205],
          reliability: "Stable",
          transitRisk: "Medium",
          transitHours: 12,
          culture: "Reserved",
        },
        "Berlin": {
          name: "Berlin",
          basePrice: [135, 185],
          reliability: "Stable",
          transitRisk: "Low",
          transitHours: 11,
          culture: "Methodical",
        },
        "Tokyo": {
          name: "Tokyo",
          basePrice: [160, 220],
          reliability: "Stable",
          transitRisk: "Medium",
          transitHours: 16,
          culture: "Polite",
        },
      };

      // Finances: debit + credit + cash stash
      const debitAccountsTemplate = [
        { id: "debit-main", label: "Checking (Main)", bank: "Chase", balance: 850, feePct: 0.01, delayMinutes: 0 },
        { id: "debit-savings", label: "Savings", bank: "Bank of America", balance: 1200, feePct: 0.005, delayMinutes: 10 },
      ];

      const creditAccountsTemplate = [
        {
          id: "credit-1",
          bank: "Capital One",
          label: "Quicksilver",
          apr: 0.2499,
          limit: 500,
          balance: 0,
          paymentsThisMonth: 0,
          lastLimitIncreaseMonth: 0,
        },
        {
          id: "credit-2",
          bank: "Discover",
          label: "It Card",
          apr: 0.2199,
          limit: 800,
          balance: 120,
          paymentsThisMonth: 1,
          lastLimitIncreaseMonth: 0,
        },
      ];

      const verdantTierOptions = [
        { tier: "Standard", visibility: "Low", stability: "Stable" },
        { tier: "Premium", visibility: "High", stability: "Fragile" },
      ];

      const toneKeywords = {
        polite: ["please", "appreciate", "thank", "respect"],
        pushy: ["urgent", "now", "immediately", "fast"],
        threatening: ["or else", "threat", "consequence", "pressure"],
        flattering: ["admire", "legend", "impressive", "trusted"],
      };

      const App = () => {
        const [screen, setScreen] = useState("landing");
        const [nextScreen, setNextScreen] = useState("servers");
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [loadingLineIndex, setLoadingLineIndex] = useState(0);
        const [selectedServer, setSelectedServer] = useState(null);

        const [hasSubscription, setHasSubscription] = useState(false);
        const [hasCustomNamePass, setHasCustomNamePass] = useState(false);
        const [showShop, setShowShop] = useState(false);

        const [profileIcon, setProfileIcon] = useState(profileIcons[0]);
        const [username, setUsername] = useState("");
        const [customUsername, setCustomUsername] = useState("");

        const [selectedCity, setSelectedCity] = useState(cityOptions[0]);
        const [profileStep, setProfileStep] = useState(1);

        const [systemTime, setSystemTime] = useState(new Date());

        // Active app defaults to supply (now under Drug accordion)
        const [activeApp, setActiveApp] = useState("supply");
        const [drugMenuOpen, setDrugMenuOpen] = useState(true);

        // Finances state
        const [debitAccounts, setDebitAccounts] = useState(debitAccountsTemplate);
        const [creditAccounts, setCreditAccounts] = useState(creditAccountsTemplate);
        const [cashOnHand, setCashOnHand] = useState(150);
        const [cashStash, setCashStash] = useState(400); // not spendable

        // Supply state
        const cityKeys = useMemo(() => Object.keys(cities), []);
        const [supplyDraft, setSupplyDraft] = useState(() => ({
          city: cityKeys[0] || "New York",
          tier: verdantTierOptions[0].tier,
          quantity: 30,
          accountId: debitAccountsTemplate[0].id,
        }));

        const [inventory, setInventory] = useState({ Standard: 0, Premium: 0 });
        const [heat, setHeat] = useState(8);
        const [reputation, setReputation] = useState(35);
        const [shipments, setShipments] = useState([]);
        const [contracts, setContracts] = useState([]);
        const [selectedBroker, setSelectedBroker] = useState(brokers[0]);
        const [messages, setMessages] = useState({});
        const [messageInput, setMessageInput] = useState("");
        const [messageCounts, setMessageCounts] = useState({});
        const [bootTimestamp] = useState(Date.now());
        const eventLogRef = useRef([]);

        useEffect(() => {
          setUsername(
            `${usernameSeeds[Math.floor(Math.random() * usernameSeeds.length)]}${
              usernameSuffixes[Math.floor(Math.random() * usernameSuffixes.length)]
            }${Math.floor(Math.random() * 900 + 100)}`
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => setSystemTime(new Date()), 1000);
          return () => clearInterval(interval);
        }, []);

        useEffect(() => {
          if (screen !== "loading") return;
          setLoadingProgress(0);
          setLoadingLineIndex(0);

          const interval = setInterval(() => {
            setLoadingProgress((prev) => {
              const nextValue = Math.min(prev + Math.floor(Math.random() * 14 + 6), 100);
              if (nextValue >= 100) {
                clearInterval(interval);
                setTimeout(() => setScreen(nextScreen), 500);
              }
              return nextValue;
            });
            setLoadingLineIndex((prev) => Math.min(prev + 1, loadingLines.length - 1));
          }, 450);

          return () => clearInterval(interval);
        }, [screen, nextScreen]);

        const msPerGameMinute = (5 * 60 * 1000) / (24 * 60);
        const gameElapsedMs = Date.now() - bootTimestamp;
        const gameMinutes = Math.floor(gameElapsedMs / msPerGameMinute);
        const gameDay = Math.floor(gameMinutes / 1440) + 1;
        const gameHour = Math.floor((gameMinutes % 1440) / 60);
        const gameMinute = gameMinutes % 60;
        const gameProgress = ((gameMinutes % 1440) / 1440) * 100;

        const gamePhase = useMemo(() => {
          if (gameHour < 6) return "Night Watch";
          if (gameHour < 12) return "Dawn Patrol";
          if (gameHour < 18) return "Day Shift";
          return "Blackout";
        }, [gameHour]);

        const localTimeLabel = useMemo(() => {
          return new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            timeZone: selectedCity.timeZone,
          }).format(systemTime);
        }, [selectedCity, systemTime]);

        const systemTimeLabel = useMemo(() => {
          return systemTime.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }, [systemTime]);

        const displayUsername = hasCustomNamePass && customUsername.trim() ? customUsername : username;

        const profileProgress = useMemo(() => {
          let progress = 0;
          if (profileIcon) progress += 34;
          if ((hasCustomNamePass && customUsername.trim()) || username.trim()) progress += 33;
          if (selectedCity) progress += 33;
          return Math.min(progress, 100);
        }, [profileIcon, username, customUsername, selectedCity, hasCustomNamePass]);

        const profileComplete = profileProgress === 100;

        // "Total Cash" box: debit total + credit available (liquidity)
        const totalCash = useMemo(() => {
          const debitTotal = debitAccounts.reduce((sum, a) => sum + a.balance, 0);
          const creditAvailable = creditAccounts.reduce((sum, c) => sum + Math.max(c.limit - c.balance, 0), 0);
          return debitTotal + creditAvailable;
        }, [debitAccounts, creditAccounts]);

        const addLog = (entry) => {
          eventLogRef.current = [{ id: Date.now(), text: entry }, ...eventLogRef.current].slice(0, 8);
        };

        // Contracts generation
        useEffect(() => {
          if (contracts.length === 0) setContracts(generateContracts());
        }, [contracts.length]);

        const generateContracts = () => {
          return brokers.map((broker, index) => {
            const tier = index % 2 === 0 ? "Standard" : "Premium";
            const base = tier === "Premium" ? 190 : 130;
            const windowHours = Math.floor(Math.random() * 18 + 6);
            const durationMs = windowHours * 60 * msPerGameMinute;
            return {
              id: `contract-${broker.id}-${Date.now()}`,
              brokerId: broker.id,
              title: `${broker.name} · ${broker.city}`,
              tier,
              quantityRange: [20, 80],
              priceBand: [base, base + 40],
              risk: index % 2 === 0 ? "Medium" : "High",
              createdAt: Date.now(),
              durationMs,
              remainingMs: durationMs,
              status: "Open",
            };
          });
        };

        const updateShipments = useCallback(() => {
          setShipments((prev) =>
            prev
              .map((shipment) => {
                const elapsed = Date.now() - shipment.createdAt;
                const remaining = shipment.durationMs - elapsed;
                if (remaining <= 0 && shipment.status === "In Transit") {
                  const outcome = resolveShipmentOutcome(shipment);
                  addLog(`Shipment ${shipment.id} resolved: ${outcome}.`);
                  return { ...shipment, status: outcome, remainingMs: 0 };
                }
                return { ...shipment, remainingMs: Math.max(remaining, 0) };
              })
              .filter((shipment) => shipment.status === "In Transit")
          );
        }, []);

        const updateContracts = useCallback(() => {
          setContracts((prev) =>
            prev
              .map((contract) => {
                const elapsed = Date.now() - contract.createdAt;
                const remaining = contract.durationMs - elapsed;
                if (remaining <= 0 && contract.status === "Open") {
                  addLog(`Contract ${contract.title} expired.`);
                  return { ...contract, status: "Expired", remainingMs: 0 };
                }
                return { ...contract, remainingMs: Math.max(remaining, 0) };
              })
              .filter((contract) => contract.status !== "Expired")
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => {
            updateShipments();
            updateContracts();
          }, 1000);
          return () => clearInterval(interval);
        }, [updateShipments, updateContracts]);

        const resolveShipmentOutcome = (shipment) => {
          const outcomes = ["Delivered", "Delayed", "Partial Loss", "Disrupted"];
          const roll = Math.random();
          let outcome = outcomes[0];
          if (roll > 0.85) outcome = outcomes[3];
          else if (roll > 0.7) outcome = outcomes[2];
          else if (roll > 0.5) outcome = outcomes[1];

          setInventory((prev) => {
            const newInventory = { ...prev };
            if (outcome === "Delivered") newInventory[shipment.tier] += shipment.quantity;
            else if (outcome === "Delayed") newInventory[shipment.tier] += Math.floor(shipment.quantity * 0.8);
            else if (outcome === "Partial Loss") newInventory[shipment.tier] += Math.floor(shipment.quantity * 0.5);
            return newInventory;
          });

          setHeat((prev) => Math.min(prev + (outcome === "Disrupted" ? 6 : 2), 100));
          setReputation((prev) => Math.max(prev - (outcome === "Disrupted" ? 5 : 1), 0));
          return outcome;
        };

        // Supply cost preview
        const draftCityData = cities[supplyDraft.city] || Object.values(cities)[0];
        const payingDebit = debitAccounts.find((a) => a.id === supplyDraft.accountId);

        const draftUnit = useMemo(() => {
          if (!draftCityData) return 0;
          return supplyDraft.tier === "Premium" ? draftCityData.basePrice[1] : draftCityData.basePrice[0];
        }, [draftCityData, supplyDraft.tier]);

        const draftQty = useMemo(() => {
          const q = Number(supplyDraft.quantity);
          if (!Number.isFinite(q)) return 0;
          return Math.max(0, q);
        }, [supplyDraft.quantity]);

        const draftSubtotal = draftUnit * draftQty;
        const draftFee = payingDebit ? draftSubtotal * payingDebit.feePct : 0;
        const draftTotal = draftSubtotal + draftFee;

        const canAfford = payingDebit ? payingDebit.balance >= draftTotal : false;
        const postBalance = payingDebit ? payingDebit.balance - draftTotal : 0;

        const handlePlaceOrder = (event) => {
          event.preventDefault();

          const city = supplyDraft.city;
          const tier = supplyDraft.tier;
          const quantity = Number(supplyDraft.quantity);
          const accountId = supplyDraft.accountId;

          const cityData = cities[city];
          if (!cityData) {
            addLog("City market not found.");
            return;
          }

          const unit = tier === "Premium" ? cityData.basePrice[1] : cityData.basePrice[0];
          const subtotal = unit * quantity;

          const debit = debitAccounts.find((a) => a.id === accountId);
          if (!debit) {
            addLog("Payment account not found.");
            return;
          }

          const fee = subtotal * debit.feePct;
          const total = subtotal + fee;

          if (debit.balance < total) {
            addLog("Purchase blocked: insufficient funds in selected debit account.");
            return;
          }

          setDebitAccounts((prev) => prev.map((a) => (a.id === accountId ? { ...a, balance: a.balance - total } : a)));

          const transitMinutes = cityData.transitHours * 60;
          const durationMs = transitMinutes * msPerGameMinute;

          setShipments((prev) => [
            {
              id: `S-${Math.floor(Math.random() * 9000 + 1000)}`,
              city,
              tier,
              quantity,
              status: "In Transit",
              createdAt: Date.now(),
              durationMs,
              remainingMs: durationMs,
            },
            ...prev,
          ]);

          addLog(`Supply order placed: ${quantity} units (${tier}) from ${city}.`);
        };

        const handleSubmitOffer = (contract, quantity, price, payoutAccountId) => {
          const tierInventory = inventory[contract.tier] || 0;
          if (quantity > tierInventory) {
            addLog("Insufficient inventory for that offer.");
            return;
          }
          const accepted = Math.random() > 0.35;
          const status = accepted ? "Accepted" : "Counter";

          setContracts((prev) =>
            prev.map((item) => (item.id === contract.id ? { ...item, status, offer: { quantity, price } } : item))
          );

          if (accepted) {
            const revenue = quantity * price;
            setInventory((prev) => ({ ...prev, [contract.tier]: prev[contract.tier] - quantity }));

            setDebitAccounts((prev) =>
              prev.map((account) =>
                account.id === payoutAccountId ? { ...account, balance: account.balance + revenue } : account
              )
            );

            setReputation((prev) => Math.min(prev + 4, 100));
            setHeat((prev) => Math.min(prev + 3, 100));
            addLog(`Contract fulfilled: ${contract.title} for $${revenue}.`);
          } else {
            addLog(`Broker countered: ${contract.title}.`);
          }
        };

        const analyzeTone = (text) => {
          const lower = text.toLowerCase();
          let tone = "neutral";
          Object.entries(toneKeywords).forEach(([key, words]) => {
            if (words.some((word) => lower.includes(word))) tone = key;
          });
          return tone;
        };

        const handleSendMessage = () => {
          const trimmed = messageInput.trim();
          if (!trimmed) return;
          const count = messageCounts[selectedBroker.id] || 0;
          if (count >= 5) {
            addLog(`Negotiation window closed for ${selectedBroker.name}.`);
            return;
          }

          const tone = analyzeTone(trimmed);
          const broker = selectedBroker;
          const reply = getScriptedReply(broker, tone);

          setMessages((prev) => {
            const existing = prev[broker.id] || [];
            return {
              ...prev,
              [broker.id]: [
                ...existing,
                { id: Date.now(), sender: "You", text: trimmed },
                { id: Date.now() + 1, sender: broker.name, text: reply },
              ],
            };
          });

          setMessageCounts((prev) => ({ ...prev, [broker.id]: (prev[broker.id] || 0) + 1 }));

          if (tone === "threatening") {
            setHeat((prev) => Math.min(prev + 6, 100));
            setReputation((prev) => Math.max(prev - 4, 0));
          } else if (tone === "pushy") {
            setHeat((prev) => Math.min(prev + 2, 100));
          }

          setMessageInput("");
        };

        const getScriptedReply = (broker, tone) => {
          const base = {
            polite: "Respect noted. Keep the offer within the band and we can move.",
            neutral: "Keep it clean. Send the numbers you can stand behind.",
            pushy: "Pressure noted. Don’t rush the ledger or the window closes.",
            threatening: "That tone adds heat. Dial it back or we walk.",
            flattering: "Flattery helps. Bring a tight proposal and we’ll listen.",
          };
          return base[tone] || base.neutral;
        };

        const activeMessages = messages[selectedBroker.id] || [];

        return (
          <main className="relative min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-black text-slate-100">
            <div className="absolute inset-0 scanlines opacity-60" />
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.18),_transparent_55%)]" />

            <div className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-8 px-6 py-10">
              <header className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h1 className="text-3xl font-semibold tracking-[0.2em] text-emerald-100">Into The Dark</h1>
                  <p className="text-xs uppercase tracking-[0.6em] text-slate-400">Dark Web Simulation</p>
                </div>
                <div className="flex flex-wrap items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setShowShop(true)}
                    className="rounded-md border border-emerald-400/40 bg-emerald-500/10 px-4 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200 transition hover:border-emerald-300 hover:text-emerald-100"
                  >
                    🛒
                  </button>
                  {screen === "dashboard" && (
                    <div className="flex flex-wrap items-center gap-3 text-xs uppercase tracking-[0.3em]">
                      {hasSubscription && (
                        <span className="rounded-md border border-emerald-400/40 bg-emerald-500/10 px-3 py-1 text-emerald-200">
                          [VIP]
                        </span>
                      )}
                      <span className="rounded-md border border-slate-700 px-3 py-1 text-slate-300">
                        {selectedServer?.name}
                      </span>

                                className="mt-2 w-full rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-sm text-slate-100"
                              >
                                {Object.values(cities).map((city) => (
                                  <option key={city.name} value={city.name}>
                                    {city.name} · {city.transitRisk}
                                  </option>
                                ))}
                              </select>
                            </label>

                            <label className="text-xs uppercase tracking-[0.3em] text-slate-400">
                              Tier
                              <select
                                name="tier"
                                value={supplyDraft.tier}
                                onChange={(e) => setSupplyDraft((p) => ({ ...p, tier: e.target.value }))}
                                className="mt-2 w-full rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-sm text-slate-100"
                              >
                                {verdantTierOptions.map((tier) => (
                                  <option key={tier.tier} value={tier.tier}>
                                    {tier.tier} · {tier.visibility}/{tier.stability}
                                  </option>
                                ))}
                              </select>
                            </label>

                            <label className="text-xs uppercase tracking-[0.3em] text-slate-400">
                              Quantity
                              <input
                                name="quantity"
                                type="number"
                                min="10"
                                value={supplyDraft.quantity}
                                onChange={(e) => setSupplyDraft((p) => ({ ...p, quantity: Number(e.target.value) }))}
                                className="mt-2 w-full rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-sm text-slate-100"
                              />
                            </label>

                            <label className="text-xs uppercase tracking-[0.3em] text-slate-400">
                              Pay (Debit)
                              <select
                                name="account"
                                value={supplyDraft.accountId}
                                onChange={(e) => setSupplyDraft((p) => ({ ...p, accountId: e.target.value }))}
                                className="mt-2 w-full rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-sm text-slate-100"
                              >
                                {debitAccounts.map((account) => (
                                  <option key={account.id} value={account.id}>
                                    {account.bank} · {account.label} (${account.balance.toFixed(0)})
                                  </option>
                                ))}
                              </select>
                            </label>

                            <button
                              type="submit"
                              disabled={!canAfford}
                              className={`sm:col-span-2 rounded-md border px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                                canAfford
                                  ? "border-emerald-400/60 bg-emerald-500/10 text-emerald-100 hover:border-emerald-300"
                                  : "cursor-not-allowed border-slate-800 bg-slate-900/40 text-slate-500"
                              }`}
                            >
                              Place Wholesale Order
                            </button>
                          </form>

                          <div className="mt-4 rounded-md border border-slate-800 bg-slate-950/70 p-4 text-xs text-slate-300">
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Cost preview</p>
                            <div className="mt-2 grid gap-2 sm:grid-cols-2">
                              <div className="flex items-center justify-between">
                                <span>Unit price</span>
                                <span>${draftUnit.toFixed(2)}</span>
                              </div>
                              <div className="flex items-center justify-between">
                                <span>Quantity</span>
                                <span>{draftQty}</span>
                              </div>
                              <div className="flex items-center justify-between">
                                <span>Fee</span>
                                <span>${draftFee.toFixed(2)}</span>
                              </div>
                              <div className="flex items-center justify-between text-emerald-100">
                                <span>Total</span>
                                <span>${draftTotal.toFixed(2)}</span>
                              </div>
                              <div className="flex items-center justify-between">
                                <span>Account balance</span>
                                <span>${(payingDebit?.balance ?? 0).toFixed(2)}</span>
                              </div>
                              <div className="flex items-center justify-between">
                                <span>After purchase</span>
                                <span className={canAfford ? "text-emerald-200" : "text-rose-200"}>
                                  ${postBalance.toFixed(2)}
                                </span>
                              </div>
                            </div>
                            {!canAfford && (
                              <p className="mt-3 text-[10px] uppercase tracking-[0.3em] text-rose-200">
                                Insufficient funds in selected debit account.
                              </p>
                            )}
                          </div>

                          <div className="mt-4 grid gap-3 sm:grid-cols-2 text-xs text-slate-400">
                            {Object.values(cities).map((city) => (
                              <div key={city.name} className="rounded-md border border-slate-800 bg-black/70 p-3">
                                <p className="text-slate-300">{city.name}</p>
                                <p>Price band: ${city.basePrice.join("-")}</p>
                                <p>Reliability: {city.reliability}</p>
                                <p>Transit: {city.transitHours}h · Risk {city.transitRisk}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* CONTRACTS (payout to debit accounts) */}
                      {activeApp === "contracts" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <div className="flex items-center justify-between">
                            <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Contract Board</p>
                            <span className="text-xs text-slate-500">Rapid windows</span>
                          </div>

                          <div className="mt-4 space-y-3 text-sm text-slate-300">
                            {contracts.map((contract) => (
                              <div key={contract.id} className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                                <div className="flex flex-wrap items-center justify-between gap-2">
                                  <div>
                                    <p className="text-emerald-100 font-semibold">{contract.title}</p>
                                    <p className="text-xs text-slate-400">
                                      Verdant {contract.tier} · Qty {contract.quantityRange.join("-")}
                                    </p>
                                    <p className="text-xs text-slate-400">
                                      Price band ${contract.priceBand.join("-")} · Risk {contract.risk}
                                    </p>
                                  </div>
                                  <div className="text-xs text-slate-400">{Math.ceil(contract.remainingMs / 1000)}s</div>
                                </div>

                                {contract.status === "Open" ? (
                                  <div className="mt-3 grid gap-2 sm:grid-cols-4">
                                    <input
                                      type="number"
                                      min={contract.quantityRange[0]}
                                      max={contract.quantityRange[1]}
                                      placeholder="Qty"
                                      className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                      id={`${contract.id}-qty`}
                                    />
                                    <input
                                      type="number"
                                      min={contract.priceBand[0]}
                                      max={contract.priceBand[1]}
                                      placeholder="$ / unit"
                                      className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                      id={`${contract.id}-price`}
                                    />
                                    <select
                                      id={`${contract.id}-account`}
                                      className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                    >
                                      {debitAccounts.map((account) => (
                                        <option key={account.id} value={account.id}>
                                          {account.bank} · {account.label}
                                        </option>
                                      ))}
                                    </select>
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const quantity = Number(document.getElementById(`${contract.id}-qty`).value);
                                        const price = Number(document.getElementById(`${contract.id}-price`).value);
                                        const payoutAccountId = document.getElementById(`${contract.id}-account`).value;
                                        handleSubmitOffer(contract, quantity, price, payoutAccountId);
                                      }}
                                      className="rounded-md border border-emerald-400/50 px-3 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200"
                                    >
                                      Submit Offer
                                    </button>
                                  </div>
                                ) : (
                                  <p className="mt-3 text-xs text-slate-400">Status: {contract.status}</p>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* TRANSIT (progress bars added) */}
                      {activeApp === "transit" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Transit</p>
                          <div className="mt-4 space-y-3 text-sm text-slate-300">
                            {shipments.length === 0 && <p>No shipments in transit.</p>}
                            {shipments.map((shipment) => {
                              const elapsed = shipment.durationMs - shipment.remainingMs;
                              const pct = shipment.durationMs > 0 ? Math.min((elapsed / shipment.durationMs) * 100, 100) : 0;

                              return (
                                <div key={shipment.id} className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                                  <div className="flex items-center justify-between">
                                    <p className="text-emerald-100">{shipment.id}</p>
                                    <span className="text-xs text-slate-400">{shipment.status}</span>
                                  </div>
                                  <p className="text-xs text-slate-400">
                                    {shipment.city} · {shipment.quantity} units · {shipment.tier}
                                  </p>
                                  <p className="text-xs text-slate-400">ETA: {Math.ceil(shipment.remainingMs / 1000)}s</p>

                                  <div className="mt-3 h-2 w-full rounded-md bg-slate-800">
                                    <div
                                      className="h-2 rounded-md bg-gradient-to-r from-emerald-400 via-amber-300 to-rose-400 transition-all"
                                      style={{ width: `${pct}%` }}
                                    />
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}

                      {/* NETWORK (updated to debit/credit/cash) */}
                      {activeApp === "network" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Network</p>
                          <div className="mt-4 grid gap-4 md:grid-cols-2 text-sm text-slate-300">
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Reputation</p>
                              <p className="mt-2 text-lg text-emerald-100">{reputation}%</p>
                              <div className="mt-2 h-2 rounded-md bg-slate-800">
                                <div
                                  className="h-2 rounded-md bg-gradient-to-r from-emerald-400 to-emerald-200"
                                  style={{ width: `${reputation}%` }}
                                />
                              </div>
                            </div>

                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Exposure</p>
                              <p className="mt-2 text-lg text-rose-200">{heat}%</p>
                              <div className="mt-2 h-2 rounded-md bg-slate-800">
                                <div
                                  className="h-2 rounded-md bg-gradient-to-r from-rose-400 to-amber-300"
                                  style={{ width: `${heat}%` }}
                                />
                              </div>
                            </div>

                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Finances</p>
                              <div className="mt-2 space-y-2 text-xs">
                                <div className="flex items-center justify-between">
                                  <span>Cash (on hand)</span>
                                  <span>${cashOnHand.toFixed(2)}</span>
                                </div>
                                <div className="flex items-center justify-between text-slate-500">
                                  <span>Cash stash (locked)</span>
                                  <span>${cashStash.toFixed(2)}</span>
                                </div>

                                <div className="mt-2 border-t border-slate-800 pt-2 text-[10px] uppercase tracking-[0.3em] text-slate-500">
                                  Debit
                                </div>
                                {debitAccounts.map((a) => (
                                  <div key={a.id} className="flex items-center justify-between">
                                    <span>{a.bank} · {a.label}</span>
                                    <span>${a.balance.toFixed(2)}</span>
                                  </div>
                                ))}

                                <div className="mt-2 border-t border-slate-800 pt-2 text-[10px] uppercase tracking-[0.3em] text-slate-500">
                                  Credit
                                </div>
                                {creditAccounts.map((c) => (
                                  <div key={c.id} className="flex items-center justify-between">
                                    <span>{c.bank} · {c.label}</span>
                                    <span>${Math.max(c.limit - c.balance, 0).toFixed(2)} avail</span>
                                  </div>
                                ))}
                              </div>
                            </div>

                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Inventory</p>
                              <div className="mt-2 space-y-2 text-xs">
                                <div className="flex items-center justify-between">
                                  <span>Verdant Standard</span>
                                  <span>{inventory.Standard}</span>
                                </div>
                                <div className="flex items-center justify-between">
                                  <span>Verdant Premium</span>
                                  <span>{inventory.Premium}</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* MAP */}
                      {activeApp === "map" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Map</p>
                          <div className="mt-4 grid gap-3 md:grid-cols-3 text-sm text-slate-300">
                            {Object.values(cities).map((city) => (
                              <div key={city.name} className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                                <p className="text-emerald-100">{city.name}</p>
                                <p className="text-xs text-slate-400">Reliability: {city.reliability}</p>
                                <p className="text-xs text-slate-400">Culture: {city.culture}</p>
                                <p className="text-xs text-slate-400">Risk: {city.transitRisk}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {/* MESSAGES */}
                      {activeApp === "messages" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <div className="flex items-center justify-between">
                            <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Messages</p>
                            <span className="text-xs text-slate-500">
                              AI mode: {OPENAI_API_KEY === "PUT_YOUR_KEY_HERE" ? "Scripted" : "Live"}
                            </span>
                          </div>

                          <div className="mt-4 grid gap-4 lg:grid-cols-[0.35fr_1fr]">
                            <div className="space-y-2">
                              {brokers.map((broker) => (
                                <button
                                  key={broker.id}
                                  type="button"
                                  onClick={() => setSelectedBroker(broker)}
                                  className={`w-full rounded-md border px-3 py-2 text-left text-xs uppercase tracking-[0.3em] transition ${
                                    selectedBroker.id === broker.id
                                      ? "border-emerald-300 bg-emerald-500/10 text-emerald-100"
                                      : "border-slate-800 bg-black/60 text-slate-300"
                                  }`}
                                >
                                  {broker.name}
                                </button>
                              ))}
                            </div>

                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Thread · {selectedBroker.name}
                              </p>
                              <div className="mt-3 h-52 space-y-3 overflow-y-auto text-xs text-slate-300">
                                {activeMessages.length === 0 && (
                                  <p className="text-slate-500">Initiate negotiation. Tone matters.</p>
                                )}
                                {activeMessages.map((message) => (
                                  <div key={message.id} className="rounded-md border border-slate-800 bg-black/60 p-2">
                                    <p className="text-[10px] uppercase tracking-[0.3em] text-slate-500">{message.sender}</p>
                                    <p>{message.text}</p>
                                  </div>
                                ))}
                              </div>

                              <div className="mt-3 flex gap-2">
                                <input
                                  type="text"
                                  value={messageInput}
                                  onChange={(event) => setMessageInput(event.target.value)}
                                  placeholder="Compose message..."
                                  className="flex-1 rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                />
                                <button
                                  type="button"
                                  onClick={handleSendMessage}
                                  className="rounded-md border border-emerald-400/60 px-3 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200"
                                >
                                  Send
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* FINANCES (replaces DarkVault Bank/Vault) */}
                      {activeApp === "finances" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Finances</p>

                          <div className="mt-4 grid gap-4 lg:grid-cols-2">
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4 text-sm text-slate-300">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Debit accounts</p>

                              <div className="mt-3 space-y-2 text-xs">
                                {debitAccounts.map((a) => (
                                  <div key={a.id} className="flex items-center justify-between">
                                    <span>
                                      {a.bank} · {a.label} · Fee {(a.feePct * 100).toFixed(1)}% · Delay {a.delayMinutes}m
                                    </span>
                                    <span className="text-emerald-100">${a.balance.toFixed(2)}</span>
                                  </div>
                                ))}
                              </div>

                              <div className="mt-4 rounded-md border border-slate-800 bg-black/50 p-3 text-xs">
                                <div className="flex items-center justify-between">
                                  <span>Cash (on hand)</span>
                                  <span className="text-emerald-100">${cashOnHand.toFixed(2)}</span>
                                </div>
                                <div className="mt-2 flex items-center justify-between">
                                  <span>Cash stash (locked)</span>
                                  <span className="text-slate-400">${cashStash.toFixed(2)}</span>
                                </div>
                                <p className="mt-2 text-[10px] uppercase tracking-[0.3em] text-slate-500">
                                  Cash stash cannot be used for purchases. Reserved for later systems.
                                </p>
                              </div>
                            </div>

                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4 text-sm text-slate-300">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Credit accounts</p>

                              <div className="mt-3 space-y-3">
                                {creditAccounts.map((c) => {
                                  const available = Math.max(c.limit - c.balance, 0);
                                  const aprPct = (c.apr * 100).toFixed(2);
                                  return (
                                    <div key={c.id} className="rounded-md border border-slate-800 bg-black/50 p-3">
                                      <div className="flex items-center justify-between">
                                        <p className="text-emerald-100 font-semibold">{c.bank} · {c.label}</p>
                                        <span className="text-xs text-slate-400">APR {aprPct}%</span>
                                      </div>

                                      <div className="mt-2 grid gap-2 sm:grid-cols-2 text-xs">
                                        <div className="flex items-center justify-between">
                                          <span>Limit</span>
                                          <span>${c.limit.toFixed(2)}</span>
                                        </div>
                                        <div className="flex items-center justify-between">
                                          <span>Balance</span>
                                          <span>${c.balance.toFixed(2)}</span>
                                        </div>
                                        <div className="flex items-center justify-between">
                                          <span>Available</span>
                                          <span className="text-emerald-100">${available.toFixed(2)}</span>
                                        </div>
                                        <div className="flex items-center justify-between">
                                          <span>Payments (this month)</span>
                                          <span>{c.paymentsThisMonth}</span>
                                        </div>
                                      </div>

                                      <button
                                        type="button"
                                        onClick={() => {
                                          const currentMonth = Math.floor((gameDay - 1) / 30) + 1;

                                          if (c.paymentsThisMonth < 1) {
                                            addLog("Limit increase denied: no payment activity this month.");
                                            return;
                                          }
                                          if (c.lastLimitIncreaseMonth === currentMonth) {
                                            addLog("Limit increase already requested this month.");
                                            return;
                                          }

                                          const approved = Math.random() > 0.35;

                                          setCreditAccounts((prev) =>
                                            prev.map((x) => {
                                              if (x.id !== c.id) return x;
                                              const bump = approved ? Math.floor(x.limit * 0.25) : 0;
                                              return {
                                                ...x,
                                                limit: approved ? x.limit + bump : x.limit,
                                                lastLimitIncreaseMonth: currentMonth,
                                              };
                                            })
                                          );

                                          addLog(
                                            approved
                                              ? `Credit limit increased for ${c.bank} (${c.label}).`
                                              : `Limit increase denied by ${c.bank}.`
                                          );
                                        }}
                                        className="mt-3 w-full rounded-md border border-amber-300/50 px-3 py-2 text-xs uppercase tracking-[0.3em] text-amber-200 hover:border-amber-200"
                                      >
                                        Request Limit Increase (Monthly)
                                      </button>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* FACILITIES */}
                      {activeApp === "facilities" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5 text-sm text-slate-300">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Facilities / Real Estate</p>
                          <p className="mt-3 text-slate-400">
                            Locked. Expansion nodes will unlock after reputation tiers increase.
                          </p>
                        </div>
                      )}

                      <div className="rounded-md border border-slate-800 bg-black/60 p-4 text-xs text-slate-400">
                        <p className="uppercase tracking-[0.3em] text-slate-500">Event Log</p>
                        <div className="mt-2 space-y-1">
                          {eventLogRef.current.length === 0 && <p>No events logged yet.</p>}
                          {eventLogRef.current.map((entry) => (
                            <p key={entry.id}>• {entry.text}</p>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              )}
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
