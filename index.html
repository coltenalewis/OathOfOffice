<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>An Iron Reign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Cinzel", "Trajan Pro", "Garamond", "Times New Roman", serif;
      }

      .ember-glow {
        background: radial-gradient(circle at center, rgba(250, 204, 21, 0.5), transparent 60%);
        filter: blur(0.5rem);
        animation: emberPulse 2.8s ease-in-out infinite;
      }

      .mist-layer {
        background: linear-gradient(120deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.55));
        animation: mistDrift 18s ease-in-out infinite alternate;
      }

      .loading-ring {
        border: 2px solid rgba(148, 163, 184, 0.4);
        border-top-color: rgba(248, 113, 113, 0.9);
        animation: spin 1.2s linear infinite;
      }

      .stat-glow {
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
      }

      @keyframes emberPulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.15);
        }
      }

      @keyframes mistDrift {
        0% {
          transform: translateX(-3%);
        }
        100% {
          transform: translateX(3%);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const servers = [
        {
          id: 1,
          name: "Test Realm — Winterfell",
          status: "Stable",
          players: "42/120",
          region: "The North",
          tag: "Roleplay",
        },
        {
          id: 2,
          name: "Stormwatch — Dragonstone",
          status: "High Traffic",
          players: "96/120",
          region: "Crownlands",
          tag: "Hardcore",
        },
        {
          id: 3,
          name: "Golden Spires — Oldtown",
          status: "New",
          players: "12/90",
          region: "The Reach",
          tag: "Narrative",
        },
      ];

      const baseStats = [
        { key: "combat", label: "Combat", value: 5 },
        { key: "intrigue", label: "Intrigue", value: 5 },
        { key: "knowledge", label: "Knowledge", value: 5 },
        { key: "stewardship", label: "Stewardship", value: 5 },
      ];

      const skinTones = [
        { name: "Pale", filter: "brightness(1.2) saturate(0.85)" },
        { name: "Fair", filter: "brightness(1.05) saturate(0.95)" },
        { name: "Tan", filter: "brightness(0.95) sepia(0.2) saturate(1.1)" },
        { name: "Olive", filter: "brightness(0.85) sepia(0.35) saturate(1.15)" },
        { name: "Brown", filter: "brightness(0.7) sepia(0.45) saturate(1.2)" },
        { name: "Deep", filter: "brightness(0.55) sepia(0.55) saturate(1.25)" },
      ];

      const App = () => {
        const [screen, setScreen] = useState("landing");
        const [selectedServer, setSelectedServer] = useState(null);
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [characterName, setCharacterName] = useState("");
        const [characterHouse, setCharacterHouse] = useState("Traveler");
        const [characterRole, setCharacterRole] = useState("Wandering Traveler");
        const [characterGender, setCharacterGender] = useState(null);
        const [skinTone, setSkinTone] = useState(skinTones[1]);
        const [goldCoins, setGoldCoins] = useState(120);
        const [stats, setStats] = useState(baseStats);
        const [pointsAvailable, setPointsAvailable] = useState(6);
        const detailsRef = useRef(null);

        useEffect(() => {
          if (screen !== "loading") return;
          setLoadingProgress(0);
          const interval = setInterval(() => {
            setLoadingProgress((prev) => {
              const nextValue = Math.min(prev + Math.floor(Math.random() * 12 + 6), 100);
              if (nextValue >= 100) {
                clearInterval(interval);
                setTimeout(() => setScreen("game"), 500);
              }
              return nextValue;
            });
          }, 350);

          return () => clearInterval(interval);
        }, [screen]);

        const immersionLines = useMemo(
          () => [
            "Swearing fealty to the realm...",
            "Saddling your warhorse...",
            "Summoning ravens across Westeros...",
            "Sharpening steel and sealing vows...",
          ],
          []
        );

        const progressMessage = useMemo(() => {
          const index = Math.floor((loadingProgress / 100) * immersionLines.length);
          return immersionLines[Math.min(index, immersionLines.length - 1)];
        }, [loadingProgress, immersionLines]);

        const householdLabel =
          characterHouse === "Traveler" ? "Traveler" : `House ${characterHouse}`;

        const totalStatValue = stats.reduce((sum, stat) => sum + stat.value, 0);
        const characterProgress = useMemo(() => {
          let progress = 0;
          if (characterGender) progress += 34;
          if (characterGender && skinTone) progress += 33;
          if (characterName.trim()) progress += 33;
          return Math.min(progress, 100);
        }, [characterGender, skinTone, characterName]);

        const genderImage = characterGender
          ? characterGender === "Female"
            ? "https://i.imgur.com/5dSdv1p.png"
            : "https://i.imgur.com/MQiTPfC.png"
          : null;

        const handleGenderSelect = (gender) => {
          setCharacterGender(gender);
          requestAnimationFrame(() => {
            detailsRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        };

        const handleAllocatePoint = (key) => {
          if (pointsAvailable <= 0) return;
          setStats((prev) =>
            prev.map((stat) =>
              stat.key === key ? { ...stat, value: stat.value + 1 } : stat
            )
          );
          setPointsAvailable((prev) => Math.max(prev - 1, 0));
        };

        const handleResetStats = () => {
          setStats(baseStats);
          setPointsAvailable(6);
        };

        return (
          <main className="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800">
            <div className="absolute inset-0 mist-layer opacity-80" />
            <div className="absolute inset-0">
              <div className="absolute -left-10 top-20 h-64 w-64 rounded-full ember-glow" />
              <div className="absolute right-10 top-24 h-72 w-72 rounded-full ember-glow" />
              <div className="absolute bottom-10 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full ember-glow" />
            </div>

            <div className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center gap-10 px-5 py-10 sm:px-6">
              <header className="space-y-4 text-center">
                <p className="text-xs font-semibold uppercase tracking-[0.5em] text-amber-200/70">
                  A Medieval Fantasy RP Experience
                </p>
                <h1 className="text-4xl font-semibold uppercase tracking-[0.35em] text-amber-100 sm:text-5xl">
                  An Iron Reign
                </h1>
                <p className="mx-auto max-w-2xl text-base text-slate-200/80">
                  Forge your legend in Westeros. Create a character, swear allegiance, and roleplay however
                  you please in a living world inspired by Game of Thrones.
                </p>
              </header>

              <div className="flex justify-center">
                <button
                  type="button"
                  onClick={() => setScreen("servers")}
                  className="w-full max-w-md rounded-2xl bg-amber-400 px-6 py-4 text-base font-semibold uppercase tracking-[0.3em] text-slate-900 shadow-xl shadow-amber-500/40 transition hover:scale-[1.02] hover:bg-amber-300"
                >
                  Play Now
                </button>
              </div>

              {screen === "landing" && (
                <section className="grid gap-8 lg:grid-cols-[1.2fr_0.8fr]">
                  <div className="space-y-6 rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 shadow-2xl shadow-black/40">
                    <div className="space-y-2">
                      <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                        Realm Overview
                      </p>
                      <h2 className="text-2xl font-semibold text-amber-100">A living Westeros</h2>
                      <p className="text-sm text-slate-300">
                        Step into a shared narrative where your choices shape the realm. Pick a server first,
                        then craft your traveler&apos;s identity.
                      </p>
                    </div>

                    <div className="grid gap-4 sm:grid-cols-2">
                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">The North</p>
                        <p className="mt-2 text-sm text-slate-300">
                          Brave the cold to earn loyalty from ancient houses.
                        </p>
                      </div>
                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">The Crownlands</p>
                        <p className="mt-2 text-sm text-slate-300">
                          Intrigue and politics rule the halls of power.
                        </p>
                      </div>
                    </div>

                    <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4">
                      <p className="text-xs uppercase tracking-[0.3em] text-slate-400">How it works</p>
                      <ul className="mt-3 space-y-2 text-sm text-slate-300">
                        <li>1. Choose a realm in the server browser.</li>
                        <li>2. Create a character with a first name and household.</li>
                        <li>3. Enter the realm and begin your roleplay journey.</li>
                      </ul>
                    </div>
                  </div>

                  <div className="flex flex-col justify-between gap-6 rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 shadow-2xl shadow-black/40">
                    <div className="space-y-4">
                      <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                        Realm Briefing
                      </p>
                      <h3 className="text-2xl font-semibold text-amber-100">The Iron Throne awaits</h3>
                      <p className="text-sm text-slate-300">
                        Enter a shared world of noble houses, secret alliances, and grand battlefields.
                        Your character can be anything—from a commoner to a noble sworn to power.
                      </p>
                      <ul className="space-y-3 text-sm text-slate-300">
                        <li className="flex items-center gap-3">
                          <span className="h-2 w-2 rounded-full bg-amber-300" />
                          Persistent roleplay realms with live storytellers.
                        </li>
                        <li className="flex items-center gap-3">
                          <span className="h-2 w-2 rounded-full bg-rose-300" />
                          Craft alliances, betray rivals, and command armies.
                        </li>
                        <li className="flex items-center gap-3">
                          <span className="h-2 w-2 rounded-full bg-slate-300" />
                          Seasonal events rooted in the lore of Westeros.
                        </li>
                      </ul>
                    </div>

                    <button
                      type="button"
                      onClick={() => setScreen("servers")}
                      className="w-full rounded-xl border border-amber-300/60 px-4 py-3 text-sm font-semibold uppercase tracking-[0.3em] text-amber-200 transition hover:border-amber-200 hover:text-amber-100"
                    >
                      View Servers
                    </button>
                  </div>
                </section>
              )}

              {screen === "servers" && (
                <section className="rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 shadow-2xl shadow-black/40">
                  <div className="flex flex-wrap items-center justify-between gap-6">
                    <div>
                      <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                        Server Browser
                      </p>
                      <h2 className="text-2xl font-semibold text-amber-100">Choose your realm</h2>
                      <p className="text-sm text-slate-300">
                        Each realm hosts unique stories and player-led events. Select a test server to begin.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setScreen("landing")}
                      className="rounded-xl border border-slate-600 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                    >
                      Back
                    </button>
                  </div>

                  <div className="mt-6 grid gap-4 md:grid-cols-2">
                    {servers.map((server) => (
                      <button
                        key={server.id}
                        type="button"
                        onClick={() => {
                          setSelectedServer(server);
                          setScreen("character");
                        }}
                        className="group flex w-full flex-col gap-4 rounded-2xl border border-slate-700/80 bg-slate-950/60 p-5 text-left transition hover:-translate-y-1 hover:border-amber-300/70 hover:shadow-lg hover:shadow-amber-500/20"
                      >
                        <div className="flex items-start justify-between">
                          <div>
                            <h3 className="text-lg font-semibold text-amber-100 group-hover:text-amber-200">
                              {server.name}
                            </h3>
                            <p className="text-xs uppercase tracking-[0.35em] text-slate-400">
                              {server.region}
                            </p>
                          </div>
                          <span className="rounded-full border border-slate-700 px-3 py-1 text-xs uppercase tracking-[0.3em] text-slate-300">
                            {server.tag}
                          </span>
                        </div>
                        <div className="flex flex-wrap items-center gap-4 text-xs text-slate-300">
                          <span className="rounded-full bg-slate-800 px-3 py-1">
                            Status: {server.status}
                          </span>
                          <span className="rounded-full bg-slate-800 px-3 py-1">
                            Players: {server.players}
                          </span>
                        </div>
                        <span className="text-xs font-semibold uppercase tracking-[0.4em] text-amber-300">
                          Join Test Server →
                        </span>
                      </button>
                    ))}
                  </div>
                </section>
              )}

              {screen === "character" && (
                <section className="mx-auto w-full max-w-5xl rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 shadow-2xl shadow-black/40 sm:p-10">
                  <div className="flex flex-wrap items-center justify-between gap-6">
                    <div>
                      <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                        Character Creation
                      </p>
                      <h2 className="mt-2 text-3xl font-semibold text-amber-100">
                        Shape your traveler
                      </h2>
                      <p className="mt-3 text-sm text-slate-300">
                        Start with a gender, then build your look and identity. You can remain a Traveler
                        and find your household later.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setScreen("servers")}
                      className="rounded-xl border border-slate-600 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                    >
                      Back
                    </button>
                  </div>

                  <div className="mt-6 rounded-2xl border border-slate-700/70 bg-slate-950/60 px-4 py-3">
                    <div className="flex items-center justify-between text-xs uppercase tracking-[0.3em] text-slate-400">
                      <span>Progress</span>
                      <span>{characterProgress}%</span>
                    </div>
                    <div className="mt-2 h-2 w-full rounded-full bg-slate-800">
                      <div
                        className="h-2 rounded-full bg-gradient-to-r from-rose-400 via-amber-400 to-amber-200 transition-all"
                        style={{ width: `${characterProgress}%` }}
                      />
                    </div>
                  </div>

                  <div className="mt-8 grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
                    <div className="space-y-6">
                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-5">
                        <p className="text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                          Step 1 · Choose gender
                        </p>
                        <div className="mt-4 grid gap-3 sm:grid-cols-2">
                          {["Male", "Female"].map((gender) => (
                            <button
                              key={gender}
                              type="button"
                              onClick={() => handleGenderSelect(gender)}
                              className={`rounded-2xl border px-4 py-4 text-sm font-semibold uppercase tracking-[0.3em] transition ${
                                characterGender === gender
                                  ? "border-amber-300 bg-amber-300/10 text-amber-100"
                                  : "border-slate-700 bg-slate-950/60 text-slate-300 hover:border-amber-300/70"
                              }`}
                            >
                              {gender}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div
                        ref={detailsRef}
                        className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-5"
                      >
                        <p className="text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                          Step 2 · Appearance &amp; identity
                        </p>
                        <div className="mt-5 grid gap-5 lg:grid-cols-[0.8fr_1.2fr]">
                          <div className="rounded-2xl border border-slate-700/70 bg-slate-900/70 p-4">
                            <div className="flex items-center justify-between text-xs uppercase tracking-[0.3em] text-slate-400">
                              <span>Base model</span>
                              <span>{characterGender || "Select gender"}</span>
                            </div>
                            <div className="mt-4 flex justify-center">
                              {genderImage ? (
                                <img
                                  src={genderImage}
                                  alt={`${characterGender} base model`}
                                  className="h-56 w-auto object-contain"
                                  style={{ filter: skinTone.filter }}
                                />
                              ) : (
                                <div className="flex h-56 w-full items-center justify-center rounded-2xl border border-dashed border-slate-700/70 text-xs uppercase tracking-[0.3em] text-slate-500">
                                  Awaiting selection
                                </div>
                              )}
                            </div>
                            <p className="mt-4 text-center text-xs text-slate-400">
                              Skin tone preview updates instantly.
                            </p>
                          </div>

                          <div className="space-y-4">
                            <div>
                              <p className="text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                                Skin tone
                              </p>
                              <div
                                className={`mt-3 flex flex-wrap gap-3 ${
                                  characterGender ? "" : "pointer-events-none opacity-50"
                                }`}
                              >
                                {skinTones.map((tone) => (
                                  <button
                                    key={tone.name}
                                    type="button"
                                    onClick={() => setSkinTone(tone)}
                                    className={`flex items-center gap-3 rounded-full border px-3 py-2 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                                      skinTone.name === tone.name
                                        ? "border-amber-300 text-amber-100"
                                        : "border-slate-700 text-slate-300 hover:border-amber-300/70"
                                    }`}
                                  >
                                    <span
                                      className="h-5 w-5 rounded-full border border-slate-700/70"
                                      style={{ filter: tone.filter, background: "#f1e8dc" }}
                                    />
                                    {tone.name}
                                  </button>
                                ))}
                              </div>
                            </div>

                            <label className="space-y-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                              First name
                              <input
                                type="text"
                                value={characterName}
                                onChange={(event) => setCharacterName(event.target.value)}
                                placeholder="Arya"
                                className="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/30"
                              />
                            </label>

                            <label className="space-y-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                              Role
                              <select
                                value={characterRole}
                                onChange={(event) => setCharacterRole(event.target.value)}
                                className="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/30"
                              >
                                <option>Wandering Traveler</option>
                                <option>Hedge Knight</option>
                                <option>Maester Apprentice</option>
                                <option>Silent Sister</option>
                                <option>Merchant Scout</option>
                              </select>
                            </label>

                            <label className="space-y-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                              Household
                              <select
                                value={characterHouse}
                                onChange={(event) => setCharacterHouse(event.target.value)}
                                className="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/30"
                              >
                                <option>Traveler</option>
                                <option>Stark</option>
                                <option>Lannister</option>
                                <option>Targaryen</option>
                                <option>Tyrell</option>
                                <option>Martell</option>
                                <option>Greyjoy</option>
                              </select>
                            </label>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="flex flex-col justify-between gap-6 rounded-2xl border border-slate-700/70 bg-slate-950/60 p-6">
                      <div className="space-y-3">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Starting Status</p>
                        <p className="text-base text-amber-100">
                          {characterName || "Unnamed Traveler"}
                        </p>
                        <p className="text-xs text-slate-400">
                          {characterGender || "Gender pending"}
                        </p>
                        <p className="text-xs text-slate-400">{characterRole}</p>
                        <p className="text-xs text-slate-400">{householdLabel}</p>
                        <div className="mt-4 space-y-2 text-sm text-slate-300">
                          <p>• Neutral reputation across all regions.</p>
                          <p>• Basic gear: cloak, dagger, travel rations.</p>
                          <p>• Free to pledge loyalty after arrival.</p>
                        </div>
                      </div>
                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4 text-sm text-slate-300">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Selected Realm</p>
                        <p className="mt-2 text-base text-amber-100">
                          {selectedServer?.name || "Test Realm"}
                        </p>
                        <p className="text-xs text-slate-400">
                          Region: {selectedServer?.region || "Westeros"}
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={() => setScreen("loading")}
                        className="w-full rounded-xl bg-amber-400 px-4 py-3 text-sm font-semibold uppercase tracking-[0.3em] text-slate-900 shadow-lg shadow-amber-500/40 transition hover:bg-amber-300"
                      >
                        Create Character
                      </button>
                    </div>
                  </div>
                </section>
              )}

              {screen === "loading" && (
                <section className="mx-auto w-full max-w-3xl rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 text-center shadow-2xl shadow-black/40 sm:p-10">
                  <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                    Entering the realm
                  </p>
                  <h2 className="mt-3 text-3xl font-semibold text-amber-100">
                    {selectedServer?.name || "Preparing the realm"}
                  </h2>
                  <p className="mt-4 text-sm text-slate-300">{progressMessage}</p>

                  <div className="mt-8 flex flex-col items-center justify-center gap-6 sm:flex-row">
                    <div className="loading-ring h-16 w-16 rounded-full" />
                    <div className="w-full">
                      <div className="flex items-center justify-between text-xs uppercase tracking-[0.3em] text-slate-400">
                        <span>Loading</span>
                        <span>{loadingProgress}%</span>
                      </div>
                      <div className="mt-3 h-3 w-full rounded-full bg-slate-800">
                        <div
                          className="h-3 rounded-full bg-gradient-to-r from-rose-400 via-amber-400 to-amber-200 transition-all"
                          style={{ width: `${loadingProgress}%` }}
                        />
                      </div>
                      <div
                        className="mt-4 h-2 rounded-full bg-[length:200%_200%] bg-gradient-to-r from-slate-900 via-slate-700 to-slate-900"
                        style={{ animation: "shimmer 2s linear infinite" }}
                      />
                    </div>
                  </div>

                  <div className="mt-10 grid gap-4 text-left text-sm text-slate-300 sm:grid-cols-2">
                    <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4">
                      <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Character</p>
                      <p className="mt-2 text-base text-amber-100">
                        {characterName || "Unnamed Traveler"}
                      </p>
                      <p className="text-xs text-slate-400">{characterRole}</p>
                      <p className="text-xs text-slate-400">{householdLabel}</p>
                    </div>
                    <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4">
                      <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Realm Weather</p>
                      <p className="mt-2 text-base text-amber-100">Cold winds, low visibility</p>
                      <p className="text-xs text-slate-400">Adjusting to region: {selectedServer?.region}</p>
                    </div>
                  </div>
                </section>
              )}

              {screen === "game" && (
                <section className="mx-auto w-full max-w-5xl rounded-3xl border border-slate-700/60 bg-slate-900/70 p-6 shadow-2xl shadow-black/40 sm:p-10">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                        Temp Game Screen
                      </p>
                      <h2 className="mt-2 text-3xl font-semibold text-amber-100">
                        The Realm of Westeros
                      </h2>
                      <p className="mt-3 text-sm text-slate-300">
                        You are now connected to {selectedServer?.name || "the realm"}. This is a temporary
                        staging area while the full RP world loads.
                      </p>
                    </div>
                    <div className="flex items-center gap-3 rounded-2xl border border-amber-300/30 bg-slate-950/70 px-4 py-2">
                      <span className="text-xs uppercase tracking-[0.3em] text-amber-200">Gold</span>
                      <span className="text-lg font-semibold text-amber-100">{goldCoins}</span>
                      <span className="text-xs text-slate-400">coins</span>
                    </div>
                  </div>

                  <div className="mt-8 grid gap-6 lg:grid-cols-[1.2fr_0.8fr]">
                    <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-6">
                      <div className="flex flex-wrap items-center justify-between gap-3">
                        <h3 className="text-lg font-semibold text-amber-100">Life Ledger</h3>
                        <span className="rounded-full border border-slate-700 px-3 py-1 text-xs uppercase tracking-[0.3em] text-slate-300">
                          {selectedServer?.region || "Westeros"}
                        </span>
                      </div>
                      <div className="mt-4 grid gap-4 text-sm text-slate-300">
                        <div className="rounded-xl border border-slate-700/70 bg-slate-900/70 p-4">
                          <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Opening Move</p>
                          <p className="mt-2 text-base text-amber-100">A new season dawns</p>
                          <p className="text-xs text-slate-400">
                            You arrive with only a satchel of supplies and a name to carve into history.
                          </p>
                        </div>
                        <div className="rounded-xl border border-slate-700/70 bg-slate-900/70 p-4">
                          <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Whispers</p>
                          <p className="mt-2 text-base text-amber-100">Opportunity calls</p>
                          <p className="text-xs text-slate-400">
                            A steward offers work in exchange for loyalty to a noble cause.
                          </p>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-6">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Character Status</p>
                        <p className="mt-2 text-base text-amber-100">
                          {characterName || "Unnamed Traveler"}
                        </p>
                        <p className="text-xs text-slate-400">{characterRole}</p>
                        <p className="text-xs text-slate-400">{householdLabel}</p>
                      </div>

                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-6">
                        <div className="flex flex-wrap items-center justify-between gap-3">
                          <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Royal Attributes</p>
                          <div className="flex items-center gap-2 text-xs text-slate-300">
                            <span className="h-2 w-2 animate-pulse rounded-full bg-amber-300" />
                            {pointsAvailable} points to assign
                          </div>
                        </div>
                        <div className="mt-4 space-y-3">
                          {stats.map((stat) => (
                            <div
                              key={stat.key}
                              className="flex items-center justify-between gap-3 rounded-xl border border-slate-700/70 bg-slate-900/70 px-3 py-2"
                            >
                              <div>
                                <p className="text-sm text-amber-100">{stat.label}</p>
                                <p className="text-xs text-slate-400">Level {stat.value}</p>
                              </div>
                              <div className="flex items-center gap-2">
                                <div className="h-2 w-24 rounded-full bg-slate-800">
                                  <div
                                    className="h-2 rounded-full bg-gradient-to-r from-amber-300 via-amber-400 to-rose-300 transition-all"
                                    style={{ width: `${Math.min(stat.value * 8, 100)}%` }}
                                  />
                                </div>
                                <button
                                  type="button"
                                  onClick={() => handleAllocatePoint(stat.key)}
                                  disabled={pointsAvailable <= 0}
                                  className={`stat-glow h-8 w-8 rounded-full border text-sm font-semibold transition ${
                                    pointsAvailable <= 0
                                      ? "cursor-not-allowed border-slate-700 text-slate-600"
                                      : "border-amber-300/70 text-amber-200 hover:scale-105"
                                  }`}
                                >
                                  +
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                        <div className="mt-4 flex items-center justify-between text-xs text-slate-400">
                          <span>Total: {totalStatValue} pts</span>
                          <button
                            type="button"
                            onClick={handleResetStats}
                            className="rounded-full border border-slate-700 px-3 py-1 uppercase tracking-[0.3em] transition hover:border-amber-300 hover:text-amber-200"
                          >
                            Reset
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-4">
                    {["Character", "Travel", "Message", "Inventory"].map((item) => (
                      <button
                        key={item}
                        type="button"
                        className="rounded-2xl border border-slate-700/70 bg-slate-950/60 px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                      >
                        {item}
                      </button>
                    ))}
                  </div>
                </section>
              )}
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
