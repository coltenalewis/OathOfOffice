      overflow: hidden;
    }

      content: "";
      position: absolute;
      top: -120%;
      left: -60%;
      width: 90%;
      height: 280%;
      transform: rotate(18deg);
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.12), transparent);

      const [selectedCourtierId, setSelectedCourtierId] = useState("c-onyx");

      // Trust/Access progression per courtier (0..100)
      const [access, setAccess] = useState({

      // Inventory by SKU: inventory[productId][qualityId] = qty
      const [inventory, setInventory] = useState(() => {
        const init = {};

          init[p.id] = { poor: 0, medium: 0, premium: 0 };

      });

      // Shipments / Contracts / Messages
      const [shipments, setShipments] = useState([]);
      const [contracts, setContracts] = useState([]);
      const [messages, setMessages] = useState({}); // messages[courtierId] = [...]
      const [personalDeliveryActive, setPersonalDeliveryActive] = useState(false);

      // Event log
      const eventLogRef = useRef([]);

      const addLog = (msg) => {
        eventLogRef.current = [{ id: Date.now() + Math.random(), text: msg }, ...eventLogRef.current].slice(0, 14);
      };

      // Game time
      const gameElapsedMs = Date.now() - bootTimestamp;
      const gameMinutes = Math.floor(gameElapsedMs / MS_PER_GAME_MINUTE);
      const gameDay = Math.floor(gameMinutes / 1440) + 1;
      const gameMonth = Math.floor(gameDay / 30) + 1;
      const gameHour = Math.floor((gameMinutes % 1440) / 60);
      const gameMinute = gameMinutes % 60;
      const gameTimeStr = `${String(gameHour).padStart(2, '0')}:${String(gameMinute).padStart(2, '0')}`;

      const displayName = (hasCustomNameUnlock && customName.trim()) ? customName : generatedName;

      const totalLiquidity = useMemo(() => {
        const debitTotal = debitAccounts.reduce((sum, a) => sum + a.balance, 0);
        const creditAvail = creditAccounts.reduce((sum, c) => sum + Math.max(c.limit - c.balance, 0), 0);
        return debitTotal + creditAvail + cashOnHand;
      }, [debitAccounts, creditAccounts, cashOnHand]);

      const totalDebt = useMemo(() => {
        const creditDebt = creditAccounts.reduce((sum, c) => sum + c.balance, 0);
        return creditDebt + studentDebt;
      }, [creditAccounts, studentDebt]);

      /* =========================
         CUSTOM MODAL FLOW (replaces browser prompts)
      ========================= */
      const [moneyModal, setMoneyModal] = useState({
        open: false,
        title: "",
        subtitle: "",
        mode: "",            // "debit_deposit" | "debit_withdraw" | "credit_draw" | "credit_pay" | "student_pay"

      const openMoneyModal = (cfg) => {
        setMoneyModal({
          open: true,
          title: cfg.title,
          subtitle: cfg.subtitle || "",
          mode: cfg.mode,
          accountId: cfg.accountId || "",
          value: cfg.value ?? "0"

      };

      const closeMoneyModal = () => {
        setMoneyModal((p) => ({ ...p, open: false }));
      };

      const parseMoney = (raw) => {
        const cleaned = String(raw ?? "").replace(/[^0-9.]/g, "");
        const num = Number(cleaned);
        if (!Number.isFinite(num)) return 0;
        return Math.max(0, num);
      };

      const applyMoneyModal = () => {
        const amt = parseMoney(moneyModal.value);
        if (amt <= 0) {
          showToast("Invalid amount", "Enter a positive number.", null, null);
          return;
        }

        const mode = moneyModal.mode;
        const id = moneyModal.accountId;

        if (mode === "debit_deposit") {
          const acc = debitAccounts.find(a => a.id === id);
          if (!acc) return;
          if (cashOnHand < amt) {
            showToast("Deposit blocked", "Insufficient cash on hand.", null, null);
            return;
          }
          setCashOnHand(c => c - amt);
          setDebitAccounts(accs => accs.map(a => a.id === id ? { ...a, balance: a.balance + amt } : a));
          addLog(`Deposited $${amt.toFixed(2)} to ${acc.bank}.`);
          showToast("Deposit complete", `+$${amt.toFixed(2)} to ${acc.bank}.`, "Go to Finances", "finances");
          closeMoneyModal();
          return;
        }

        if (mode === "debit_withdraw") {
          const acc = debitAccounts.find(a => a.id === id);
          if (!acc) return;
          if (acc.balance < amt) {
            showToast("Withdrawal blocked", "Insufficient account balance.", null, null);
            return;
          }
          setDebitAccounts(accs => accs.map(a => a.id === id ? { ...a, balance: a.balance - amt } : a));
          setCashOnHand(c => c + amt);
          addLog(`Withdrew $${amt.toFixed(2)} from ${acc.bank}.`);
          showToast("Withdrawal complete", `+$${amt.toFixed(2)} cash received.`, "Go to Finances", "finances");
          closeMoneyModal();
          return;
        }

        if (mode === "credit_draw") {
          const card = creditAccounts.find(c => c.id === id);
          if (!card) return;
          const available = Math.max(card.limit - card.balance, 0);
          if (available < amt) {
            showToast("Draw blocked", "Exceeds available credit.", null, null);
            return;
          }
          setCreditAccounts(cards => cards.map(c => c.id === id ? { ...c, balance: c.balance + amt } : c));
          setCashOnHand(c => c + amt);
          addLog(`Drew $${amt.toFixed(2)} from ${card.bank}.`);
          showToast("Credit drawn", `+$${amt.toFixed(2)} cash received.`, "Go to Finances", "finances");
          closeMoneyModal();
          return;
        }

        if (mode === "credit_pay") {
          const card = creditAccounts.find(c => c.id === id);
          if (!card) return;
          const payAmt = Math.min(amt, card.balance);
          if (payAmt <= 0) {
            showToast("Nothing to pay", "That card has no balance.", null, null);
            return;
          }
          if (cashOnHand < payAmt) {
            showToast("Payment blocked", "Insufficient cash on hand.", null, null);
            return;
          }
          setCashOnHand(c => c - payAmt);
          setCreditAccounts(cards => cards.map(c => c.id === id ? { ...c, balance: c.balance - payAmt } : c));
          addLog(`Paid $${payAmt.toFixed(2)} to ${card.bank}.`);
          showToast("Payment complete", `-$${payAmt.toFixed(2)} cash.`, "Go to Finances", "finances");
          closeMoneyModal();
          return;
        }

        if (mode === "student_pay") {

      const resolveShipmentOutcome = (shipment) => {
        // Deterministic-ish: weighted by reliability and riskMult
        // roll decreases with reliability, increases with risk
        const risk = shipment.riskMult ?? 1.0;
        const rel = shipment.reliability ?? 0.85;

        const roll = Math.random() * risk; // higher risk => worse
        // thresholds shaped by reliability
        const deliveredT = 0.55 * rel;   // higher reliability => higher threshold for "good"
        const delayedT   = 0.85 * rel;
        const partialT   = 1.05 * rel;

        let outcome = "Delivered";
        if (roll > partialT) outcome = "Disrupted";
        else if (roll > delayedT) outcome = "Partial Loss";
        else if (roll > deliveredT) outcome = "Delayed";

        // apply inventory impact
        setInventory(prev => {
          const next = safeClone(prev);

          const p = shipment.productId;
          const q = shipment.qualityId;

          if (!next[p]) next[p] = { poor: 0, medium: 0, premium: 0 };
          if (!next[p][q]) next[p][q] = 0;

          let gained = shipment.quantity;
          if (outcome === "Delayed") gained = Math.floor(shipment.quantity * 0.8);
          if (outcome === "Partial Loss") gained = Math.floor(shipment.quantity * 0.5);
          if (outcome === "Disrupted") gained = 0;

          next[p][q] += gained;
          return next;
        });

        // heat/reputation/suspicion consequences
        const heatDelta = outcome === "Disrupted" ? 8 : (outcome === "Partial Loss" ? 4 : 2);
        const repDelta = outcome === "Disrupted" ? -4 : (outcome === "Partial Loss" ? -2 : 0);

        setHeat(h => Math.min(100, h + heatDelta));
        setReputation(r => Math.max(0, Math.min(100, r + repDelta)));
        setSuspicion(s => Math.min(100, s + (outcome === "Disrupted" ? 3 : 1)));

                  <p className="mt-1 text-[11px] text-slate-500">
                    Risk x{q.risk} · Rel {Math.round(q.reliability * 100)}%
                  </p>
                </div>
              ))}
            </div>
          </div>
        ))}

        <div className="rounded-2xl border border-slate-800 bg-slate-900/30 p-5">
          <p className="text-sm font-semibold text-slate-100">⚠️ Risk Metrics</p>

          <div className="mt-3">
            <div className="flex items-center justify-between text-xs text-slate-400">
              <span>Heat</span>
              <span>{heat}%</span>
            </div>
            <div className="mt-2 h-2 w-full rounded-full bg-slate-950/60">
              <div className="h-2 rounded-full bg-emerald-500/70" style={{ width: `${heat}%` }} />
            </div>
          </div>
        </div>
      </div>
    </div>
  )}
</div>

      )}
    </div>
  </div>
</section>
            )}
          </div>
        </main>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
