<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Into The Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Share Tech Mono", "Fira Mono", "JetBrains Mono", monospace;
      }

      .scanlines::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.04) 1px,
          rgba(0, 0, 0, 0.08) 1px,
          rgba(0, 0, 0, 0.08) 3px
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .terminal-flicker {
        animation: flicker 3s infinite;
      }

      .glow-pulse {
        animation: glowPulse 2.4s ease-in-out infinite;
      }

      .boot-cursor {
        display: inline-block;
        width: 10px;
        height: 18px;
        background: #22d3ee;
        margin-left: 6px;
        animation: cursorBlink 1s steps(2, start) infinite;
      }

      .panel-overlay {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
      }

      .panel-overlay.is-open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      @keyframes flicker {
        0%,
        19%,
        21%,
        23%,
        80%,
        100% {
          opacity: 1;
        }
        20%,
        22%,
        24%,
        81% {
          opacity: 0.75;
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(34, 211, 238, 0.2);
        }
        50% {
          box-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
        }
      }

      @keyframes cursorBlink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useState } = React;

      const servers = [
        {
          id: 1,
          name: "Obsidian Relay",
          location: "Frankfurt",
          status: "Secure",
          load: "14%",
        },
        {
          id: 2,
          name: "Midnight Spine",
          location: "Singapore",
          status: "Encrypted",
          load: "61%",
        },
        {
          id: 3,
          name: "Nocturne Gate",
          location: "Toronto",
          status: "Shielded",
          load: "32%",
        },
        {
          id: 4,
          name: "Ghostline Hub",
          location: "São Paulo",
          status: "Hidden",
          load: "48%",
        },
      ];

      const profileIcons = [
        { id: "mask", label: "Hollow Mask", glyph: "🎭" },
        { id: "skull", label: "Skull Relay", glyph: "💀" },
        { id: "circuit", label: "Circuit Eye", glyph: "🧠" },
        { id: "lock", label: "Cipher Lock", glyph: "🔒" },
        { id: "ghost", label: "Ghost Signal", glyph: "👻" },
        { id: "owl", label: "Night Owl", glyph: "🦉" },
      ];

      const cityOptions = [
        { city: "New York", country: "USA", timeZone: "America/New_York" },
        { city: "Los Angeles", country: "USA", timeZone: "America/Los_Angeles" },
        { city: "Toronto", country: "Canada", timeZone: "America/Toronto" },
        { city: "Mexico City", country: "Mexico", timeZone: "America/Mexico_City" },
        { city: "São Paulo", country: "Brazil", timeZone: "America/Sao_Paulo" },
        { city: "Buenos Aires", country: "Argentina", timeZone: "America/Argentina/Buenos_Aires" },
        { city: "London", country: "United Kingdom", timeZone: "Europe/London" },
        { city: "Paris", country: "France", timeZone: "Europe/Paris" },
        { city: "Berlin", country: "Germany", timeZone: "Europe/Berlin" },
        { city: "Madrid", country: "Spain", timeZone: "Europe/Madrid" },
        { city: "Rome", country: "Italy", timeZone: "Europe/Rome" },
        { city: "Stockholm", country: "Sweden", timeZone: "Europe/Stockholm" },
        { city: "Warsaw", country: "Poland", timeZone: "Europe/Warsaw" },
        { city: "Moscow", country: "Russia", timeZone: "Europe/Moscow" },
        { city: "Istanbul", country: "Turkey", timeZone: "Europe/Istanbul" },
        { city: "Dubai", country: "UAE", timeZone: "Asia/Dubai" },
        { city: "Johannesburg", country: "South Africa", timeZone: "Africa/Johannesburg" },
        { city: "Lagos", country: "Nigeria", timeZone: "Africa/Lagos" },
        { city: "Nairobi", country: "Kenya", timeZone: "Africa/Nairobi" },
        { city: "Mumbai", country: "India", timeZone: "Asia/Kolkata" },
        { city: "Delhi", country: "India", timeZone: "Asia/Kolkata" },
        { city: "Beijing", country: "China", timeZone: "Asia/Shanghai" },
        { city: "Shanghai", country: "China", timeZone: "Asia/Shanghai" },
        { city: "Seoul", country: "South Korea", timeZone: "Asia/Seoul" },
        { city: "Tokyo", country: "Japan", timeZone: "Asia/Tokyo" },
        { city: "Sydney", country: "Australia", timeZone: "Australia/Sydney" },
        { city: "Melbourne", country: "Australia", timeZone: "Australia/Melbourne" },
        { city: "Auckland", country: "New Zealand", timeZone: "Pacific/Auckland" },
      ];

      const usernameSeeds = [
        "Void",
        "Cipher",
        "Specter",
        "Glitch",
        "Ghost",
        "Zero",
        "Rogue",
        "Null",
        "Pulse",
        "Signal",
      ];

      const usernameSuffixes = ["Walker", "Shade", "Node", "Runner", "Wire", "Crow"];

      const appModules = [
        { id: "bank", label: "DarkVault Bank", status: "Secure" },
        { id: "archives", label: "Shadow Archives", status: "Locked" },
        { id: "market", label: "Ghost Market", status: "Offline" },
        { id: "drops", label: "Dead Drops", status: "Standby" },
      ];

      const loadingLines = [
        "[boot] establishing encrypted tunnel...",
        "[auth] negotiating shadow certificates...",
        "[relay] proxy chain stabilized...",
        "[sync] mirroring dark indices...",
        "[access] access key verified...",
      ];

      const App = () => {
        const [screen, setScreen] = useState("landing");
        const [nextScreen, setNextScreen] = useState("servers");
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [loadingLineIndex, setLoadingLineIndex] = useState(0);
        const [selectedServer, setSelectedServer] = useState(null);
        const [isPremium, setIsPremium] = useState(false);
        const [profileIcon, setProfileIcon] = useState(profileIcons[0]);
        const [username, setUsername] = useState("");
        const [customUsername, setCustomUsername] = useState("");
        const [selectedCity, setSelectedCity] = useState(cityOptions[0]);
        const [profileStep, setProfileStep] = useState(1);
        const [systemTime, setSystemTime] = useState(new Date());
        const [appLoading, setAppLoading] = useState(false);
        const [activeApp, setActiveApp] = useState(null);
        const [bankAccount, setBankAccount] = useState(null);
        const [depositAmount, setDepositAmount] = useState("500");
        const [accountAlias, setAccountAlias] = useState("Main Vault");
        const [bootTimestamp] = useState(Date.now());

        useEffect(() => {
          setUsername(
            `${usernameSeeds[Math.floor(Math.random() * usernameSeeds.length)]}${
              usernameSuffixes[Math.floor(Math.random() * usernameSuffixes.length)]
            }${Math.floor(Math.random() * 900 + 100)}`
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => {
            setSystemTime(new Date());
          }, 1000);
          return () => clearInterval(interval);
        }, []);

        useEffect(() => {
          if (screen !== "loading") return;
          setLoadingProgress(0);
          setLoadingLineIndex(0);
          const interval = setInterval(() => {
            setLoadingProgress((prev) => {
              const nextValue = Math.min(prev + Math.floor(Math.random() * 14 + 6), 100);
              if (nextValue >= 100) {
                clearInterval(interval);
                setTimeout(() => setScreen(nextScreen), 500);
              }
              return nextValue;
            });
            setLoadingLineIndex((prev) => Math.min(prev + 1, loadingLines.length - 1));
          }, 450);

          return () => clearInterval(interval);
        }, [screen, nextScreen]);

        useEffect(() => {
          if (!appLoading) return;
          const timer = setTimeout(() => {
            setAppLoading(false);
          }, 650);
          return () => clearTimeout(timer);
        }, [appLoading]);

        const localTimeLabel = useMemo(() => {
          return new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            timeZone: selectedCity.timeZone,
          }).format(systemTime);
        }, [selectedCity, systemTime]);

        const systemTimeLabel = useMemo(() => {
          return systemTime.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }, [systemTime]);

        const inGameDay = useMemo(() => {
          const elapsed = Date.now() - bootTimestamp;
          const dayLength = 2 * 60 * 60 * 1000;
          return Math.floor(elapsed / dayLength) + 1;
        }, [bootTimestamp, systemTime]);

        const inGameProgress = useMemo(() => {
          const elapsed = Date.now() - bootTimestamp;
          const dayLength = 2 * 60 * 60 * 1000;
          return ((elapsed % dayLength) / dayLength) * 100;
        }, [bootTimestamp, systemTime]);

        const handleRollUsername = () => {
          const seed = usernameSeeds[Math.floor(Math.random() * usernameSeeds.length)];
          const suffix = usernameSuffixes[Math.floor(Math.random() * usernameSuffixes.length)];
          const digits = Math.floor(Math.random() * 900 + 100);
          setUsername(`${seed}${suffix}${digits}`);
        };

        const profileProgress = useMemo(() => {
          let progress = 0;
          if (profileIcon) progress += 34;
          if ((isPremium && customUsername.trim()) || username.trim()) progress += 33;
          if (selectedCity) progress += 33;
          return Math.min(progress, 100);
        }, [profileIcon, username, customUsername, selectedCity, isPremium]);

        const profileComplete = profileProgress === 100;
        const displayUsername = isPremium && customUsername.trim() ? customUsername : username;

        const handleOpenApp = (appId) => {
          setActiveApp(appId);
          setAppLoading(true);
        };

        const handleCreateBankAccount = () => {
          if (bankAccount) return;
          const amount = Number.parseFloat(depositAmount) || 0;
          setBankAccount({
            alias: accountAlias || "Primary Vault",
            balance: amount,
            id: `DV-${Math.floor(Math.random() * 900000 + 100000)}`,
          });
        };

        return (
          <main className="relative min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-black text-slate-100">
            <div className="absolute inset-0 scanlines opacity-60" />
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(14,116,144,0.25),_transparent_55%)]" />

            <div className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-8 px-6 py-10">
              <header className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <p className="text-xs uppercase tracking-[0.4em] text-cyan-400/60">
                    Into The Dark
                  </p>
                  <h1 className="text-2xl font-semibold text-cyan-100">Dark Web Simulation</h1>
                </div>
                {screen === "dashboard" && (
                  <div className="flex flex-wrap items-center gap-4 text-xs uppercase tracking-[0.3em]">
                    <div className="rounded-full border border-cyan-400/40 px-3 py-1 text-cyan-200">
                      {selectedServer?.name}
                    </div>
                    <div className="rounded-full border border-slate-700 px-3 py-1 text-slate-300">
                      {selectedCity.city}, {selectedCity.country}
                    </div>
                  </div>
                )}
              </header>

              {screen === "landing" && (
                <section className="relative overflow-hidden rounded-3xl border border-cyan-500/40 bg-black/80 p-10 shadow-2xl shadow-cyan-500/20">
                  <div className="terminal-flicker">
                    <p className="text-xs uppercase tracking-[0.4em] text-cyan-400/60">
                      darknet gateway
                    </p>
                    <h2 className="mt-4 text-3xl font-semibold text-cyan-100">
                      Terminal access granted
                    </h2>
                    <p className="mt-3 max-w-xl text-sm text-cyan-100/70">
                      Initialize your clandestine identity. Navigate encrypted networks, build accounts,
                      and operate from the shadows.
                    </p>
                  </div>
                  <div className="mt-8 rounded-2xl border border-cyan-400/20 bg-slate-950/70 p-5 text-xs text-cyan-200/80">
                    <p>root@shadowgrid:~$ access --portal dark.gateway</p>
                    <p className="mt-2">status: READY_FOR_SESSION</p>
                    <p className="mt-2">signal strength: 98%</p>
                    <div className="mt-3 flex items-center">
                      <span>awaiting command</span>
                      <span className="boot-cursor" />
                    </div>
                  </div>
                  <div className="mt-8">
                    <button
                      type="button"
                      onClick={() => setScreen("servers")}
                      className="glow-pulse w-full rounded-2xl border border-cyan-400/60 bg-cyan-500/20 px-6 py-4 text-sm font-semibold uppercase tracking-[0.4em] text-cyan-100 transition hover:border-cyan-300 hover:bg-cyan-400/30"
                    >
                      Start Enterprise
                    </button>
                  </div>
                </section>
              )}

              {screen === "servers" && (
                <section className="rounded-3xl border border-slate-700/60 bg-slate-950/80 p-8 shadow-2xl shadow-cyan-500/10">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <p className="text-xs uppercase tracking-[0.4em] text-cyan-400/60">
                        server browser
                      </p>
                      <h2 className="mt-2 text-2xl font-semibold text-cyan-100">Select a relay</h2>
                      <p className="text-sm text-slate-300">
                        Choose an enterprise node to begin your dark web session.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setScreen("landing")}
                      className="rounded-full border border-slate-700 px-4 py-2 text-xs uppercase tracking-[0.3em] text-slate-300 transition hover:border-cyan-300 hover:text-cyan-200"
                    >
                      Back
                    </button>
                  </div>
                  <div className="mt-6 grid gap-4 md:grid-cols-2">
                    {servers.map((server) => (
                      <button
                        key={server.id}
                        type="button"
                        onClick={() => {
                          setSelectedServer(server);
                          setNextScreen("profile");
                          setScreen("loading");
                        }}
                        className="group flex w-full flex-col gap-4 rounded-2xl border border-slate-700/70 bg-black/70 p-5 text-left transition hover:-translate-y-1 hover:border-cyan-300/70 hover:shadow-lg hover:shadow-cyan-500/20"
                      >
                        <div className="flex items-center justify-between">
                          <div>
                            <h3 className="text-lg font-semibold text-cyan-100 group-hover:text-cyan-200">
                              {server.name}
                            </h3>
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-500">
                              {server.location}
                            </p>
                          </div>
                          <span className="rounded-full border border-cyan-400/40 px-3 py-1 text-xs uppercase tracking-[0.3em] text-cyan-200">
                            {server.status}
                          </span>
                        </div>
                        <div className="flex items-center justify-between text-xs text-slate-400">
                          <span>Load</span>
                          <span>{server.load}</span>
                        </div>
                        <div className="h-2 w-full rounded-full bg-slate-800">
                          <div className="h-2 rounded-full bg-gradient-to-r from-cyan-400 via-cyan-300 to-sky-400" style={{ width: server.load }} />
                        </div>
                        <span className="text-xs uppercase tracking-[0.4em] text-cyan-300">
                          Connect →
                        </span>
                      </button>
                    ))}
                  </div>
                </section>
              )}

              {screen === "loading" && (
                <section className="rounded-3xl border border-cyan-500/30 bg-black/80 p-8 text-left shadow-2xl shadow-cyan-500/20">
                  <p className="text-xs uppercase tracking-[0.4em] text-cyan-400/70">boot sequence</p>
                  <h2 className="mt-3 text-2xl font-semibold text-cyan-100">
                    Establishing {selectedServer?.name || "relay"}
                  </h2>
                  <div className="mt-6 space-y-2 text-xs text-cyan-200/80">
                    {loadingLines.slice(0, loadingLineIndex + 1).map((line, index) => (
                      <p key={index}>{line}</p>
                    ))}
                  </div>
                  <div className="mt-6">
                    <div className="flex items-center justify-between text-xs uppercase tracking-[0.3em] text-slate-400">
                      <span>Loading</span>
                      <span>{loadingProgress}%</span>
                    </div>
                    <div className="mt-3 h-3 w-full rounded-full bg-slate-800">
                      <div
                        className="h-3 rounded-full bg-gradient-to-r from-cyan-400 via-cyan-300 to-sky-400 transition-all"
                        style={{ width: `${loadingProgress}%` }}
                      />
                    </div>
                    <p className="mt-3 text-xs text-cyan-200/70">
                      Keep this channel open until handshake completes.
                    </p>
                  </div>
                  {loadingProgress >= 100 && (
                    <div className="mt-6 text-xs uppercase tracking-[0.3em] text-cyan-300">
                      Access granted.
                    </div>
                  )}
                  {loadingProgress >= 100 && (
                    <button
                      type="button"
                      onClick={() => setScreen("profile")}
                      className="mt-6 w-full rounded-2xl border border-cyan-400/50 bg-cyan-500/20 px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] text-cyan-100 transition hover:border-cyan-300 hover:bg-cyan-400/30"
                    >
                      Proceed to Profile
                    </button>
                  )}
                </section>
              )}

              {screen === "profile" && (
                <section className="rounded-3xl border border-slate-700/60 bg-slate-950/80 p-8 shadow-2xl shadow-cyan-500/10">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <p className="text-xs uppercase tracking-[0.4em] text-cyan-400/70">
                        identity forge
                      </p>
                      <h2 className="mt-2 text-2xl font-semibold text-cyan-100">Build your profile</h2>
                      <p className="text-sm text-slate-300">
                        Choose a profile signature, claim a handle, and select your operating city.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setScreen("servers")}
                      className="rounded-full border border-slate-700 px-4 py-2 text-xs uppercase tracking-[0.3em] text-slate-300 transition hover:border-cyan-300 hover:text-cyan-200"
                    >
                      Back
                    </button>
                  </div>

                  <div className="mt-6 rounded-2xl border border-slate-700/70 bg-black/60 px-4 py-3">
                    <div className="flex items-center justify-between text-xs uppercase tracking-[0.3em] text-slate-400">
                      <span>Profile completion</span>
                      <span>{profileProgress}%</span>
                    </div>
                    <div className="mt-2 h-2 w-full rounded-full bg-slate-800">
                      <div
                        className="h-2 rounded-full bg-gradient-to-r from-cyan-400 via-cyan-300 to-sky-400 transition-all"
                        style={{ width: `${profileProgress}%` }}
                      />
                    </div>
                  </div>

                  <div className="mt-8 grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
                    <div className="space-y-6">
                      {profileStep === 1 && (
                        <div className="rounded-2xl border border-slate-700/70 bg-black/60 p-5">
                          <div className="flex items-center justify-between">
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                              Step 1 · Profile icon
                            </p>
                            <button
                              type="button"
                              onClick={() => setProfileStep(2)}
                              className="rounded-full border border-slate-700 px-3 py-1 text-[10px] uppercase tracking-[0.3em] text-slate-400"
                            >
                              Next →
                            </button>
                          </div>
                          <div className="mt-4 grid gap-3 sm:grid-cols-3">
                            {profileIcons.map((icon) => (
                              <button
                                key={icon.id}
                                type="button"
                                onClick={() => setProfileIcon(icon)}
                                className={`rounded-2xl border px-4 py-4 text-left text-sm transition ${
                                  profileIcon?.id === icon.id
                                    ? "border-cyan-300 bg-cyan-500/10 text-cyan-100"
                                    : "border-slate-700/70 text-slate-300 hover:border-cyan-400/70"
                                }`}
                              >
                                <div className="text-2xl">{icon.glyph}</div>
                                <p className="mt-2 text-xs uppercase tracking-[0.3em] text-slate-400">
                                  {icon.label}
                                </p>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {profileStep === 2 && (
                        <div className="rounded-2xl border border-slate-700/70 bg-black/60 p-5">
                          <div className="flex items-center justify-between">
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                              Step 2 · Handle
                            </p>
                            <div className="flex gap-2">
                              <button
                                type="button"
                                onClick={() => setProfileStep(1)}
                                className="rounded-full border border-slate-700 px-3 py-1 text-[10px] uppercase tracking-[0.3em] text-slate-400"
                              >
                                ← Back
                              </button>
                              <button
                                type="button"
                                onClick={() => setProfileStep(3)}
                                className="rounded-full border border-slate-700 px-3 py-1 text-[10px] uppercase tracking-[0.3em] text-slate-400"
                              >
                                Next →
                              </button>
                            </div>
                          </div>

                          <div className="mt-4 space-y-4">
                            <div className="rounded-2xl border border-slate-700/70 bg-slate-950/70 p-4">
                              <div className="flex items-center justify-between">
                                <div>
                                  <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                    Generated handle
                                  </p>
                                  <p className="mt-2 text-lg font-semibold text-cyan-100">
                                    {username || "--"}
                                  </p>
                                </div>
                                <button
                                  type="button"
                                  onClick={handleRollUsername}
                                  className="rounded-xl border border-cyan-300/60 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-cyan-200 transition hover:border-cyan-200 hover:text-cyan-100"
                                >
                                  Roll Handle
                                </button>
                              </div>
                            </div>
                            <div className="rounded-2xl border border-slate-700/70 bg-slate-950/70 p-4">
                              <div className="flex items-center justify-between gap-3">
                                <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                  Custom handle
                                </p>
                                <button
                                  type="button"
                                  onClick={() => setIsPremium((prev) => !prev)}
                                  className={`rounded-full border px-3 py-1 text-[10px] uppercase tracking-[0.3em] transition ${
                                    isPremium
                                      ? "border-cyan-300 text-cyan-200"
                                      : "border-slate-700 text-slate-400"
                                  }`}
                                >
                                  {isPremium ? "Premium Enabled" : "Unlock Premium"}
                                </button>
                              </div>
                              {isPremium ? (
                                <input
                                  type="text"
                                  value={customUsername}
                                  onChange={(event) => setCustomUsername(event.target.value)}
                                  placeholder="Enter custom handle"
                                  className="mt-3 w-full rounded-xl border border-slate-700 bg-black/70 px-4 py-3 text-sm text-slate-100 focus:border-cyan-300 focus:outline-none"
                                />
                              ) : (
                                <div className="mt-3 rounded-xl border border-dashed border-slate-700/70 px-4 py-3 text-xs uppercase tracking-[0.3em] text-slate-500">
                                  Premium required for custom handle
                                </div>
                              )}
                            </div>
                          </div>
                        </div>
                      )}

                      {profileStep === 3 && (
                        <div className="rounded-2xl border border-slate-700/70 bg-black/60 p-5">
                          <div className="flex items-center justify-between">
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                              Step 3 · Operating city
                            </p>
                            <button
                              type="button"
                              onClick={() => setProfileStep(2)}
                              className="rounded-full border border-slate-700 px-3 py-1 text-[10px] uppercase tracking-[0.3em] text-slate-400"
                            >
                              ← Back
                            </button>
                          </div>
                          <div className="mt-4 grid max-h-64 gap-3 overflow-y-auto pr-2 sm:grid-cols-2">
                            {cityOptions.map((city) => (
                              <button
                                key={`${city.city}-${city.country}`}
                                type="button"
                                onClick={() => setSelectedCity(city)}
                                className={`rounded-2xl border px-4 py-3 text-left text-sm transition ${
                                  selectedCity.city === city.city
                                    ? "border-cyan-300 bg-cyan-500/10 text-cyan-100"
                                    : "border-slate-700/70 text-slate-300 hover:border-cyan-400/70"
                                }`}
                              >
                                <p className="text-sm font-semibold">{city.city}</p>
                                <p className="text-xs text-slate-400">{city.country}</p>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="flex flex-col justify-between gap-6 rounded-2xl border border-slate-700/70 bg-black/60 p-6">
                      <div className="space-y-3">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Profile summary</p>
                        <div className="flex items-center gap-3">
                          <div className="flex h-12 w-12 items-center justify-center rounded-full border border-cyan-400/40 bg-slate-950/70 text-2xl">
                            {profileIcon?.glyph}
                          </div>
                          <div>
                            <p className="text-base font-semibold text-cyan-100">
                              {displayUsername || "Handle pending"}
                            </p>
                            <p className="text-xs text-slate-400">{selectedCity.city}</p>
                          </div>
                        </div>
                        <div className="rounded-2xl border border-slate-700/70 bg-slate-950/70 p-4 text-xs text-slate-300">
                          <p>• Identity concealment enabled.</p>
                          <p>• Default wallet seeded in USD.</p>
                          <p>• Access limited to Tier-1 apps.</p>
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          if (!profileComplete) return;
                          setScreen("dashboard");
                        }}
                        disabled={!profileComplete}
                        className={`w-full rounded-xl px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                          profileComplete
                            ? "bg-cyan-500/30 text-cyan-100 hover:bg-cyan-400/40"
                            : "cursor-not-allowed bg-slate-800 text-slate-500"
                        }`}
                      >
                        Enter The Dark
                      </button>
                    </div>
                  </div>
                </section>
              )}

              {screen === "dashboard" && (
                <section className="rounded-3xl border border-slate-700/60 bg-slate-950/80 p-6 shadow-2xl shadow-cyan-500/10">
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-700/60 pb-4">
                    <div className="flex items-center gap-4">
                      <div className="flex h-12 w-12 items-center justify-center rounded-full border border-cyan-400/40 bg-slate-950/70 text-2xl">
                        {profileIcon?.glyph}
                      </div>
                      <div>
                        <p className="text-lg font-semibold text-cyan-100">
                          {displayUsername || "Anonymous"}
                        </p>
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                          {selectedCity.city} · {selectedCity.country}
                        </p>
                      </div>
                    </div>
                    <div className="flex flex-wrap items-center gap-4 text-xs uppercase tracking-[0.3em]">
                      <div className="rounded-xl border border-slate-700 bg-black/60 px-3 py-2">
                        <p className="text-[10px] text-slate-400">System</p>
                        <p className="text-cyan-100">{systemTimeLabel}</p>
                      </div>
                      <div className="rounded-xl border border-cyan-400/40 bg-black/60 px-3 py-2">
                        <p className="text-[10px] text-slate-400">City Time</p>
                        <p className="text-cyan-100">{localTimeLabel}</p>
                      </div>
                      <div className="rounded-xl border border-slate-700 bg-black/60 px-3 py-2">
                        <p className="text-[10px] text-slate-400">Cycle Day</p>
                        <p className="text-cyan-100">{inGameDay}</p>
                        <div className="mt-2 h-1.5 w-24 rounded-full bg-slate-800">
                          <div
                            className="h-1.5 rounded-full bg-gradient-to-r from-cyan-400 via-cyan-300 to-sky-400"
                            style={{ width: `${inGameProgress}%` }}
                          />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="mt-6 grid gap-6 lg:grid-cols-[0.65fr_1fr]">
                    <div className="rounded-2xl border border-slate-700/70 bg-black/60 p-5">
                      <p className="text-xs uppercase tracking-[0.3em] text-cyan-400/70">Applications</p>
                      <div className="mt-4 space-y-3">
                        {appModules.map((app) => (
                          <button
                            key={app.id}
                            type="button"
                            onClick={() => handleOpenApp(app.id)}
                            className="flex w-full items-center justify-between rounded-2xl border border-slate-700/70 bg-slate-950/70 px-4 py-3 text-left text-sm text-slate-200 transition hover:border-cyan-400/70"
                          >
                            <span>{app.label}</span>
                            <span className="text-xs uppercase tracking-[0.3em] text-slate-500">
                              {app.status}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="rounded-2xl border border-slate-700/70 bg-black/60 p-5">
                      <p className="text-xs uppercase tracking-[0.3em] text-cyan-400/70">System feed</p>
                      <div className="mt-4 space-y-3 text-sm text-slate-300">
                        <p>• DarkVault routing table synced.</p>
                        <p>• Shadow Archives encryption key pending.</p>
                        <p>• Ghost Market indexers asleep.</p>
                        <p>• Dead Drop courier scheduled for 02:00.</p>
                      </div>
                    </div>
                  </div>

                  <div
                    className={`panel-overlay fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 px-4 py-8 ${
                      activeApp ? "is-open" : ""
                    }`}
                  >
                    {activeApp && (
                      <div className="w-full max-w-3xl rounded-3xl border border-cyan-400/30 bg-slate-950 p-6 shadow-2xl shadow-cyan-500/20">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-xs uppercase tracking-[0.3em] text-cyan-400/70">
                              {activeApp === "bank" && "DarkVault Bank"}
                              {activeApp === "archives" && "Shadow Archives"}
                              {activeApp === "market" && "Ghost Market"}
                              {activeApp === "drops" && "Dead Drops"}
                            </p>
                            <p className="text-sm text-slate-300">
                              {activeApp === "bank" && "Manage your encrypted vault accounts."}
                              {activeApp === "archives" && "Classified intel archive (locked)."}
                              {activeApp === "market" && "Black market listings (offline)."}
                              {activeApp === "drops" && "Courier relay scheduling (standby)."}
                            </p>
                          </div>
                          <button
                            type="button"
                            onClick={() => setActiveApp(null)}
                            className="rounded-full border border-slate-700 px-3 py-1 text-xs uppercase tracking-[0.3em] text-slate-300"
                          >
                            Close
                          </button>
                        </div>

                        {appLoading && (
                          <div className="mt-6 rounded-2xl border border-cyan-400/20 bg-black/80 p-4 text-xs text-cyan-200/80">
                            <p>loading modules...</p>
                            <div className="mt-3 h-2 w-full rounded-full bg-slate-800">
                              <div className="h-2 w-2/3 rounded-full bg-gradient-to-r from-cyan-400 via-cyan-300 to-sky-400" />
                            </div>
                          </div>
                        )}

                        {!appLoading && activeApp === "bank" && (
                          <div className="mt-6 space-y-4">
                            <div className="rounded-2xl border border-slate-700/70 bg-black/70 p-4 text-sm text-slate-300">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Vault status
                              </p>
                              {bankAccount ? (
                                <div className="mt-3 space-y-2">
                                  <p className="text-lg font-semibold text-cyan-100">
                                    {bankAccount.alias}
                                  </p>
                                  <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                    Account ID: {bankAccount.id}
                                  </p>
                                  <p className="text-sm text-slate-300">
                                    Balance: ${bankAccount.balance.toFixed(2)} USD
                                  </p>
                                </div>
                              ) : (
                                <p className="mt-3 text-sm text-slate-400">
                                  No vault created. Initialize your first account below.
                                </p>
                              )}
                            </div>

                            <div className="rounded-2xl border border-slate-700/70 bg-black/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Create account
                              </p>
                              <div className="mt-3 grid gap-3 sm:grid-cols-2">
                                <input
                                  type="text"
                                  value={accountAlias}
                                  onChange={(event) => setAccountAlias(event.target.value)}
                                  placeholder="Account alias"
                                  disabled={!!bankAccount}
                                  className="w-full rounded-xl border border-slate-700 bg-black/70 px-4 py-3 text-sm text-slate-100 focus:border-cyan-300 focus:outline-none disabled:cursor-not-allowed disabled:text-slate-500"
                                />
                                <input
                                  type="number"
                                  value={depositAmount}
                                  onChange={(event) => setDepositAmount(event.target.value)}
                                  placeholder="Initial deposit"
                                  disabled={!!bankAccount}
                                  className="w-full rounded-xl border border-slate-700 bg-black/70 px-4 py-3 text-sm text-slate-100 focus:border-cyan-300 focus:outline-none disabled:cursor-not-allowed disabled:text-slate-500"
                                />
                              </div>
                              <button
                                type="button"
                                onClick={handleCreateBankAccount}
                                disabled={!!bankAccount}
                                className={`mt-4 w-full rounded-xl px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                                  bankAccount
                                    ? "cursor-not-allowed bg-slate-800 text-slate-500"
                                    : "bg-cyan-500/30 text-cyan-100 hover:bg-cyan-400/40"
                                }`}
                              >
                                {bankAccount ? "Account Active" : "Create Vault"}
                              </button>
                            </div>
                          </div>
                        )}

                        {!appLoading && activeApp !== "bank" && (
                          <div className="mt-6 rounded-2xl border border-slate-700/70 bg-black/70 p-6 text-sm text-slate-300">
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Status</p>
                            <p className="mt-2">
                              This module is not available yet. Maintain access level or wait for the next
                              network update.
                            </p>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </section>
              )}
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
