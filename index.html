<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>An Iron Reign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Cinzel", "Trajan Pro", "Garamond", "Times New Roman", serif;
      }

      .ember-glow {
        background: radial-gradient(circle at center, rgba(250, 204, 21, 0.5), transparent 60%);
        filter: blur(0.5rem);
        animation: emberPulse 2.8s ease-in-out infinite;
      }

      .mist-layer {
        background: linear-gradient(120deg, rgba(15, 23, 42, 0.85), rgba(30, 41, 59, 0.55));
        animation: mistDrift 18s ease-in-out infinite alternate;
      }

      .loading-ring {
        border: 2px solid rgba(148, 163, 184, 0.4);
        border-top-color: rgba(248, 113, 113, 0.9);
        animation: spin 1.2s linear infinite;
      }

      .stat-glow {
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.25);
      }

      .shop-overlay {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease;
      }

      .shop-overlay.is-open {
        opacity: 1;
        visibility: visible;
      }

      @keyframes emberPulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.15);
        }
      }

      @keyframes mistDrift {
        0% {
          transform: translateX(-3%);
        }
        100% {
          transform: translateX(3%);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 100% 50%;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const servers = [
        {
          id: 1,
          name: "Test Realm — Winterfell",
          status: "Stable",
          players: "42/120",
          region: "The North",
          tag: "Roleplay",
        },
        {
          id: 2,
          name: "Stormwatch — Dragonstone",
          status: "High Traffic",
          players: "96/120",
          region: "Crownlands",
          tag: "Hardcore",
        },
        {
          id: 3,
          name: "Golden Spires — Oldtown",
          status: "New",
          players: "12/90",
          region: "The Reach",
          tag: "Narrative",
        },
      ];

      const baseStats = [
        { key: "combat", label: "Combat", value: 5 },
        { key: "intrigue", label: "Intrigue", value: 5 },
        { key: "knowledge", label: "Knowledge", value: 5 },
        { key: "stewardship", label: "Stewardship", value: 5 },
      ];

      const skinTones = [
        { name: "Pale", filter: "brightness(1.2) saturate(0.85)" },
        { name: "Fair", filter: "brightness(1.05) saturate(0.95)" },
        { name: "Tan", filter: "brightness(0.95) sepia(0.2) saturate(1.1)" },
        { name: "Olive", filter: "brightness(0.85) sepia(0.35) saturate(1.15)" },
        { name: "Brown", filter: "brightness(0.7) sepia(0.45) saturate(1.2)" },
        { name: "Deep", filter: "brightness(0.55) sepia(0.55) saturate(1.25)" },
      ];

      const firstNameSets = [
        {
          label: "Northern",
          names: {
            female: ["Arya", "Lyanna", "Sansa", "Wylla", "Mira", "Alys"],
            male: ["Bran", "Eddard", "Rickon", "Theon", "Jorah", "Benjen"],
          },
        },
        {
          label: "Riverlands",
          names: {
            female: ["Ellyn", "Marra", "Roslin", "Tansy", "Marya", "Betha"],
            male: ["Hoster", "Walder", "Edmure", "Brynden", "Lyman", "Tytos"],
          },
        },
        {
          label: "Crownlands",
          names: {
            female: ["Alys", "Rhae", "Shiera", "Visenya", "Elaena", "Rhaella"],
            male: ["Aemon", "Baelor", "Davos", "Maekar", "Vaemond", "Gwayne"],
          },
        },
        {
          label: "Dorne",
          names: {
            female: ["Arianne", "Nym", "Sarella", "Ysand", "Nymeria", "Aliandra"],
            male: ["Edric", "Oberon", "Torrhen", "Quentyn", "Anders", "Qoren"],
          },
        },
      ];

      const lastNameSets = [
        {
          label: "Northern",
          names: ["Cassel", "Glover", "Hornwood", "Mormont", "Reed", "Tallhart"],
        },
        {
          label: "Riverlands",
          names: ["Brax", "Darry", "Mallister", "Piper", "Smallwood", "Vance"],
        },
        {
          label: "Crownlands",
          names: ["Celtigar", "Massey", "Rosby", "Staunton", "Wendwater", "Wyk"],
        },
        {
          label: "Dorne",
          names: ["Dayne", "Fowler", "Jordayne", "Santagar", "Uller", "Yronwood"],
        },
      ];

      const travelLocations = [
        {
          name: "Winterfell",
          type: "Keep",
          rooms: ["Great Hall", "Godswood", "Training Yard"],
        },
        {
          name: "King's Landing",
          type: "Capital",
          rooms: ["Red Keep", "Flea Bottom", "Small Council"],
        },
        {
          name: "Dragonstone",
          type: "Keep",
          rooms: ["Dragonmont", "War Room", "Harbor"],
        },
        {
          name: "Casterly Rock",
          type: "Keep",
          rooms: ["Lion's Gate", "Gold Vaults", "Sea Balcony"],
        },
        {
          name: "Highgarden",
          type: "Keep",
          rooms: ["Rose Courtyard", "Greenhouse", "Banquet Hall"],
        },
        {
          name: "Sunspear",
          type: "Keep",
          rooms: ["Water Gardens", "Sandstone Court", "Sun Court"],
        },
        {
          name: "Riverrun",
          type: "Keep",
          rooms: ["River Gate", "War Council", "Courtyard"],
        },
        {
          name: "The Eyrie",
          type: "Keep",
          rooms: ["Moon Door", "Sky Hall", "Falcon's Perch"],
        },
        {
          name: "Pyke",
          type: "Keep",
          rooms: ["Great Keep", "Sea Towers", "Iron Harbor"],
        },
        {
          name: "Oldtown",
          type: "City",
          rooms: ["Citadel", "Starry Sept", "Wharf"],
        },
        {
          name: "Storm's End",
          type: "Keep",
          rooms: ["Storm Hall", "Battlements", "Sea Gate"],
        },
        {
          name: "White Harbor",
          type: "Village",
          rooms: ["Fish Market", "Harborfront", "Wolf's Den"],
        },
        {
          name: "Maidenpool",
          type: "Village",
          rooms: ["Pink Maid Inn", "Docks", "Market Square"],
        },
        {
          name: "Mole's Town",
          type: "Village",
          rooms: ["Tavern", "Market Stalls", "Roadside"],
        },
      ];

      const directMessages = ["Raven Keeper", "House Steward", "Traveling Bard", "Silent Sister"];

      const supabaseUrl =
        window.SUPABASE_URL || window.__ENV__?.SUPABASE_URL || window.ENV?.SUPABASE_URL;
      const supabaseKey =
        window.SUPABASE_PUBLISHABLE_KEY ||
        window.__ENV__?.SUPABASE_PUBLISHABLE_KEY ||
        window.ENV?.SUPABASE_PUBLISHABLE_KEY;
      const supabaseClient =
        window.supabase && supabaseUrl && supabaseKey
          ? window.supabase.createClient(supabaseUrl, supabaseKey)
          : null;

      const App = () => {
        const [screen, setScreen] = useState("landing");
        const [nextScreen, setNextScreen] = useState("game");
        const [selectedServer, setSelectedServer] = useState(null);
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [characterFirstName, setCharacterFirstName] = useState("");
        const [characterLastName, setCharacterLastName] = useState("");
        const [activeNameSet, setActiveNameSet] = useState(firstNameSets[0]);
        const [characterHouse, setCharacterHouse] = useState("Traveler");
        const [characterRole] = useState("Wandering Traveler");
        const [characterGender, setCharacterGender] = useState(null);
        const [skinTone, setSkinTone] = useState(skinTones[1]);
        const [hasPremium, setHasPremium] = useState(false);
        const [goldCoins, setGoldCoins] = useState(120);
        const [stats, setStats] = useState(baseStats);
        const [pointsAvailable, setPointsAvailable] = useState(6);
        const detailsRef = useRef(null);
        const [showShop, setShowShop] = useState(false);
        const [authUser, setAuthUser] = useState(null);
        const [currentLocation, setCurrentLocation] = useState(travelLocations[0]);
        const [activeRoom, setActiveRoom] = useState(travelLocations[0].rooms[0]);
        const [gameTab, setGameTab] = useState("life");

        useEffect(() => {
          if (screen !== "loading") return;
          setLoadingProgress(0);
          const interval = setInterval(() => {
            setLoadingProgress((prev) => {
              const nextValue = Math.min(prev + Math.floor(Math.random() * 12 + 6), 100);
              if (nextValue >= 100) {
                clearInterval(interval);
                setTimeout(() => setScreen(nextScreen), 500);
              }
              return nextValue;
            });
          }, 350);

          return () => clearInterval(interval);
        }, [screen, nextScreen]);

        useEffect(() => {
          if (!supabaseClient) return;
          supabaseClient.auth.getUser().then(({ data }) => {
            setAuthUser(data?.user ?? null);
          });
          const { data: authListener } = supabaseClient.auth.onAuthStateChange(
            (_event, session) => {
              setAuthUser(session?.user ?? null);
            }
          );

          return () => {
            authListener?.subscription?.unsubscribe();
          };
        }, []);

        const immersionLines = useMemo(
          () => [
            "Swearing fealty to the realm...",
            "Saddling your warhorse...",
            "Summoning ravens across Westeros...",
            "Sharpening steel and sealing vows...",
          ],
          []
        );

        const progressMessage = useMemo(() => {
          const index = Math.floor((loadingProgress / 100) * immersionLines.length);
          return immersionLines[Math.min(index, immersionLines.length - 1)];
        }, [loadingProgress, immersionLines]);

        const householdLabel =
          characterHouse === "Traveler" ? "Traveler" : `House ${characterHouse}`;

        const totalStatValue = stats.reduce((sum, stat) => sum + stat.value, 0);
        const characterProgress = useMemo(() => {
          let progress = 0;
          if (characterGender) progress += 34;
          if (characterGender && skinTone) progress += 33;
          if (characterFirstName.trim() && characterLastName.trim()) progress += 33;
          return Math.min(progress, 100);
        }, [characterGender, skinTone, characterFirstName, characterLastName]);

        const genderImage = characterGender
          ? characterGender === "Female"
            ? "https://i.imgur.com/5dSdv1p.png"
            : "https://i.imgur.com/MQiTPfC.png"
          : null;
        const fullName =
          characterFirstName && characterLastName
            ? `${characterFirstName} ${characterLastName}`
            : "Unnamed Traveler";

        const handleGenderSelect = (gender) => {
          setCharacterGender(gender);
          requestAnimationFrame(() => {
            detailsRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
        };

        const handleNameSetChange = (label) => {
          const nextSet = firstNameSets.find((set) => set.label === label);
          if (nextSet) {
            setActiveNameSet(nextSet);
          }
        };

        const handleRollName = () => {
          const genderKey = characterGender === "Female" ? "female" : "male";
          const firstNames =
            activeNameSet.names?.[genderKey] || activeNameSet.names?.male || [];
          const lastNames =
            lastNameSets.find((set) => set.label === activeNameSet.label)?.names ||
            lastNameSets[0].names;
          const firstName = firstNames.length
            ? firstNames[Math.floor(Math.random() * firstNames.length)]
            : "Traveler";
          const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
          setCharacterFirstName(firstName);
          setCharacterLastName(lastName);
        };

        const handleAllocatePoint = (key) => {
          if (pointsAvailable <= 0) return;
          setStats((prev) =>
            prev.map((stat) =>
              stat.key === key ? { ...stat, value: stat.value + 1 } : stat
            )
          );
          setPointsAvailable((prev) => Math.max(prev - 1, 0));
        };

        const handleResetStats = () => {
          setStats(baseStats);
          setPointsAvailable(6);
        };

        const handleDiscordLogin = async () => {
          if (!supabaseClient) {
            return;
          }
          await supabaseClient.auth.signInWithOAuth({
            provider: "discord",
            options: { redirectTo: window.location.href },
          });
        };

        const handleLogout = async () => {
          if (!supabaseClient) return;
          await supabaseClient.auth.signOut();
        };

        return (
          <main className="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800">
            <div className="absolute inset-0 mist-layer opacity-80" />
            <div className="absolute inset-0">
              <div className="absolute -left-10 top-20 h-64 w-64 rounded-full ember-glow" />
              <div className="absolute right-10 top-24 h-72 w-72 rounded-full ember-glow" />
              <div className="absolute bottom-10 left-1/2 h-80 w-80 -translate-x-1/2 rounded-full ember-glow" />
            </div>

            <div className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col justify-center gap-10 px-5 py-10 sm:px-6">
              <nav className="flex flex-wrap items-center justify-between gap-4 rounded-2xl border border-slate-700/60 bg-slate-900/60 px-4 py-3">
                <div className="flex items-center gap-3">
                  <div className="h-12 w-12 overflow-hidden rounded-full border border-amber-300/40 bg-slate-950/70">
                    <img
                      src="https://i.imgur.com/8Pi0tUO.png"
                      alt="An Iron Reign logo"
                      className="h-full w-full object-cover"
                      onError={(event) => {
                        event.currentTarget.style.display = "none";
                      }}
                    />
                  </div>
                  <div>
                    <p className="text-xs uppercase tracking-[0.4em] text-slate-400">An Iron Reign</p>
                    <p className="text-sm text-amber-100">Realm Access</p>
                  </div>
                </div>
                <div className="flex flex-wrap items-center gap-3 text-xs uppercase tracking-[0.3em]">
                  <button
                    type="button"
                    onClick={() => setShowShop(true)}
                    className="flex h-10 w-10 items-center justify-center rounded-full border border-amber-300/60 text-amber-200 transition hover:border-amber-200 hover:text-amber-100"
                    aria-label="Open shop"
                  >
                    🛒
                  </button>
                  {authUser ? (
                    <button
                      type="button"
                      onClick={handleLogout}
                      className="rounded-xl border border-amber-300/60 px-4 py-2 font-semibold text-amber-200 transition hover:border-amber-200 hover:text-amber-100"
                    >
                      Sign Out
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleDiscordLogin}
                      className="rounded-xl border border-amber-300/60 px-4 py-2 font-semibold text-amber-200 transition hover:border-amber-200 hover:text-amber-100"
                    >
                      Discord Login
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => setScreen("servers")}
                    className="rounded-xl border border-slate-700 px-4 py-2 font-semibold text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                  >
                    Realms
                  </button>
                </div>
              </nav>

              <div
                className={`shop-overlay fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 px-4 py-8 ${
                  showShop ? "is-open" : ""
                }`}
                aria-hidden={!showShop}
              >
                <section className="w-full max-w-4xl rounded-3xl border border-amber-300/30 bg-slate-950/95 p-6 shadow-2xl shadow-black/60">
                  <div className="flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <p className="text-xs uppercase tracking-[0.4em] text-slate-400">Realm Shop</p>
                      <h2 className="mt-2 text-2xl font-semibold text-amber-100">
                        Support the reign
                      </h2>
                      <p className="mt-2 text-sm text-slate-300">
                        Templates for premium one-time items and subscriptions. Test unlocking below.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setShowShop(false)}
                      className="rounded-xl border border-slate-700 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                    >
                      Close
                    </button>
                  </div>

                  <div className="mt-6 grid gap-4 lg:grid-cols-2">
                    <div className="rounded-2xl border border-slate-700/70 bg-slate-900/70 p-5">
                      <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                        One-time purchases
                      </p>
                      <div className="mt-4 space-y-3 text-sm text-slate-300">
                        <div className="flex items-center justify-between rounded-xl border border-slate-700/70 bg-slate-950/60 px-4 py-3">
                          <span>Founder Sigil Pack</span>
                          <span className="text-amber-200">120 coins</span>
                        </div>
                        <div className="flex items-center justify-between rounded-xl border border-slate-700/70 bg-slate-950/60 px-4 py-3">
                          <span>Banner Cosmetics</span>
                          <span className="text-amber-200">80 coins</span>
                        </div>
                        <div className="flex items-center justify-between rounded-xl border border-slate-700/70 bg-slate-950/60 px-4 py-3">
                          <span>Royal Mount Skin</span>
                          <span className="text-amber-200">150 coins</span>
                        </div>
                      </div>
                    </div>

                    <div className="rounded-2xl border border-amber-300/40 bg-slate-900/70 p-5">
                      <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                        Subscriptions
                      </p>
                      <div className="mt-4 space-y-3 text-sm text-slate-300">
                        <div className="rounded-xl border border-slate-700/70 bg-slate-950/60 px-4 py-3">
                          <p className="text-amber-100">Realm Pass</p>
                          <p className="text-xs text-slate-400">
                            Unlock custom names, exclusive halls, and weekly bonuses.
                          </p>
                        </div>
                        <button
                          type="button"
                          onClick={() => setHasPremium(true)}
                          className="w-full rounded-xl bg-amber-400 px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] text-slate-900 transition hover:bg-amber-300"
                        >
                          Test Subscription Unlock
                        </button>
                        {hasPremium && (
                          <p className="text-xs uppercase tracking-[0.3em] text-amber-200">
                            Premium active
                          </p>
                        )}
                      </div>
                    </div>
                  </div>
                </section>
              </div>

              <header className="space-y-4 text-center">
                <div className="mx-auto flex h-20 w-20 items-center justify-center rounded-full border border-amber-300/40 bg-slate-950/70">
                  <img
                    src="https://i.imgur.com/8Pi0tUO.png"
                    alt="An Iron Reign logo"
                    className="h-14 w-14 object-contain"
                    onError={(event) => {
                      event.currentTarget.style.display = "none";
                    }}
                  />
                </div>
                <p className="text-xs font-semibold uppercase tracking-[0.5em] text-amber-200/70">
                  Welcome to An Iron Reign
                </p>
                <p className="mx-auto max-w-xl text-sm text-slate-300">
                  A medieval fantasy RP experience inspired by Westeros.
                </p>
              </header>

              {!selectedServer && (
                <div className="flex justify-center">
                  <button
                    type="button"
                    onClick={() => setScreen("servers")}
                    className="w-full max-w-md rounded-2xl bg-amber-400 px-6 py-4 text-base font-semibold uppercase tracking-[0.3em] text-slate-900 shadow-xl shadow-amber-500/40 transition hover:scale-[1.02] hover:bg-amber-300"
                  >
                    Play Now
                  </button>
                </div>
              )}

              {screen === "landing" && (
                <section className="mx-auto w-full max-w-3xl rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 text-center shadow-2xl shadow-black/40">
                  <h2 className="text-2xl font-semibold text-amber-100">A living realm awaits</h2>
                  <p className="mt-3 text-sm text-slate-300">
                    Choose a realm, forge your traveler, and step into the stories of Westeros.
                  </p>
                  <div className="mt-6 grid gap-4 sm:grid-cols-3">
                    {["Choose a Realm", "Create a Character", "Enter the Realm"].map((step) => (
                      <div
                        key={step}
                        className="rounded-2xl border border-slate-700/70 bg-slate-950/60 px-4 py-4 text-xs uppercase tracking-[0.3em] text-slate-300"
                      >
                        {step}
                      </div>
                    ))}
                  </div>
                </section>
              )}

              {screen === "servers" && (
                <section className="rounded-3xl border border-slate-700/60 bg-slate-900/70 p-8 shadow-2xl shadow-black/40">
                  <div className="flex flex-wrap items-center justify-between gap-6">
                    <div>
                      <p className="text-xs font-semibold uppercase tracking-[0.4em] text-slate-400">
                        Server Browser
                      </p>
                      <h2 className="text-2xl font-semibold text-amber-100">Choose your realm</h2>
                      <p className="text-sm text-slate-300">
                        Select a test server to begin your roleplay journey.
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setScreen("landing")}
                      className="rounded-xl border border-slate-600 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                    >
                      Back
                    </button>
                  </div>

                  <div className="mt-6 grid gap-4 lg:grid-cols-3">
                    {servers.map((server) => (
                      <button
                        key={server.id}
                        type="button"
                        onClick={() => {
                          setSelectedServer(server);
                          setNextScreen("character");
                          setScreen("loading");
                        }}
                        className="group flex w-full flex-col gap-5 rounded-2xl border border-slate-700/80 bg-gradient-to-br from-slate-950/80 via-slate-950/60 to-slate-900/60 p-5 text-left transition hover:-translate-y-1 hover:border-amber-300/70 hover:shadow-lg hover:shadow-amber-500/20"
                      >
                        <div className="flex items-start justify-between gap-3">
                          <div>
                            <h3 className="text-lg font-semibold text-amber-100 group-hover:text-amber-200">
                              {server.name}
                            </h3>
                            <p className="text-xs uppercase tracking-[0.35em] text-slate-400">
                              {server.region}
                            </p>
                          </div>
                          <span className="rounded-full border border-amber-300/40 px-3 py-1 text-xs uppercase tracking-[0.3em] text-amber-200">
                            {server.tag}
                          </span>
                        </div>
                        <div className="flex items-center justify-between text-xs text-slate-300">
                          <span className="rounded-full bg-slate-800/80 px-3 py-1">
                            {server.status}
                          </span>
                          <span className="rounded-full bg-slate-800/80 px-3 py-1">
                            {server.players} online
                          </span>
                        </div>
                        <div className="h-2 w-full rounded-full bg-slate-800">
                          <div className="h-2 w-3/4 rounded-full bg-gradient-to-r from-amber-400 via-amber-300 to-rose-400" />
                        </div>
                        <span className="text-xs font-semibold uppercase tracking-[0.4em] text-amber-300">

                                      skinTone.name === tone.name

                                  <button
                                    key={set.label}

                                    onClick={() => handleNameSetChange(set.label)}
                                    className={`rounded-full border px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                                      activeNameSet.label === set.label
                                        ? "border-amber-300 text-amber-100"
                                        : "border-slate-700 text-slate-300 hover:border-amber-300/70"

                                <p className="mt-3 text-xs uppercase tracking-[0.3em] text-slate-500">
                                  {activeNameSet.label} name set
                                </p>
                                <div className="mt-4 rounded-xl border border-slate-700/70 bg-slate-950/60 p-3 text-xs text-slate-400">
                                  Custom names are locked behind a premium pass.
                                  <span className="ml-2 rounded-full border border-amber-300/40 px-2 py-0.5 text-[10px] uppercase tracking-[0.3em] text-amber-200">
                                    Premium
                                  </span>
                                </div>
                              </div>
                            </div>

                            <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4 text-sm text-slate-300">

                              </p>
                              {hasPremium ? (
                                <div className="mt-3 grid gap-3 sm:grid-cols-2">
                                  <input
                                    type="text"
                                    value={characterFirstName}
                                    onChange={(event) => setCharacterFirstName(event.target.value)}
                                    placeholder="First"
                                    className="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/30"
                                  />
                                  <input
                                    type="text"
                                    value={characterLastName}
                                    onChange={(event) => setCharacterLastName(event.target.value)}
                                    placeholder="Last"
                                    className="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/30"
                                  />
                                </div>
                              ) : (
                                <div className="mt-3 rounded-xl border border-dashed border-slate-700/70 px-4 py-3 text-xs uppercase tracking-[0.3em] text-slate-500">
                                  Unlock with Realm Pass
                                </div>
                              )}
                            </div>

                            <label className="space-y-2 text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">
                              Household
                              <select
                                value={characterHouse}
                                onChange={(event) => setCharacterHouse(event.target.value)}
                                className="w-full rounded-xl border border-slate-700 bg-slate-950/70 px-4 py-3 text-sm text-slate-100 focus:border-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-300/30"
                              >
                                <option>Traveler</option>
                                <option>Stark</option>
                                <option>Lannister</option>
                                <option>Targaryen</option>
                                <option>Tyrell</option>
                                <option>Martell</option>
                                <option>Greyjoy</option>
                              </select>
                            </label>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div className="flex flex-col justify-between gap-6 rounded-2xl border border-slate-700/70 bg-slate-950/60 p-6">

                          {characterGender || "Gender pending"}
                        </p>
                        <p className="text-xs text-slate-400">{characterRole}</p>
                        <p className="text-xs text-slate-400">{householdLabel}</p>
                        <div className="mt-4 space-y-2 text-sm text-slate-300">
                          <p>• Neutral reputation across all regions.</p>
                          <p>• Basic gear: cloak, dagger, travel rations.</p>
                          <p>• Free to pledge loyalty after arrival.</p>
                        </div>
                      </div>
                      <div className="rounded-2xl border border-slate-700/70 bg-slate-950/60 p-4 text-sm text-slate-300">

                        <p className="mt-2 text-base text-amber-100">

                        </p>

                        type="button"

                        }}
                        className="w-full rounded-xl bg-amber-400 px-4 py-3 text-sm font-semibold uppercase tracking-[0.3em] text-slate-900 shadow-lg shadow-amber-500/40 transition hover:bg-amber-300"

                  </p>
                  <h2 className="mt-3 text-3xl font-semibold text-amber-100">

                  <div className="mt-8 flex flex-col items-center justify-center gap-6 sm:flex-row">
                    <div className="loading-ring h-16 w-16 rounded-full" />

                        <span>Loading</span>
                        <span>{loadingProgress}%</span>
                      </div>

                          className="h-3 rounded-full bg-gradient-to-r from-rose-400 via-amber-400 to-amber-200 transition-all"
                          style={{ width: `${loadingProgress}%` }}
                        />

                        className="mt-4 h-2 rounded-full bg-[length:200%_200%] bg-gradient-to-r from-slate-900 via-slate-700 to-slate-900"

                        <p>• Your renown grows among the villagers nearby.</p>

                              ? "border-amber-300 text-amber-100"
                              : "border-slate-700 text-slate-300"
                          }`}
                        >
                          🏰 Travel
                        </button>
                        <button
                          type="button"
                          onClick={() => setGameTab("chat")}

                              : "border-slate-700 text-slate-300"

                          💬 Chats

                          type="button"
                          onClick={() => setGameTab("stats")}

                            gameTab === "stats"

                              : "border-slate-700 text-slate-300"

                                key={location.name}

                                    ? "border-amber-300/70 bg-amber-300/10 text-amber-100"
                                    : "border-slate-700/70 text-slate-300 hover:border-amber-300/70"
                                }`}
                              >
                                <p className="text-sm font-semibold normal-case">{location.name}</p>
                                <p className="text-[10px] text-slate-400">{location.type}</p>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}

                      {gameTab === "chat" && (
                        <div className="mt-4 space-y-4">
                          <div>
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-500">
                              📣 Public rooms · {currentLocation.name}

                            <div className="mt-3 space-y-2">
                              {currentLocation.rooms.map((room) => (
                                <button
                                  key={room}
                                  type="button"
                                  onClick={() => setActiveRoom(room)}
                                  className={`w-full rounded-xl border px-4 py-3 text-left text-sm transition ${
                                    activeRoom === room
                                      ? "border-amber-300/70 bg-amber-300/10 text-amber-100"
                                      : "border-slate-700/70 text-slate-300 hover:border-amber-300/70"
                                  }`}
                                >
                                  {room}
                                </button>
                              ))}
                            </div>
                          </div>
                          <div>
                            <p className="text-xs uppercase tracking-[0.3em] text-slate-500">
                              🕊️ Direct messages
                            </p>
                            <div className="mt-3 space-y-2">
                              {directMessages.map((contact) => (
                                <button
                                  key={contact}
                                  type="button"
                                  className="w-full rounded-xl border border-slate-700/70 px-4 py-3 text-left text-sm text-slate-300 transition hover:border-amber-300/70"
                                >
                                  {contact}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}

                      {gameTab === "stats" && (
                        <div className="mt-4 space-y-3">
                          <div className="flex items-center justify-between gap-3 text-xs uppercase tracking-[0.3em] text-slate-400">
                            <span>⚔️ Royal Attributes</span>
                            <span className="text-slate-300">{pointsAvailable} points</span>
                          </div>
                          {stats.map((stat) => (
                            <div
                              key={stat.key}
                              className="flex items-center justify-between gap-3 rounded-xl border border-slate-700/70 bg-slate-900/70 px-3 py-2"
                            >
                              <div>
                                <p className="text-sm text-amber-100">{stat.label}</p>
                                <p className="text-xs text-slate-400">Level {stat.value}</p>
                              </div>
                              <div className="flex items-center gap-2">
                                <div className="h-2 w-24 rounded-full bg-slate-800">
                                  <div
                                    className="h-2 rounded-full bg-gradient-to-r from-amber-300 via-amber-400 to-rose-300 transition-all"
                                    style={{ width: `${Math.min(stat.value * 8, 100)}%` }}
                                  />
                                </div>
                                <button
                                  type="button"
                                  onClick={() => handleAllocatePoint(stat.key)}
                                  disabled={pointsAvailable <= 0}
                                  className={`stat-glow h-8 w-8 rounded-full border text-sm font-semibold transition ${
                                    pointsAvailable <= 0
                                      ? "cursor-not-allowed border-slate-700 text-slate-600"
                                      : "border-amber-300/70 text-amber-200 hover:scale-105"
                                  }`}
                                >
                                  +
                                </button>
                              </div>
                            </div>
                          ))}
                          <div className="mt-4 flex items-center justify-between text-xs text-slate-400">
                            <span>Total: {totalStatValue} pts</span>
                            <button
                              type="button"
                              onClick={handleResetStats}
                              className="rounded-full border border-slate-700 px-3 py-1 uppercase tracking-[0.3em] transition hover:border-amber-300 hover:text-amber-200"
                            >
                              Reset
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 border-t border-slate-700/60 bg-slate-950/70 px-6 py-4 sm:grid-cols-4">
                    {["Character", "Travel", "Message", "Inventory"].map((item) => (
                      <button
                        key={item}
                        type="button"
                        className="rounded-2xl border border-slate-700/70 bg-slate-950/60 px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] text-slate-300 transition hover:border-amber-300 hover:text-amber-200"
                      >
                        {item}
                      </button>
                    ))}
                  </div>
                </section>
              )}
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
