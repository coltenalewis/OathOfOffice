 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // Name sets representing US cultural backgrounds
    const nameSets = {
      "General US": {
        male: ["James", "Robert", "John", "Michael", "David", "William", "Richard", "Joseph", "Thomas", "Christopher"],
        female: ["Mary", "Patricia", "Jennifer", "Linda", "Elizabeth", "Barbara", "Susan", "Jessica", "Sarah", "Karen"],
        surnames: ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis", "Rodriguez", "Martinez"]
      },
      "African American": {
        male: ["DeAndre", "Jamal", "Marcus", "Terrell", "Darius", "Isaiah", "Malik", "Xavier", "Andre", "Tyrone"],
        female: ["Aaliyah", "Destiny", "Diamond", "Ebony", "Imani", "Jasmine", "Keisha", "Latoya", "Tamika", "Zara"],
        surnames: ["Washington", "Jefferson", "Jackson", "Harris", "Robinson", "Williams", "Thompson", "Moore", "Taylor", "Anderson"]
      },
      "Hispanic American": {
        male: ["Carlos", "Jose", "Juan", "Luis", "Miguel", "Pedro", "Antonio", "Francisco", "Rafael", "Jorge"],
        female: ["Maria", "Carmen", "Rosa", "Ana", "Elena", "Isabel", "Sofia", "Lucia", "Gloria", "Teresa"],
        surnames: ["Garcia", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez", "Perez", "Sanchez", "Ramirez", "Torres"]
      },
      "Asian American": {
        male: ["David", "Daniel", "Kevin", "Ryan", "Andrew", "James", "Michael", "Steven", "Brian", "Jason"],
        female: ["Jennifer", "Michelle", "Jessica", "Emily", "Amy", "Lisa", "Angela", "Christina", "Sarah", "Stephanie"],
        surnames: ["Lee", "Kim", "Park", "Chen", "Wang", "Liu", "Nguyen", "Patel", "Singh", "Chang"]
      }
    };

    const usCities = [
      { name: "New York, NY", cost: 1.8, jobs: 1.4, education: 1.3, networking: 1.5, underground: 1.2 },
      { name: "Los Angeles, CA", cost: 1.6, jobs: 1.2, education: 1.1, networking: 1.3, underground: 1.4 },
      { name: "Chicago, IL", cost: 1.3, jobs: 1.1, education: 1.2, networking: 1.1, underground: 1.1 },
      { name: "Houston, TX", cost: 1.1, jobs: 1.3, education: 0.9, networking: 1.0, underground: 1.3 },
      { name: "Phoenix, AZ", cost: 1.0, jobs: 1.0, education: 0.8, networking: 0.9, underground: 1.2 },
      { name: "Philadelphia, PA", cost: 1.2, jobs: 1.0, education: 1.1, networking: 1.0, underground: 1.0 },
      { name: "San Antonio, TX", cost: 0.9, jobs: 0.9, education: 0.8, networking: 0.8, underground: 1.1 },
      { name: "San Diego, CA", cost: 1.5, jobs: 1.1, education: 1.0, networking: 1.1, underground: 0.9 },
      { name: "Dallas, TX", cost: 1.2, jobs: 1.2, education: 1.0, networking: 1.1, underground: 1.2 },
      { name: "Austin, TX", cost: 1.3, jobs: 1.3, education: 1.1, networking: 1.2, underground: 0.8 }
    ];

    const communityCollegeMajors = ["General Studies", "Business Admin", "Computer Science", "Nursing", "Automotive Tech", "Culinary Arts"];
    const publicUniversityMajors = ["Business", "Engineering", "Psychology", "Biology", "Communications", "Computer Science", "Economics", "Political Science", "Sociology", "Marketing"];
    const ivyLeagueMajors = ["Economics", "Political Science", "Law (Pre-Law)", "International Relations", "Finance", "Philosophy", "Government", "Public Policy", "Business Analytics", "Strategic Management"];

    const MS_PER_GAME_MINUTE = (5 * 60 * 1000) / (24 * 60); // 5 real minutes = 1 game day

    const App = () => {
      const [screen, setScreen] = useState("landing");
      const [bootTimestamp] = useState(Date.now());

      // Shop state
      const [hasSubscription, setHasSubscription] = useState(false);
      const [hasCustomNameUnlock, setHasCustomNameUnlock] = useState(false);
      const [hasIvyLeagueUnlock, setHasIvyLeagueUnlock] = useState(false);
      const [showShop, setShowShop] = useState(false);

      // Character creation
      const [charStep, setCharStep] = useState(1);
      const [selectedGender, setSelectedGender] = useState("");
      const [selectedNameSet, setSelectedNameSet] = useState("General US");
      const [generatedName, setGeneratedName] = useState("");
      const [customName, setCustomName] = useState("");
      const [selectedCity, setSelectedCity] = useState(null);
      const [enrollInCollege, setEnrollInCollege] = useState(false);
      const [collegeType, setCollegeType] = useState("");
      const [selectedMajor, setSelectedMajor] = useState("");

      // Core gameplay state
      const [activeTab, setActiveTab] = useState("finances");
      const [undergroundOpen, setUndergroundOpen] = useState(false);

      // Finances
      const [cashOnHand, setCashOnHand] = useState(500);
      const [debitAccounts, setDebitAccounts] = useState([
        { id: "d1", bank: "Chase", type: "Checking", balance: 1200, apr: 0 },
        { id: "d2", bank: "Bank of America", type: "Savings", balance: 3000, apr: 0.02 }
      ]);
      const [creditAccounts, setCreditAccounts] = useState([
        { id: "c1", bank: "Capital One", balance: 0, limit: 2000, apr: 0.1999 },
        { id: "c2", bank: "Discover", balance: 150, limit: 5000, apr: 0.1799 }
      ]);
      const [studentDebt, setStudentDebt] = useState(0);

      // Education & Career
      const [jobTitle, setJobTitle] = useState("Unemployed");
      const [monthlyIncome, setMonthlyIncome] = useState(0);
      const [educationProgress, setEducationProgress] = useState(0);

      // Social metrics
      const [reputation, setReputation] = useState(50);
      const [suspicion, setSuspicion] = useState(5);

      // Underground (full mechanics restored)
      const [inventory, setInventory] = useState({ Standard: 0, Premium: 0 });
      const [heat, setHeat] = useState(8);
      const [shipments, setShipments] = useState([]);
      const [contracts, setContracts] = useState([]);
      const [messages, setMessages] = useState({});
      const [messageInput, setMessageInput] = useState("");
      const [messageCounts, setMessageCounts] = useState({});
      const [personalDeliveryActive, setPersonalDeliveryActive] = useState(false);

      // Supply draft state
      const [supplyDraft, setSupplyDraft] = useState({
        city: "New York",
        tier: "Standard",
        quantity: 30,
        accountId: "d1",
        deliveryMethod: "Courier"
      });

      // Broker selection
      const brokers = useMemo(() => [
        {
          id: "broker-onyx",
          name: "Broker 01",
          city: "New York",
          personality: { fearTolerance: 0.4, patience: 0.6, pride: 0.7, aggressionResponse: 0.5, riskAppetite: 0.6 }
        },
        {
          id: "broker-veil",
          name: "Broker 02",
          city: "Chicago",
          personality: { fearTolerance: 0.7, patience: 0.5, pride: 0.4, aggressionResponse: 0.6, riskAppetite: 0.7 }
        },
        {
          id: "broker-kite",
          name: "Broker 03",
          city: "Los Angeles",
          personality: { fearTolerance: 0.3, patience: 0.8, pride: 0.5, aggressionResponse: 0.4, riskAppetite: 0.5 }
        }
      ], []);

      const [selectedBroker, setSelectedBroker] = useState(brokers[0]);

      // Market data
      const cities = useMemo(() => ({
        "New York": { name: "New York", basePrice: [140, 190], reliability: "Stable", transitRisk: "Medium", transitHours: 10, culture: "Direct" },
        "Chicago": { name: "Chicago", basePrice: [130, 175], reliability: "Moderate", transitRisk: "Low", transitHours: 8, culture: "Formal" },
        "Los Angeles": { name: "Los Angeles", basePrice: [120, 170], reliability: "Volatile", transitRisk: "High", transitHours: 14, culture: "Guarded" },
        "Houston": { name: "Houston", basePrice: [125, 165], reliability: "Stable", transitRisk: "Medium", transitHours: 9, culture: "Direct" },
        "Phoenix": { name: "Phoenix", basePrice: [115, 160], reliability: "Moderate", transitRisk: "High", transitHours: 12, culture: "Casual" },
        "Philadelphia": { name: "Philadelphia", basePrice: [135, 180], reliability: "Stable", transitRisk: "Low", transitHours: 8, culture: "Reserved" }
      }), []);

      const verdantTierOptions = [
        { tier: "Standard", visibility: "Low", stability: "Stable" },
        { tier: "Premium", visibility: "High", stability: "Fragile" }
      ];

      const eventLogRef = useRef([]);

      const gameElapsedMs = Date.now() - bootTimestamp;
      const gameMinutes = Math.floor(gameElapsedMs / MS_PER_GAME_MINUTE);
      const gameDay = Math.floor(gameMinutes / 1440) + 1;
      const gameMonth = Math.floor(gameDay / 30) + 1;
      const gameHour = Math.floor((gameMinutes % 1440) / 60);
      const gameMinute = gameMinutes % 60;
      const gameTimeStr = `${String(gameHour).padStart(2, '0')}:${String(gameMinute).padStart(2, '0')}`;

      const displayName = (hasCustomNameUnlock && customName.trim()) ? customName : generatedName;

      const totalLiquidity = useMemo(() => {
        const debitTotal = debitAccounts.reduce((sum, a) => sum + a.balance, 0);
        const creditAvail = creditAccounts.reduce((sum, c) => sum + Math.max(c.limit - c.balance, 0), 0);
        return debitTotal + creditAvail + cashOnHand;
      }, [debitAccounts, creditAccounts, cashOnHand]);

      const totalDebt = useMemo(() => {
        const creditDebt = creditAccounts.reduce((sum, c) => sum + c.balance, 0);
        return creditDebt + studentDebt;
      }, [creditAccounts, studentDebt]);

      const addLog = (msg) => {
        eventLogRef.current = [{ id: Date.now() + Math.random(), text: msg }, ...eventLogRef.current].slice(0, 12);
      };

      // Generate contracts
      const generateContracts = useCallback(() => {
        return brokers.map((broker, index) => {
          const tier = index % 2 === 0 ? "Standard" : "Premium";
          const base = tier === "Premium" ? 190 : 130;
          const windowHours = Math.floor(Math.random() * 18 + 6);
          const durationMs = windowHours * 60 * MS_PER_GAME_MINUTE;
          return {
            id: `contract-${broker.id}-${Date.now()}-${index}`,
            brokerId: broker.id,
            title: `${broker.name} · ${broker.city}`,
            tier,
            quantityRange: [20, 80],
            priceBand: [base, base + 40],
            risk: index % 2 === 0 ? "Medium" : "High",
            createdAt: Date.now(),
            durationMs,
            remainingMs: durationMs,
            status: "Open"
          };
        });
      }, [brokers]);

      useEffect(() => {
        if (screen === "main" && contracts.length === 0) {
          setContracts(generateContracts());
        }
      }, [screen, contracts.length, generateContracts]);

      // Resolve shipment outcomes
      const resolveShipmentOutcome = (shipment) => {
        const outcomes = ["Delivered", "Delayed", "Partial Loss", "Disrupted"];
        const roll = Math.random();
        let outcome = outcomes[0];
        if (roll > 0.85) outcome = outcomes[3];
        else if (roll > 0.7) outcome = outcomes[2];
        else if (roll > 0.5) outcome = outcomes[1];

        setInventory((prev) => {
          const newInventory = { ...prev };
          if (outcome === "Delivered") newInventory[shipment.tier] = (newInventory[shipment.tier] || 0) + shipment.quantity;
          else if (outcome === "Delayed") newInventory[shipment.tier] = (newInventory[shipment.tier] || 0) + Math.floor(shipment.quantity * 0.8);
          else if (outcome === "Partial Loss") newInventory[shipment.tier] = (newInventory[shipment.tier] || 0) + Math.floor(shipment.quantity * 0.5);
          return newInventory;
        });

        setHeat((prev) => Math.min(prev + (outcome === "Disrupted" ? 6 : 2), 100));
        setReputation((prev) => Math.max(prev - (outcome === "Disrupted" ? 5 : 1), 0));

        if (shipment.deliveryMethod === "Personal") {
          setPersonalDeliveryActive(false);
        }

        return outcome;
      };

      // Update shipments and contracts
      const updateShipments = useCallback(() => {
        setShipments((prev) =>
          prev
            .map((shipment) => {
              const elapsed = Date.now() - shipment.createdAt;
              const remaining = shipment.durationMs - elapsed;
              if (remaining <= 0 && shipment.status === "In Transit") {
                const outcome = resolveShipmentOutcome(shipment);
                addLog(`Shipment ${shipment.id}: ${outcome}.`);
                return { ...shipment, status: outcome, remainingMs: 0 };
              }
              return { ...shipment, remainingMs: Math.max(remaining, 0) };
            })
            .filter((shipment) => shipment.status === "In Transit")
        );
      }, []);

      const updateContracts = useCallback(() => {
        setContracts((prev) =>
          prev
            .map((contract) => {
              const elapsed = Date.now() - contract.createdAt;
              const remaining = contract.durationMs - elapsed;
              if (remaining <= 0 && contract.status === "Open") {
                addLog(`Contract expired: ${contract.title}.`);
                return { ...contract, status: "Expired", remainingMs: 0 };
              }
              return { ...contract, remainingMs: Math.max(remaining, 0) };
            })
            .filter((contract) => contract.status !== "Expired")
        );
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          updateShipments();
          updateContracts();
        }, 1000);
        return () => clearInterval(interval);
      }, [updateShipments, updateContracts]);

      // Supply cost calculations
      const draftCityData = cities[supplyDraft.city] || cities["New York"];
      const payingDebit = debitAccounts.find((a) => a.id === supplyDraft.accountId);

      const draftUnit = useMemo(() => {
        if (!draftCityData) return 0;
        return supplyDraft.tier === "Premium" ? draftCityData.basePrice[1] : draftCityData.basePrice[0];
      }, [draftCityData, supplyDraft.tier]);

      const draftQty = useMemo(() => {
        const q = Number(supplyDraft.quantity);
        if (!Number.isFinite(q)) return 0;
        return Math.max(0, q);
      }, [supplyDraft.quantity]);

      const draftSubtotal = Number(draftUnit) * Number(draftQty);
      const courierServiceFee = supplyDraft.deliveryMethod === "Courier" ? draftSubtotal * 0.10 : 0;
      const draftFee = payingDebit ? draftSubtotal * 0.01 : 0;
      const draftTotal = draftSubtotal + draftFee + courierServiceFee;
      const canAfford = payingDebit ? payingDebit.balance >= draftTotal : false;

      // Place supply order
      const handlePlaceOrder = (event) => {
        event.preventDefault();

        if (personalDeliveryActive && supplyDraft.deliveryMethod === "Personal") {
          addLog("Delivery locked: you are currently delivering in person.");
          return;
        }

        const city = supplyDraft.city;
        const tier = supplyDraft.tier;
        const quantity = Number(supplyDraft.quantity);
        const accountId = supplyDraft.accountId;
        const deliveryMethod = supplyDraft.deliveryMethod;

        const cityData = cities[city];
        if (!cityData) {
          addLog("Market not found.");
          return;
        }

        const unit = tier === "Premium" ? cityData.basePrice[1] : cityData.basePrice[0];
        const subtotal = unit * quantity;
        const debit = debitAccounts.find((a) => a.id === accountId);
        if (!debit) {
          addLog("Payment account not found.");
          return;
        }

        const fee = subtotal * 0.01;
        const serviceFee = deliveryMethod === "Courier" ? subtotal * 0.10 : 0;
        const total = subtotal + fee + serviceFee;

        if (debit.balance < total) {
          addLog("Purchase blocked: insufficient funds.");
          return;
        }

        setDebitAccounts((prev) => prev.map((a) => (a.id === accountId ? { ...a, balance: a.balance - total } : a)));

        const transitMinutes = cityData.transitHours * 60;
        const baseDurationMs = transitMinutes * MS_PER_GAME_MINUTE;
        const durationMultiplier = deliveryMethod === "Personal" ? 2.6 : 1.0;
        const durationMs = baseDurationMs * durationMultiplier;

        const shipmentId = `S-${Math.floor(Math.random() * 9000 + 1000)}`;

        setShipments((prev) => [
          {
            id: shipmentId,
            city,
            tier,
            quantity,
            status: "In Transit",
            createdAt: Date.now(),
            durationMs,
            remainingMs: durationMs,
            deliveryMethod,
            serviceFee
          },
          ...prev
        ]);

        if (deliveryMethod === "Personal") {
          setPersonalDeliveryActive(true);
          addLog(`Personal delivery started: ${shipmentId} (${city}).`);
        } else {
          addLog(`Courier delivery queued: ${shipmentId} (${city}).`);
        }

        addLog(`Order placed: ${quantity} units (${tier}) from ${city}.`);
      };

      // Submit contract offer
      const handleSubmitOffer = (contract, quantity, price, payoutAccountId) => {
        const tierInventory = inventory[contract.tier] || 0;
        if (quantity > tierInventory) {
          addLog("Insufficient inventory for that offer.");
          return;
        }
        const accepted = Math.random() > 0.35;
        const status = accepted ? "Accepted" : "Counter";

        setContracts((prev) =>
          prev.map((item) => (item.id === contract.id ? { ...item, status, offer: { quantity, price } } : item))
        );

        if (accepted) {
          const revenue = quantity * price;
          setInventory((prev) => ({ ...prev, [contract.tier]: prev[contract.tier] - quantity }));

          setDebitAccounts((prev) =>
            prev.map((account) => (account.id === payoutAccountId ? { ...account, balance: account.balance + revenue } : account))
          );

          setReputation((prev) => Math.min(prev + 4, 100));
          setHeat((prev) => Math.min(prev + 3, 100));
          addLog(`Contract fulfilled: ${contract.title} (${revenue}).`);
        } else {
          addLog(`Countered: ${contract.title}.`);
        }
      };

      // Message system
      const toneKeywords = {
        polite: ["please", "appreciate", "thank", "respect"],
        pushy: ["urgent", "now", "immediately", "fast"],
        threatening: ["or else", "threat", "consequence", "pressure"],
        flattering: ["admire", "legend", "impressive", "trusted"]
      };

      const analyzeTone = (text) => {
        const lower = text.toLowerCase();
        let tone = "neutral";
        Object.entries(toneKeywords).forEach(([key, words]) => {
          if (words.some((word) => lower.includes(word))) tone = key;
        });
        return tone;
      };

      const getScriptedReply = (broker, tone) => {
        const base = {
          polite: "Noted. Keep the offer within the band and we can move.",
          neutral: "Send numbers you can stand behind.",
          pushy: "Don't rush the ledger. Window closes fast.",
          threatening: "That tone adds heat. Dial it back or we walk.",
          flattering: "Flattery helps. Bring a tight proposal and we'll listen."
        };
        return base[tone] || base.neutral;
      };

      const handleSendMessage = () => {
        const trimmed = messageInput.trim();
        if (!trimmed) return;

        const count = messageCounts[selectedBroker.id] || 0;
        if (count >= 5) {
          addLog(`Negotiation window closed for ${selectedBroker.name}.`);
          return;
        }

        const tone = analyzeTone(trimmed);
        const broker = selectedBroker;
        const reply = getScriptedReply(broker, tone);

        setMessages((prev) => {
          const existing = prev[broker.id] || [];
          return {
            ...prev,
            [broker.id]: [
              ...existing,
              { id: Date.now(), sender: "You", text: trimmed },
              { id: Date.now() + 1, sender: broker.name, text: reply }
            ]
          };
        });

        setMessageCounts((prev) => ({ ...prev, [broker.id]: (prev[broker.id] || 0) + 1 }));

        if (tone === "threatening") {
          setHeat((prev) => Math.min(prev + 6, 100));
          setReputation((prev) => Math.max(prev - 4, 0));
        } else if (tone === "pushy") {
          setHeat((prev) => Math.min(prev + 2, 100));
        }

        setMessageInput("");
      };

      const activeMessages = messages[selectedBroker.id] || [];

      const generateNameFromSet = () => {
        if (!selectedGender || !selectedNameSet) return;
        const set = nameSets[selectedNameSet];
        const firstNames = selectedGender === "Male" ? set.male : set.female;
        const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
        const lastName = set.surnames[Math.floor(Math.random() * set.surnames.length)];
        setGeneratedName(`${firstName} ${lastName}`);
      };

      useEffect(() => {
        if (selectedGender && selectedNameSet) {
          generateNameFromSet();
        }
      }, [selectedGender, selectedNameSet]);

      const canProceedFromIdentity = selectedGender && ((hasCustomNameUnlock && customName.trim()) || generatedName);
      const canProceedFromCity = selectedCity !== null;
      const canProceedFromEducation = !enrollInCollege || (collegeType && selectedMajor);

      const startGame = () => {
        // Apply education choices
        if (enrollInCollege) {
          if (collegeType === "Public University") {
            setStudentDebt(10000);
            addLog("Enrolled in public university with $10,000 in student loans.");
          } else if (collegeType === "Ivy League" && hasIvyLeagueUnlock) {
            if (hasSubscription) {
              addLog("Enrolled in Ivy League university with full-ride scholarship!");
            } else {
              addLog("Enrolled in Ivy League university.");
            }
          } else if (collegeType === "Community College") {
            addLog("Enrolled in community college (tuition-free).");
          }
          setJobTitle("Student");
          setMonthlyIncome(0);
        } else {
          setJobTitle("Entry-level Worker");
          setMonthlyIncome(2400);
        }

        setScreen("main");
      };

      return (
        <main className="relative min-h-screen">
          <div className="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900" />
          
          <div className="relative mx-auto flex min-h-screen w-full max-w-7xl flex-col gap-6 px-4 py-8">
            {/* Header */}
            <header className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="text-3xl font-semibold tracking-tight text-slate-100">Liquid Society</h1>
                <p className="text-sm text-slate-400">Navigate life in modern America</p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  type="button"
                  onClick={() => setShowShop(true)}
                  className="rounded-lg border border-slate-600 bg-slate-800/50 px-4 py-2 text-sm text-slate-300 transition hover:bg-slate-700/50"
                >
                  Store
                </button>

                {screen === "main" && (
                  <div className="flex items-center gap-3">
                    {hasSubscription && (
                      <span className="rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-emerald-300">
                        Premium
                      </span>
                    )}
                    <span className="rounded-lg border border-slate-700 bg-slate-800/50 px-3 py-1">
                      Day {gameDay} · {gameTimeStr}
                    </span>
                  </div>
                )}
              </div>
            </header>

            {/* Shop Modal */}
            {showShop && (
              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 px-4">
                <div className="w-full max-w-2xl rounded-xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
                  <div className="flex items-center justify-between border-b border-slate-700 pb-4">
                    <h2 className="text-xl font-semibold text-slate-100">Store</h2>
                    <button
                      type="button"
                      onClick={() => setShowShop(false)}
                      className="rounded-lg border border-slate-600 px-3 py-1 text-sm text-slate-300 transition hover:bg-slate-800"
                    >
                      Close
                    </button>
                  </div>

                  <div className="mt-6 grid gap-4 sm:grid-cols-3">
                    <div className="rounded-lg border border-slate-700 bg-slate-800/50 p-4">
                      <p className="text-sm font-semibold text-slate-200">Premium Subscription</p>
                      <p className="mt-2 text-xs text-slate-400">Full-ride scholarships, advanced features</p>

                    {/* UNDERGROUND MARKET - Redirects to supply */}
                    {activeTab === "underground-market" && (
                      <div className="rounded-xl border border-slate-700 bg-slate-900/80 p-6 backdrop-blur">
                        <div className="flex items-center justify-between border-b border-slate-700 pb-4">
                          <h2 className="text-xl font-semibold text-slate-100">🌿 Underground Market</h2>
                          <span className="rounded border border-amber-500/30 bg-amber-500/10 px-2 py-1 text-xs text-amber-300">
                            High Risk
                          </span>
                        </div>

                        <div className="mt-6 rounded-lg border border-amber-500/30 bg-amber-500/5 p-4">
                          <p className="text-sm text-slate-300">
                            Access to contraband markets. Activities here increase suspicion and carry legal risks.
                          </p>
                          <p className="mt-2 text-xs text-slate-400">
                            Current Suspicion Level: <span className="text-rose-300">{suspicion}%</span>
                          </p>
                        </div>

                        <div className="mt-4 rounded-lg border border-slate-700 bg-slate-800/50 p-4">
                          <p className="text-xs text-slate-400">This system is optional and unlocks progressively through gameplay.</p>
                        </div>
                      </div>
                    )}

                    {/* UNDERGROUND CONTACTS */}
                    {activeTab === "underground-contacts" && (
                      <div className="rounded-xl border border-slate-700 bg-slate-900/80 p-6 backdrop-blur">
                        <div className="flex items-center justify-between border-b border-slate-700 pb-4">
                          <h2 className="text-xl font-semibold text-slate-100">Underground Contacts</h2>
                          <button
                            type="button"
                            onClick={() => setActiveTab("contracts")}
                            className="text-sm text-emerald-300 hover:text-emerald-200"
                          >
                            Go to Contracts →
                          </button>
                        </div>

                        <div className="mt-6 rounded-lg border border-slate-700 bg-slate-800/50 p-4">
                          <p className="text-sm text-slate-300">
                            Build relationships with brokers through the Contracts and Messages tabs.
                          </p>
                          <p className="mt-2 text-xs text-slate-400">Active Brokers: {brokers.length}</p>
                        </div>
                      </div>
                    )}

                    {/* Event Log */}
                    <div className="rounded-xl border border-slate-700 bg-slate-900/80 p-4 backdrop-blur">
                      <p className="text-sm font-medium text-slate-300">Recent Activity</p>
                      <div className="mt-3 space-y-1 text-xs text-slate-400">
                        {eventLogRef.current.length === 0 ? (
                          <p>No recent activity</p>
                        ) : (
                          eventLogRef.current.map(log => (
                            <p key={log.id}>• {log.text}</p>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}
          </div>
        </main>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
