<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oath Of Office</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.0/dist/tailwind.min.css">
    <style>
        .notification-bubble {
            background-color: #f0f0f0;
            border-radius: 50%;
            position: relative;
            display: inline-block;
            width: 20px;
            height: 20px;
            text-align: center;
        }
        .notification-bubble::after {
            content: '';
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 p-4 text-white">
        <h1 class="text-2xl font-bold">Welcome to Oath Of Office</h1>
        <nav>
            <ul class="flex space-x-4">
                <li><a href="#" class="text-lg"><span>🔔</span> Notifications <span class="notification-bubble"></span></a></li>
                <li><a href="#" class="text-lg"><span>⚙️</span> Settings</a></li>
                <li><a href="#" class="text-lg"><span>❓</span> Help</a></li>
            </ul>
        </nav>
    </header>
    <main class="p-4">
        <h2 class="text-xl font-semibold">Enhanced Landing Page</h2>
        <p class="mb-4">This is an improved design with custom-styled inputs and emoji integration.</p>
        <form>
            <label for="name" class="block text-sm font-medium text-gray-700">Name:</label>
            <input type="text" id="name" class="mt-1 block w-full border rounded-md p-2" placeholder="Your Name" />
            
            <label for="email" class="block text-sm font-medium text-gray-700 mt-4">Email:</label>
            <input type="email" id="email" class="mt-1 block w-full border rounded-md p-2" placeholder="Your Email" />
            
            <button type="submit" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-md">Submit <span>🚀</span></button>
        </form>
    </main>
</body>
</html>
