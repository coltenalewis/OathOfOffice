<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oath of Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-200 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
      const App = () => {
        return (
          <main className="relative min-h-screen overflow-hidden bg-gradient-to-br from-slate-100 via-slate-200 to-slate-300">
            <div className="absolute inset-0 opacity-40">
              <div className="absolute -left-16 top-10 h-56 w-56 rounded-full bg-slate-300/60 blur-3xl" />
              <div className="absolute right-10 top-32 h-72 w-72 rounded-full bg-blue-200/60 blur-3xl" />
              <div className="absolute bottom-10 left-1/3 h-64 w-64 rounded-full bg-slate-400/40 blur-3xl" />
            </div>

            <div className="relative mx-auto flex min-h-screen w-full max-w-6xl items-center px-6 py-16">
              <div className="grid w-full gap-10 lg:grid-cols-[1.1fr_0.9fr]">
                <section className="space-y-6">
                  <span className="inline-flex items-center rounded-full border border-slate-400/60 bg-white/70 px-4 py-1 text-xs font-semibold uppercase tracking-[0.3em] text-slate-500">
                    Campaign Command Interface
                  </span>
                  <h1 className="text-4xl font-semibold uppercase tracking-[0.3em] text-slate-600 md:text-5xl">
                    Oath of Office
                  </h1>
                  <p className="max-w-xl text-lg leading-relaxed text-slate-600">
                    Step into the strategy room. Shape your candidate, manage your
                    message, and prepare for the race ahead with a crisp interface
                    inspired by modern political sims.
                  </p>
                  <div className="grid gap-4 sm:grid-cols-2">
                    <div className="rounded-2xl border border-slate-300/70 bg-white/80 p-4 shadow-sm">
                      <p className="text-xs font-semibold uppercase tracking-widest text-slate-500">
                        Preparedness
                      </p>
                      <div className="mt-3 h-2 w-full rounded-full bg-slate-200">
                        <div className="h-2 w-2/3 rounded-full bg-slate-500" />
                      </div>
                    </div>
                    <div className="rounded-2xl border border-slate-300/70 bg-white/80 p-4 shadow-sm">
                      <p className="text-xs font-semibold uppercase tracking-widest text-slate-500">
                        Momentum
                      </p>
                      <div className="mt-3 h-2 w-full rounded-full bg-slate-200">
                        <div className="h-2 w-1/2 rounded-full bg-blue-400" />
                      </div>
                    </div>
                  </div>
                </section>

                <section className="rounded-[32px] border border-slate-300/60 bg-white/90 p-8 shadow-2xl">
                  <div className="space-y-2">
                    <p className="text-sm font-semibold uppercase tracking-[0.25em] text-slate-400">
                      Create Account
                    </p>
                    <h2 className="text-2xl font-semibold text-slate-700">
                      Start your campaign
                    </h2>
                    <p className="text-sm text-slate-500">
                      Choose a username and password to create your strategist profile.
                    </p>
                  </div>

                  <form className="mt-8 space-y-6">
                    <label className="block space-y-2 text-sm font-medium text-slate-600">
                      Username
                      <input
                        type="text"
                        placeholder="Enter your username"
                        className="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-700 shadow-inner focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-300"
                      />
                    </label>
                    <label className="block space-y-2 text-sm font-medium text-slate-600">
                      Password
                      <input
                        type="password"
                        placeholder="Create a password"
                        className="w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-700 shadow-inner focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-300"
                      />
                    </label>
                    <button
                      type="button"
                      className="w-full rounded-xl bg-slate-700 px-4 py-3 text-sm font-semibold uppercase tracking-[0.2em] text-white shadow-lg shadow-slate-400/40 transition hover:bg-slate-600"
                    >
                      Sign Up
                    </button>
                  </form>

                  <div className="mt-8 rounded-2xl border border-dashed border-slate-300/80 bg-slate-50/80 p-4 text-xs uppercase tracking-[0.3em] text-slate-400">
                    Placeholder panel for future campaign intelligence widgets
                  </div>
                </section>
              </div>
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
