<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Into The Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: "Share Tech Mono", "Fira Mono", "JetBrains Mono", monospace;
      }

      .scanlines::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.05) 1px,
          rgba(0, 0, 0, 0.1) 1px,
          rgba(0, 0, 0, 0.1) 3px
        );
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .terminal-flicker {
        animation: flicker 3s infinite;
      }

      .glow-pulse {
        animation: glowPulse 2.4s ease-in-out infinite;
      }

      .boot-cursor {
        display: inline-block;
        width: 10px;
        height: 18px;
        background: #38f4c9;
        margin-left: 6px;
        animation: cursorBlink 1s steps(2, start) infinite;
      }

      .panel-overlay {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.3s ease, transform 0.3s ease;
        pointer-events: none;
      }

      .panel-overlay.is-open {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      @keyframes flicker {
        0%,
        19%,
        21%,
        23%,
        80%,
        100% {
          opacity: 1;
        }
        20%,
        22%,
        24%,
        81% {
          opacity: 0.7;
        }
      }

      @keyframes glowPulse {
        0%,
        100% {
          box-shadow: 0 0 12px rgba(56, 244, 201, 0.2);
        }
        50% {
          box-shadow: 0 0 24px rgba(56, 244, 201, 0.4);
        }
      }

      @keyframes cursorBlink {
        0%,
        50% {
          opacity: 1;
        }
        51%,
        100% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useCallback, useEffect, useMemo, useRef, useState } = React;

      const OPENAI_API_KEY = "PUT_YOUR_KEY_HERE";

      const servers = [
        { id: 1, name: "Obsidian Relay", location: "Frankfurt", status: "Secure", load: "14%" },
        { id: 2, name: "Midnight Spine", location: "Singapore", status: "Encrypted", load: "61%" },
        { id: 3, name: "Nocturne Gate", location: "Toronto", status: "Shielded", load: "32%" },
        { id: 4, name: "Ghostline Hub", location: "São Paulo", status: "Hidden", load: "48%" },
      ];

      const profileIcons = ["🎭", "💀", "🧠", "🔒", "👁️", "🦉"];

      const cityOptions = [
        { city: "Coastport", country: "Fictional", timeZone: "America/New_York" },
        { city: "Ironvale", country: "Fictional", timeZone: "America/Chicago" },
        { city: "Nightfall", country: "Fictional", timeZone: "America/Los_Angeles" },
        { city: "Sable Ridge", country: "Fictional", timeZone: "Europe/London" },
        { city: "Driftmark", country: "Fictional", timeZone: "Europe/Berlin" },
        { city: "Ashlock", country: "Fictional", timeZone: "Asia/Tokyo" },
      ];

      const usernameSeeds = ["Void", "Cipher", "Specter", "Glitch", "Ghost", "Zero", "Rogue", "Null", "Pulse", "Signal"];
      const usernameSuffixes = ["Walker", "Shade", "Node", "Runner", "Wire", "Crow"];

      const appModules = [
        { id: "supply", label: "Supply 🧪", status: "Online" },
        { id: "contracts", label: "Contracts 📑", status: "Live" },
        { id: "transit", label: "Transit 🚚", status: "Live" },
        { id: "network", label: "Network 🕸️", status: "Live" },
        { id: "map", label: "Map 🗺️", status: "Live" },
        { id: "messages", label: "Messages 🔐", status: "Live" },
        { id: "bank", label: "DarkVault Bank 🏦", status: "Secure" },
        { id: "facilities", label: "Facilities / Real Estate 🏗️", status: "Locked" },
      ];

      const loadingLines = [
        "[boot] establishing encrypted tunnel...",
        "[auth] negotiating shadow certificates...",
        "[relay] proxy chain stabilized...",
        "[sync] mirroring dark indices...",
        "[access] access key verified...",
      ];

      const brokers = [
        {
          id: "broker-onyx",
          name: "Broker Onyx",
          city: "Coastport",
          personality: {
            fearTolerance: 0.4,
            patience: 0.6,
            pride: 0.7,
            aggressionResponse: 0.5,
            riskAppetite: 0.6,
          },
        },
        {
          id: "broker-veil",
          name: "Broker Veil",
          city: "Ironvale",
          personality: {
            fearTolerance: 0.7,
            patience: 0.5,
            pride: 0.4,
            aggressionResponse: 0.6,
            riskAppetite: 0.7,
          },
        },
        {
          id: "broker-kite",
          name: "Broker Kite",
          city: "Nightfall",
          personality: {
            fearTolerance: 0.3,
            patience: 0.8,
            pride: 0.5,
            aggressionResponse: 0.4,
            riskAppetite: 0.5,
          },
        },
      ];

      const cities = {
        Coastport: {
          name: "Coastport",
          basePrice: [120, 160],
          reliability: "Stable",
          transitRisk: "Medium",
          transitHours: 10,
          culture: "Direct",
        },
        Ironvale: {
          name: "Ironvale",
          basePrice: [140, 180],
          reliability: "Moderate",
          transitRisk: "Low",
          transitHours: 8,
          culture: "Formal",
        },
        Nightfall: {
          name: "Nightfall",
          basePrice: [100, 150],
          reliability: "Volatile",
          transitRisk: "High",
          transitHours: 14,
          culture: "Guarded",
        },
      };

      const accountsTemplate = [
        { id: "wallet", label: "Wallet 💵", balance: 250, feePct: 0.01, delayMinutes: 0 },
        { id: "offshore", label: "Offshore 🏦", balance: 800, feePct: 0.03, delayMinutes: 30 },
        { id: "stash", label: "Stash 📦", balance: 400, feePct: 0.02, delayMinutes: 15 },
        { id: "business", label: "Business 🧾", balance: 600, feePct: 0.015, delayMinutes: 10 },
      ];

      const verdantTierOptions = [
        { tier: "Standard", visibility: "Low", stability: "Stable" },
        { tier: "Premium", visibility: "High", stability: "Fragile" },
      ];

      const toneKeywords = {
        polite: ["please", "appreciate", "thank", "respect"],
        pushy: ["urgent", "now", "immediately", "fast"],
        threatening: ["or else", "threat", "consequence", "pressure"],
        flattering: ["admire", "legend", "impressive", "trusted"],
      };

      const App = () => {
        const [screen, setScreen] = useState("landing");
        const [nextScreen, setNextScreen] = useState("servers");
        const [loadingProgress, setLoadingProgress] = useState(0);
        const [loadingLineIndex, setLoadingLineIndex] = useState(0);
        const [selectedServer, setSelectedServer] = useState(null);
        const [hasSubscription, setHasSubscription] = useState(false);
        const [hasCustomNamePass, setHasCustomNamePass] = useState(false);
        const [showShop, setShowShop] = useState(false);
        const [profileIcon, setProfileIcon] = useState(profileIcons[0]);
        const [username, setUsername] = useState("");
        const [customUsername, setCustomUsername] = useState("");
        const [selectedCity, setSelectedCity] = useState(cityOptions[0]);
        const [profileStep, setProfileStep] = useState(1);
        const [systemTime, setSystemTime] = useState(new Date());
        const [activeApp, setActiveApp] = useState("supply");
        const [accounts, setAccounts] = useState(accountsTemplate);
        const [inventory, setInventory] = useState({ Standard: 0, Premium: 0 });
        const [heat, setHeat] = useState(8);
        const [reputation, setReputation] = useState(35);
        const [shipments, setShipments] = useState([]);
        const [contracts, setContracts] = useState([]);
        const [selectedBroker, setSelectedBroker] = useState(brokers[0]);
        const [messages, setMessages] = useState({});
        const [messageInput, setMessageInput] = useState("");
        const [messageCounts, setMessageCounts] = useState({});
        const [bankAccount, setBankAccount] = useState(null);
        const [accountAlias, setAccountAlias] = useState("Main Vault");
        const [creditLine, setCreditLine] = useState(null);
        const [bootTimestamp] = useState(Date.now());
        const eventLogRef = useRef([]);

        useEffect(() => {
          setUsername(
            `${usernameSeeds[Math.floor(Math.random() * usernameSeeds.length)]}${
              usernameSuffixes[Math.floor(Math.random() * usernameSuffixes.length)]
            }${Math.floor(Math.random() * 900 + 100)}`
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => {
            setSystemTime(new Date());
          }, 1000);
          return () => clearInterval(interval);
        }, []);

        useEffect(() => {
          if (screen !== "loading") return;
          setLoadingProgress(0);
          setLoadingLineIndex(0);
          const interval = setInterval(() => {
            setLoadingProgress((prev) => {
              const nextValue = Math.min(prev + Math.floor(Math.random() * 14 + 6), 100);
              if (nextValue >= 100) {
                clearInterval(interval);
                setTimeout(() => setScreen(nextScreen), 500);
              }
              return nextValue;
            });
            setLoadingLineIndex((prev) => Math.min(prev + 1, loadingLines.length - 1));
          }, 450);

          return () => clearInterval(interval);
        }, [screen, nextScreen]);

        useEffect(() => {
          if (contracts.length === 0) {
            setContracts(generateContracts());
          }
        }, [contracts.length]);

        const msPerGameMinute = (5 * 60 * 1000) / (24 * 60);
        const gameElapsedMs = Date.now() - bootTimestamp;
        const gameMinutes = Math.floor(gameElapsedMs / msPerGameMinute);
        const gameDay = Math.floor(gameMinutes / 1440) + 1;
        const gameHour = Math.floor((gameMinutes % 1440) / 60);
        const gameMinute = gameMinutes % 60;
        const gameProgress = ((gameMinutes % 1440) / 1440) * 100;
        const gamePhase = useMemo(() => {
          if (gameHour < 6) return "Night Watch";
          if (gameHour < 12) return "Dawn Patrol";
          if (gameHour < 18) return "Day Shift";
          return "Blackout";
        }, [gameHour]);

        const localTimeLabel = useMemo(() => {
          return new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            timeZone: selectedCity.timeZone,
          }).format(systemTime);
        }, [selectedCity, systemTime]);

        const systemTimeLabel = useMemo(() => {
          return systemTime.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        }, [systemTime]);

        const displayUsername =
          hasCustomNamePass && customUsername.trim() ? customUsername : username;
        const profileProgress = useMemo(() => {
          let progress = 0;
          if (profileIcon) progress += 34;
          if ((hasCustomNamePass && customUsername.trim()) || username.trim()) progress += 33;
          if (selectedCity) progress += 33;
          return Math.min(progress, 100);
        }, [profileIcon, username, customUsername, selectedCity, hasCustomNamePass]);

        const profileComplete = profileProgress === 100;

        const totalCash = useMemo(() => {
          const accountTotal = accounts.reduce((sum, account) => sum + account.balance, 0);
          const creditAvailable = creditLine?.available || 0;
          return accountTotal + creditAvailable;
        }, [accounts, creditLine]);

        const addLog = (entry) => {
          eventLogRef.current = [
            { id: Date.now(), text: entry },
            ...eventLogRef.current,
          ].slice(0, 8);
        };

        const updateShipments = useCallback(() => {
          setShipments((prev) =>
            prev
              .map((shipment) => {
                const elapsed = Date.now() - shipment.createdAt;
                const remaining = shipment.durationMs - elapsed;
                if (remaining <= 0 && shipment.status === "In Transit") {
                  const outcome = resolveShipmentOutcome(shipment);
                  addLog(`Shipment ${shipment.id} resolved: ${outcome}.`);
                  return { ...shipment, status: outcome, remainingMs: 0 };
                }
                return { ...shipment, remainingMs: Math.max(remaining, 0) };
              })
              .filter((shipment) => shipment.status === "In Transit")
          );
        }, []);

        const updateContracts = useCallback(() => {
          setContracts((prev) =>
            prev
              .map((contract) => {
                const elapsed = Date.now() - contract.createdAt;
                const remaining = contract.durationMs - elapsed;
                if (remaining <= 0 && contract.status === "Open") {
                  addLog(`Contract ${contract.title} expired.`);
                  return { ...contract, status: "Expired", remainingMs: 0 };
                }
                return { ...contract, remainingMs: Math.max(remaining, 0) };
              })
              .filter((contract) => contract.status !== "Expired")
          );
        }, []);

        useEffect(() => {
          const interval = setInterval(() => {
            updateShipments();
            updateContracts();
          }, 1000);
          return () => clearInterval(interval);
        }, [updateShipments, updateContracts]);

        const resolveShipmentOutcome = (shipment) => {
          const outcomes = ["Delivered", "Delayed", "Partial Loss", "Disrupted"];
          const roll = Math.random();
          let outcome = outcomes[0];
          if (roll > 0.85) outcome = outcomes[3];
          else if (roll > 0.7) outcome = outcomes[2];
          else if (roll > 0.5) outcome = outcomes[1];

          setInventory((prev) => {
            const newInventory = { ...prev };
            if (outcome === "Delivered") {
              newInventory[shipment.tier] += shipment.quantity;
            } else if (outcome === "Delayed") {
              newInventory[shipment.tier] += Math.floor(shipment.quantity * 0.8);
            } else if (outcome === "Partial Loss") {
              newInventory[shipment.tier] += Math.floor(shipment.quantity * 0.5);
            }
            return newInventory;
          });

          setHeat((prev) => Math.min(prev + (outcome === "Disrupted" ? 6 : 2), 100));
          setReputation((prev) => Math.max(prev - (outcome === "Disrupted" ? 5 : 1), 0));
          return outcome;
        };

        const generateContracts = () => {
          return brokers.map((broker, index) => {
            const tier = index % 2 === 0 ? "Standard" : "Premium";
            const base = tier === "Premium" ? 190 : 130;
            const windowHours = Math.floor(Math.random() * 18 + 6);
            const durationMs = windowHours * 60 * msPerGameMinute;
            return {
              id: `contract-${broker.id}-${Date.now()}`,
              brokerId: broker.id,
              title: `${broker.name} · ${broker.city}`,
              tier,
              quantityRange: [20, 80],
              priceBand: [base, base + 40],
              risk: index % 2 === 0 ? "Medium" : "High",
              createdAt: Date.now(),
              durationMs,
              remainingMs: durationMs,
              status: "Open",
            };
          });
        };

        const handlePlaceOrder = (event) => {
          event.preventDefault();
          const form = new FormData(event.target);
          const city = form.get("city");
          const tier = form.get("tier");
          const quantity = Number(form.get("quantity"));
          const accountId = form.get("account");
          const cityData = cities[city];
          const basePrice = tier === "Premium" ? cityData.basePrice[1] : cityData.basePrice[0];
          const totalCost = basePrice * quantity;

          setAccounts((prev) =>
            prev.map((account) => {
              if (account.id !== accountId) return account;
              const fee = totalCost * account.feePct;
              const newBalance = Math.max(account.balance - totalCost - fee, 0);
              return { ...account, balance: newBalance };
            })
          );

          const transitMinutes = cityData.transitHours * 60;
          const durationMs = transitMinutes * msPerGameMinute;
          setShipments((prev) => [
            {
              id: `S-${Math.floor(Math.random() * 9000 + 1000)}`,
              city,
              tier,
              quantity,
              status: "In Transit",
              createdAt: Date.now(),
              durationMs,
              remainingMs: durationMs,
            },
            ...prev,
          ]);
          addLog(`Supply order placed: ${quantity} units (${tier}) from ${city}.`);
        };

        const handleSubmitOffer = (contract, quantity, price, payoutAccountId) => {
          const tierInventory = inventory[contract.tier] || 0;
          if (quantity > tierInventory) {
            addLog("Insufficient inventory for that offer.");
            return;
          }
          const accepted = Math.random() > 0.35;
          const status = accepted ? "Accepted" : "Counter";
          setContracts((prev) =>
            prev.map((item) =>
              item.id === contract.id ? { ...item, status, offer: { quantity, price } } : item
            )
          );
          if (accepted) {
            const revenue = quantity * price;
            setInventory((prev) => ({ ...prev, [contract.tier]: prev[contract.tier] - quantity }));
            setAccounts((prev) =>
              prev.map((account) =>
                account.id === payoutAccountId
                  ? { ...account, balance: account.balance + revenue }
                  : account
              )
            );
            setReputation((prev) => Math.min(prev + 4, 100));
            setHeat((prev) => Math.min(prev + 3, 100));
            addLog(`Contract fulfilled: ${contract.title} for $${revenue}.`);
          } else {
            addLog(`Broker countered: ${contract.title}.`);
          }
        };

        const analyzeTone = (text) => {
          const lower = text.toLowerCase();
          let tone = "neutral";
          Object.entries(toneKeywords).forEach(([key, words]) => {
            if (words.some((word) => lower.includes(word))) {
              tone = key;
            }
          });
          return tone;
        };

        const handleSendMessage = () => {
          const trimmed = messageInput.trim();
          if (!trimmed) return;
          const count = messageCounts[selectedBroker.id] || 0;
          if (count >= 5) {
            addLog(`Negotiation window closed for ${selectedBroker.name}.`);
            return;
          }
          const tone = analyzeTone(trimmed);
          const broker = selectedBroker;
          const reply = getScriptedReply(broker, tone);
          setMessages((prev) => {
            const existing = prev[broker.id] || [];
            return {
              ...prev,
              [broker.id]: [
                ...existing,
                { id: Date.now(), sender: "You", text: trimmed },
                { id: Date.now() + 1, sender: broker.name, text: reply },
              ],
            };
          });
          setMessageCounts((prev) => ({
            ...prev,
            [broker.id]: (prev[broker.id] || 0) + 1,
          }));
          if (tone === "threatening") {
            setHeat((prev) => Math.min(prev + 6, 100));
            setReputation((prev) => Math.max(prev - 4, 0));
          } else if (tone === "pushy") {
            setHeat((prev) => Math.min(prev + 2, 100));
          }
          setMessageInput("");
        };

        const getScriptedReply = (broker, tone) => {
          const base = {
            polite: "Respect noted. Keep the offer within the band and we can move.",
            neutral: "Keep it clean. Send the numbers you can stand behind.",
            pushy: "Pressure noted. Don’t rush the ledger or the window closes.",
            threatening: "That tone adds heat. Dial it back or we walk.",
            flattering: "Flattery helps. Bring a tight proposal and we’ll listen.",
          };
          return base[tone] || base.neutral;
        };

        const generateCardNumber = () => {
          const chunks = Array.from({ length: 3 }, () =>
            Math.floor(Math.random() * 9000 + 1000)
          );
          return `7777-${chunks.join("-")}`;
        };

        const handleCreateBankAccount = () => {
          if (bankAccount) return;
          setBankAccount({
            alias: accountAlias || "Primary Vault",
            balance: 0,
            id: `DV-${Math.floor(Math.random() * 900000 + 100000)}`,
          });
        };

        const handleRequestCreditLine = () => {
          if (creditLine) return;
          setCreditLine({
            limit: 500,
            available: 500,
            cardNumber: generateCardNumber(),
          });
        };

        const activeMessages = messages[selectedBroker.id] || [];

        return (
          <main className="relative min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-black text-slate-100">
            <div className="absolute inset-0 scanlines opacity-60" />
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(16,185,129,0.18),_transparent_55%)]" />

            <div className="relative mx-auto flex min-h-screen w-full max-w-6xl flex-col gap-8 px-6 py-10">
              <header className="flex flex-wrap items-center justify-between gap-4">
                <div>
                  <h1 className="text-3xl font-semibold tracking-[0.2em] text-emerald-100">
                    Into The Dark
                  </h1>
                  <p className="text-xs uppercase tracking-[0.6em] text-slate-400">
                    Dark Web Simulation
                  </p>
                </div>
                <div className="flex flex-wrap items-center gap-3">
                  <button
                    type="button"
                    onClick={() => setShowShop(true)}
                    className="rounded-md border border-emerald-400/40 bg-emerald-500/10 px-4 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200 transition hover:border-emerald-300 hover:text-emerald-100"
                  >
                    🛒
                  </button>
                  {screen === "dashboard" && (
                    <div className="flex flex-wrap items-center gap-3 text-xs uppercase tracking-[0.3em]">
                      {hasSubscription && (
                        <span className="rounded-md border border-emerald-400/40 bg-emerald-500/10 px-3 py-1 text-emerald-200">
                          [VIP]
                        </span>
                      )}
                      <span className="rounded-md border border-slate-700 px-3 py-1 text-slate-300">
                        {selectedServer?.name}
                      </span>
                      <span className="rounded-md border border-slate-700 px-3 py-1 text-slate-300">
                        {selectedCity.city}
                      </span>
                    </div>
                  )}
                </div>
              </header>

              <div
                className={`panel-overlay fixed inset-0 z-50 flex items-start justify-center overflow-y-auto bg-black/80 px-4 py-8 ${
                  showShop ? "is-open" : ""
                }`}
              >
                {showShop && (
                  <div className="w-full max-w-2xl rounded-lg border border-emerald-400/30 bg-slate-950 p-6 shadow-2xl shadow-emerald-500/20">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-xs uppercase tracking-[0.3em] text-emerald-400/70">
                          Black Ops Store
                        </p>
                        <p className="text-sm text-slate-300">
                          Test entitlements for subscription and custom handle access.
                        </p>
                      </div>
                      <button
                        type="button"
                        onClick={() => setShowShop(false)}
                        className="rounded-md border border-slate-700 px-3 py-1 text-xs uppercase tracking-[0.3em] text-slate-300"
                      >
                        Close
                      </button>
                    </div>
                    <div className="mt-6 grid gap-4 sm:grid-cols-2">
                      <div className="rounded-md border border-slate-700/70 bg-black/70 p-4 text-sm text-slate-300">
                        <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                          Test Subscription
                        </p>
                        <p className="mt-2 text-sm text-slate-300">
                          Unlock premium status for experimental features.
                        </p>
                        <button
                          type="button"
                          onClick={() => setHasSubscription(true)}
                          className="mt-4 w-full rounded-md border border-emerald-400/60 px-4 py-2 text-xs font-semibold uppercase tracking-[0.3em] text-emerald-200 transition hover:border-emerald-300 hover:text-emerald-100"
                        >
                          Activate Test Subscription
                        </button>
                        {hasSubscription && (
                          <p className="mt-3 text-xs uppercase tracking-[0.3em] text-emerald-200">
                            Active
                          </p>
                        )}
                      </div>
                      <div className="rounded-md border border-amber-400/40 bg-black/70 p-4 text-sm text-slate-300">
                        <p className="text-xs uppercase tracking-[0.3em] text-amber-300">
                          Custom Handle Pass
                        </p>
                        <p className="mt-2 text-sm text-slate-300">

                                      Verdant {contract.tier} · Qty {contract.quantityRange.join("-")}
                                    </p>
                                    <p className="text-xs text-slate-400">
                                      Price band ${contract.priceBand.join("-")} · Risk {contract.risk}
                                    </p>
                                  </div>
                                  <div className="text-xs text-slate-400">
                                    {Math.ceil(contract.remainingMs / 1000)}s
                                  </div>
                                </div>
                                {contract.status === "Open" ? (
                                  <div className="mt-3 grid gap-2 sm:grid-cols-4">
                                    <input
                                      type="number"
                                      min={contract.quantityRange[0]}
                                      max={contract.quantityRange[1]}
                                      placeholder="Qty"
                                      className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                      id={`${contract.id}-qty`}
                                    />
                                    <input
                                      type="number"
                                      min={contract.priceBand[0]}
                                      max={contract.priceBand[1]}
                                      placeholder="$ / unit"
                                      className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                      id={`${contract.id}-price`}
                                    />
                                    <select
                                      id={`${contract.id}-account`}
                                      className="rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                    >
                                      {accounts.map((account) => (
                                        <option key={account.id} value={account.id}>
                                          {account.label}
                                        </option>
                                      ))}
                                    </select>
                                    <button
                                      type="button"
                                      onClick={() => {
                                        const quantity = Number(
                                          document.getElementById(`${contract.id}-qty`).value
                                        );
                                        const price = Number(
                                          document.getElementById(`${contract.id}-price`).value
                                        );
                                        const payoutAccountId = document.getElementById(
                                          `${contract.id}-account`
                                        ).value;
                                        handleSubmitOffer(contract, quantity, price, payoutAccountId);
                                      }}
                                      className="rounded-md border border-emerald-400/50 px-3 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200"
                                    >
                                      Submit Offer
                                    </button>
                                  </div>
                                ) : (
                                  <p className="mt-3 text-xs text-slate-400">Status: {contract.status}</p>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {activeApp === "transit" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Transit</p>
                          <div className="mt-4 space-y-3 text-sm text-slate-300">
                            {shipments.length === 0 && <p>No shipments in transit.</p>}
                            {shipments.map((shipment) => (
                              <div key={shipment.id} className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                                <div className="flex items-center justify-between">
                                  <p className="text-emerald-100">{shipment.id}</p>
                                  <span className="text-xs text-slate-400">{shipment.status}</span>
                                </div>
                                <p className="text-xs text-slate-400">
                                  {shipment.city} · {shipment.quantity} units · {shipment.tier}
                                </p>
                                <p className="text-xs text-slate-400">
                                  ETA: {Math.ceil(shipment.remainingMs / 1000)}s
                                </p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {activeApp === "network" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Network</p>
                          <div className="mt-4 grid gap-4 md:grid-cols-2 text-sm text-slate-300">
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Reputation</p>
                              <p className="mt-2 text-lg text-emerald-100">{reputation}%</p>
                              <div className="mt-2 h-2 rounded-md bg-slate-800">
                                <div
                                  className="h-2 rounded-md bg-gradient-to-r from-emerald-400 to-emerald-200"
                                  style={{ width: `${reputation}%` }}
                                />
                              </div>
                            </div>
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Exposure</p>
                              <p className="mt-2 text-lg text-rose-200">{heat}%</p>
                              <div className="mt-2 h-2 rounded-md bg-slate-800">
                                <div
                                  className="h-2 rounded-md bg-gradient-to-r from-rose-400 to-amber-300"
                                  style={{ width: `${heat}%` }}
                                />
                              </div>
                            </div>
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Accounts</p>
                              <div className="mt-2 space-y-2 text-xs">
                                {accounts.map((account) => (
                                  <div key={account.id} className="flex items-center justify-between">
                                    <span>
                                      {account.label} · Fee {(account.feePct * 100).toFixed(1)}% · Delay{" "}
                                      {account.delayMinutes}m
                                    </span>
                                    <span>${account.balance.toFixed(2)}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">Inventory</p>
                              <div className="mt-2 space-y-2 text-xs">
                                <div className="flex items-center justify-between">
                                  <span>Verdant Standard</span>
                                  <span>{inventory.Standard}</span>
                                </div>
                                <div className="flex items-center justify-between">
                                  <span>Verdant Premium</span>
                                  <span>{inventory.Premium}</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {activeApp === "map" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Map</p>
                          <div className="mt-4 grid gap-3 md:grid-cols-3 text-sm text-slate-300">
                            {Object.values(cities).map((city) => (
                              <div key={city.name} className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                                <p className="text-emerald-100">{city.name}</p>
                                <p className="text-xs text-slate-400">Reliability: {city.reliability}</p>
                                <p className="text-xs text-slate-400">Culture: {city.culture}</p>
                                <p className="text-xs text-slate-400">Risk: {city.transitRisk}</p>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {activeApp === "messages" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <div className="flex items-center justify-between">
                            <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">Messages</p>
                            <span className="text-xs text-slate-500">
                              AI mode: {OPENAI_API_KEY === "PUT_YOUR_KEY_HERE" ? "Scripted" : "Live"}
                            </span>
                          </div>
                          <div className="mt-4 grid gap-4 lg:grid-cols-[0.35fr_1fr]">
                            <div className="space-y-2">
                              {brokers.map((broker) => (
                                <button
                                  key={broker.id}
                                  type="button"
                                  onClick={() => setSelectedBroker(broker)}
                                  className={`w-full rounded-md border px-3 py-2 text-left text-xs uppercase tracking-[0.3em] transition ${
                                    selectedBroker.id === broker.id
                                      ? "border-emerald-300 bg-emerald-500/10 text-emerald-100"
                                      : "border-slate-800 bg-black/60 text-slate-300"
                                  }`}
                                >
                                  {broker.name}
                                </button>
                              ))}
                            </div>
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Thread · {selectedBroker.name}
                              </p>
                              <div className="mt-3 h-52 space-y-3 overflow-y-auto text-xs text-slate-300">
                                {activeMessages.length === 0 && (
                                  <p className="text-slate-500">
                                    Initiate negotiation. Tone matters.
                                  </p>
                                )}
                                {activeMessages.map((message) => (
                                  <div key={message.id} className="rounded-md border border-slate-800 bg-black/60 p-2">
                                    <p className="text-[10px] uppercase tracking-[0.3em] text-slate-500">
                                      {message.sender}
                                    </p>
                                    <p>{message.text}</p>
                                  </div>
                                ))}
                              </div>
                              <div className="mt-3 flex gap-2">
                                <input
                                  type="text"
                                  value={messageInput}
                                  onChange={(event) => setMessageInput(event.target.value)}
                                  placeholder="Compose message..."
                                  className="flex-1 rounded-md border border-slate-700 bg-black/70 px-3 py-2 text-xs text-slate-100"
                                />
                                <button
                                  type="button"
                                  onClick={handleSendMessage}
                                  className="rounded-md border border-emerald-400/60 px-3 py-2 text-xs uppercase tracking-[0.3em] text-emerald-200"
                                >
                                  Send
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      )}

                      {activeApp === "bank" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">
                            DarkVault Bank
                          </p>
                          <div className="mt-4 space-y-4">
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4 text-sm text-slate-300">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Vault status
                              </p>
                              {bankAccount ? (
                                <div className="mt-3 space-y-2">
                                  <p className="text-lg font-semibold text-emerald-100">
                                    {bankAccount.alias}
                                  </p>
                                  <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                    Account ID: {bankAccount.id}
                                  </p>
                                  <p className="text-sm text-slate-300">
                                    Balance: ${bankAccount.balance.toFixed(2)} USD
                                  </p>
                                </div>
                              ) : (
                                <p className="mt-3 text-sm text-slate-400">
                                  No vault created. Submit a request to open your first account.
                                </p>
                              )}
                            </div>
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Request account
                              </p>
                              <div className="mt-3 grid gap-3 sm:grid-cols-2">
                                <input
                                  type="text"
                                  value={accountAlias}
                                  onChange={(event) => setAccountAlias(event.target.value)}
                                  placeholder="Account alias"
                                  disabled={!!bankAccount}
                                  className="w-full rounded-md border border-slate-700 bg-black/70 px-4 py-3 text-sm text-slate-100 focus:border-emerald-300 focus:outline-none disabled:cursor-not-allowed disabled:text-slate-500"
                                />
                                <div className="flex items-center rounded-md border border-slate-800 bg-black/60 px-4 py-3 text-xs uppercase tracking-[0.3em] text-slate-500">
                                  Initial balance: $0.00
                                </div>
                              </div>
                              <button
                                type="button"
                                onClick={handleCreateBankAccount}
                                disabled={!!bankAccount}
                                className={`mt-4 w-full rounded-md px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                                  bankAccount
                                    ? "cursor-not-allowed bg-slate-800 text-slate-500"
                                    : "bg-emerald-500/20 text-emerald-100 hover:bg-emerald-400/30"
                                }`}
                              >
                                {bankAccount ? "Account Active" : "Submit Request"}
                              </button>
                            </div>
                            <div className="rounded-md border border-slate-800 bg-slate-950/70 p-4 text-sm text-slate-300">
                              <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                Credit line request
                              </p>
                              {creditLine ? (
                                <div className="mt-3 space-y-2">
                                  <p className="text-sm text-slate-300">
                                    Approved limit: ${creditLine.limit.toFixed(2)} USD
                                  </p>
                                  <p className="text-sm text-slate-300">
                                    Available: ${creditLine.available.toFixed(2)} USD
                                  </p>
                                  <p className="text-xs uppercase tracking-[0.3em] text-slate-400">
                                    Card: {creditLine.cardNumber}
                                  </p>
                                </div>
                              ) : (
                                <p className="mt-3 text-sm text-slate-400">
                                  Apply for a $500 line of credit for immediate access.
                                </p>
                              )}
                              <button
                                type="button"
                                onClick={handleRequestCreditLine}
                                disabled={!!creditLine}
                                className={`mt-4 w-full rounded-md px-4 py-3 text-xs font-semibold uppercase tracking-[0.3em] transition ${
                                  creditLine
                                    ? "cursor-not-allowed bg-slate-800 text-slate-500"
                                    : "bg-amber-500/20 text-amber-200 hover:bg-amber-400/30"
                                }`}
                              >
                                {creditLine ? "Credit Active" : "Apply for Credit"}
                              </button>
                            </div>
                          </div>
                        </div>
                      )}

                      {activeApp === "facilities" && (
                        <div className="rounded-md border border-slate-700/70 bg-black/60 p-5 text-sm text-slate-300">
                          <p className="text-xs uppercase tracking-[0.3em] text-emerald-300">
                            Facilities / Real Estate
                          </p>
                          <p className="mt-3 text-slate-400">
                            Locked. Expansion nodes will unlock after reputation tiers increase.
                          </p>
                        </div>
                      )}

                      <div className="rounded-md border border-slate-800 bg-black/60 p-4 text-xs text-slate-400">
                        <p className="uppercase tracking-[0.3em] text-slate-500">Event Log</p>
                        <div className="mt-2 space-y-1">
                          {eventLogRef.current.length === 0 && (
                            <p>No events logged yet.</p>
                          )}
                          {eventLogRef.current.map((entry) => (
                            <p key={entry.id}>• {entry.text}</p>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              )}
            </div>
          </main>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
